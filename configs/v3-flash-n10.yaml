# As configs/v3-flash.yaml with normalize_card/v10 (the prospective pool, scripts/prospective.py).
# Method v3 on the calibration setup of configs/v2-flash-msearch.yaml.
# Method v2 as configs/v2-flash.yaml, with the model-written literature search (search: model, at the end).
# Method v2 with DeepSeek V4.1 Flash (snapshot 2026-10-17) as the verifier, through CometAPI (COMET_API_KEY,
# ALLOW_PAID=1). The normalizer stays on the google family, as in configs/v2.yaml, so cards are comparable.
# The snapshot name is pinned: the alias `deepseek-flash` moves with the next update. Run with
# `--verifiers deepseek` so that only this family verifies.
rpm: 30
concurrency: 4
generation:
  temperature: 0.0          # calibration 2026-11-02: less run-to-run variation of the cards
  max_tokens: 4000
timeout: 150
max_retries: 0
deadline: 180
models:
  # normalizer: Gemini 3.5 Flash through its native endpoint with hidden reasoning off (thinking_level minimal since 2026-11-01:
  # thinkingBudget 0 stopped being honoured, see hyparena/llm/gemini_native_runner.py) (accepted by L1.18, 2026-10-30; through the
  # OpenAI-compatible endpoint CometAPI cannot switch the reasoning off and bills it as output). Runs before 2026-10-30 used that endpoint.
  - {family: google, provider: gemini_native, model: "gemini-3.5-flash", tier: paid, api_key_env: COMET_API_KEY, generation: {thinking_level: minimal}}
  # thinking off: with thinking on, the model spends the whole output budget on hidden reasoning (6000 of 6000
  # tokens, no answer) in about half of the verifier calls, and neither reasoning_effort nor a token budget is
  # honoured through CometAPI (tested 2026-10-20); off, a call takes about 5 s and 800 tokens
  - {family: deepseek, provider: cometapi, model: "deepseek-v4.1-flash-1017", tier: paid, api_key_env: COMET_API_KEY,
     generation: {max_tokens: 4000, extra_body: {thinking: {type: disabled}}}}

# Literature search with model-written queries, the light guard and citation expansion (hyparena/card/search.py; retrieval
# calibration 2026-11-02, scripts/retrieval_eval.py). Without this key the keyword queries are used, as in earlier runs.
search: model_population   # 2026-11-11 (H49 walkthrough): the exact-population query first; the pool of 2026-11-06 ran with `model`
# Graded admission of adjacent-population and same-class records for claims about humans (hyparena/card/rules.py,
# `adjacent`; calibration 2026-11-02).
admission: graded

# Method v3 (docs/archive/spec/method-v3.md): normalize_card/v7 (mechanism chain), the v3 verifier template, proposed alternatives, the
# v3 rules (rules_v3: P, W, I, V, gate). verify_claim/v9 since 2026-11-05: extraction accepted on design, comparison and n
# (specs/extraction-gold-v9-2026-11-05.yaml; relevance recall about 0.6, precision 1.0; the second relevance question is not used).
method: v3
verify_version: v9
normalize_version: v17   # normalize_card/v17 (2026-11-14): v16 + the experiment's prediction as a field, the control from the arms, one form for outcome claims (code checks); passed the rule on the 40 registry texts (specs/benchmark-card-2026-11-12.yaml, v17_all90_2026_11_14); v16: outcome / mechanism step / premise, main factor, population condition, topic and identifiers
normalize_runs: 1        # one parse (2026-11-14: a second parse added recall +0.04 and cost half of the calls; 2 = the union of two parses)
