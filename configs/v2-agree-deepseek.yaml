# One verifier family only, for the agreement check L1.10 (specs/validation-criteria.yaml): cards are reused, only the verifier changes,
# and with one family in the config the pipeline cannot fall back to another one. Needs COMET_API_KEY and ALLOW_PAID=1.
rpm: 30
concurrency: 4
deadline: 180
timeout: 150
max_retries: 0
generation:
  temperature: 0.2
  max_tokens: 4000
models:
  - {family: deepseek, provider: cometapi, model: "deepseek-v4.1-flash-1017", tier: paid, api_key_env: COMET_API_KEY,
     generation: {max_tokens: 4000, extra_body: {thinking: {type: disabled}}}}
