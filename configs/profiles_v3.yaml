# ASPID profiles over the axes of method v3 (user decision 2026-11-05, "for a trial"): the axes are indicators and ASPID
# aggregates them with random weights under each profile's order of importance, instead of the fixed product V = P x W x I
# (which is one point of this family: equal weights on the log scale). hyparena/card/aspid_v3.py.
# Indicators: P, W, I, I_headroom (I if the experiment cut off every supported alternative), feasibility (method-v3.md 9.4),
# endpoint_clinical (2026-11-06, specs/estimand-2026-11-06.yaml: kappa 0.93 between two families, |rho| <= 0.42 with every
# other indicator) in the lowest tier of evidence and funding; trial-2 profiles. Earlier: in the lowest tier three refinements from the records (hyparena/card/v3_extra.py): best design for the outcome link,
# independent sources for it, share of the chain's weight against. Unknown values are drawn over their range.
# the v2 indicator set: human safety data exist or not; unknown is drawn over its range). P, I and I_headroom are on log
# scales, so the aggregation is a randomly weighted geometric mean: a near-zero plausibility is not compensated.
# v3.4 (2026-11-07, specs/v34-frontier-2026-11-07.yaml): P is non-refutation; against_share left every profile (|rho| with P
# 0.87 on 127 units, the admission rule); novelty N joined evolution and funding; frontier is a fourth profile. leverage,
# W_potential and literature_density are defined (aspid_v3.SPECS) but failed the admission rule on the trial pools and are in
# no profile.
profiles:
  evidence:
    version: "trial-4"
    description: "Plausibility of the mechanism first, then how much of it is supported, then what the experiment teaches, then reach."
    indicators: [P, support_share, I, W, best_design_outcome, independent_outcome, endpoint_clinical]
    tiers: [[P], [support_share], [I], [W], [best_design_outcome, independent_outcome, endpoint_clinical]]
  evolution:
    version: "trial-3"
    description: "Room to grow: what the hypothesis could teach with a better experiment and how new it is, then plausibility, then reach."
    indicators: [I_headroom, N, P, support_share, W, best_design_outcome, independent_outcome]
    tiers: [[I_headroom, N], [P], [support_share, W], [best_design_outcome, independent_outcome]]
  funding:
    version: "trial-5"
    description: "Ready to fund (merged with the investor draft, user decision 2026-11-06): plausibility, then feasibility, then rising attention, the role of AI and novelty, then informativeness, then reach and the refinements."
    indicators: [P, feasibility, trend_pubmed, ai_role, N, I, support_share, W, endpoint_clinical, best_design_outcome, independent_outcome]
    tiers: [[P], [feasibility], [trend_pubmed, ai_role, N], [I, support_share], [W, endpoint_clinical, best_design_outcome, independent_outcome]]
  frontier:
    version: "trial-1"
    description: "Exploratory programmes (ARPA-H, Foresight, early R&D; user decision 2026-11-07): novelty first, then that nothing refutes it, then what the experiment teaches and its cost. Support share is left out on purpose: it rewards the known."
    indicators: [N, P, I, feasibility]
    tiers: [[N], [P], [I, feasibility]]
