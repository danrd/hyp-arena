# Method v2 with your own provider keys (direct APIs, no aggregator). Set ALLOW_PAID=1 and the key of at least
# one provider: OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY (also DEEPSEEK_API_KEY, XAI_API_KEY,
# MISTRAL_API_KEY for the commented specs). Families whose key is not set are skipped (`skip_missing_keys`).
# With one key, one family normalizes and verifies; with several, the verifier rotates over them and the
# normalizer runs on google when its key is set, else on the first family listed.
# Model ids change: check each provider's model list. Claude runs on claude-sonnet-5-5 ($2 / $10 per million
# tokens in / out); claude-opus-5-5 is stronger, claude-haiku-5-5 cheaper. Claude takes no temperature, and its
# depth is set by `effort`.
rpm: 30
concurrency: 4
skip_missing_keys: true
generation:
  temperature: 0.2
  max_tokens: 4000
timeout: 150
max_retries: 0
deadline: 300
models:
  - {family: google,    provider: google,    model: "gemini-3.5-flash", tier: paid}
  - {family: openai,    provider: openai,    model: "gpt-5-mini",       tier: paid, generation: {temperature: null, max_tokens: null, max_completion_tokens: 6000, reasoning_effort: low}}
  - {family: anthropic, provider: anthropic, model: "claude-sonnet-5-5", tier: paid, generation: {max_tokens: 16000, effort: low}}
  # - {family: deepseek, provider: deepseek, model: "<model id>", tier: paid}
  # - {family: xai,      provider: xai,      model: "<model id>", tier: paid}
  # - {family: mistral,  provider: mistral,  model: "<model id>", tier: paid}
