# Level 4 (specs/evolution/generation-comparison-2026-11-14.yaml): the judges and the rewriter of the generation comparison.
# Cheap tier for the pilot and the dry run; the models of the real run are named with their prices before it (CometAPI,
# COMET_API_KEY, ALLOW_PAID=1). A writer's family is never a judge: scripts/evolution/generation_compare.py drops it
# (google when Argon writes, openai when ChatGPT does). The rewriter's family is not a judge either.
rpm: 30
concurrency: 4
generation:
  temperature: 0.0
  max_tokens: 1500
timeout: 120
max_retries: 1
deadline: 150
rewriter: xiaomi
# the judge's question (scripts/evolution/generation_compare.py MODE): the pilot of 2026-11-16 asks one question (v2), no rubric
judge: {pair_version: v2, rubric: false, rewrite: false}   # 2026-11-17: no rewriting (the rewriter's noise); references cut by code
models:
  - {family: openai,    provider: cometapi, model: "gpt-5-nano",                tier: paid, api_key_env: COMET_API_KEY}
  - {family: anthropic, provider: cometapi, model: "claude-haiku-4-5-20251001", tier: paid, api_key_env: COMET_API_KEY}
  - {family: xai,       provider: cometapi, model: "grok-4.3",                  tier: paid, api_key_env: COMET_API_KEY}
  - {family: deepseek,  provider: cometapi, model: "deepseek-v4.1-flash-1017",  tier: paid, api_key_env: COMET_API_KEY,
     generation: {extra_body: {thinking: {type: disabled}}}}
  - {family: qwen,      provider: cometapi, model: "qwen3.8-flash",             tier: paid, api_key_env: COMET_API_KEY}
  - {family: zhipu,     provider: cometapi, model: "glm-5.3-flash",             tier: paid, api_key_env: COMET_API_KEY, enabled: false}   # GLM; off 2026-11-17: no answer on the judge prompt (99 s, empty)
  - {family: xiaomi,    provider: cometapi, model: "mimo-v2.5",                 tier: paid, api_key_env: COMET_API_KEY}
