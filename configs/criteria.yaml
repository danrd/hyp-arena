# Criteria the judges compare on, one verdict per criterion per comparison.
# Each criterion gets its own Bradley-Terry rating. They are combined without numeric weights: only the
# order of importance below is given, and the final order comes from randomized aggregation over all
# weight vectors consistent with it (МРСП, hyparena/aggregate.py), with spreads and dominance
# probabilities. The report also shows the Pareto front over all criteria.
# Default set: the separated criteria of the working notes. Cost and time of the decisive
# experiment are meant to be estimated from registries later, not judged.
version: criteria-v2
# Most to least important (decision 2026-10-15; to be set with experts). A nested list = equal importance.
importance: [value, evidence_support, testability, novelty]
criteria:
  - name: novelty
    description: >-
      How far the hypothesis goes beyond the retrieved evidence. Judge only against the evidence
      shown: an idea already stated there is not novel, and absence of evidence shown is not proof of novelty.
  - name: evidence_support
    description: >-
      Independent lines of supporting evidence (species, study type, effect size, replication).
      Contradicting evidence counts against. Claims without a source count as assumptions.
  - name: testability
    description: >-
      A decisive test, or a test of a necessary condition, is possible with available model systems,
      methods or public data, and the hypothesis states results that would refute it.
  - name: value
    description: >-
      What would be learned or gained if it holds: progress against ageing, and how well a test
      discriminates between competing explanations.
