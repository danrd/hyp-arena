# Release dates and cutoffs of the models the backtests may use (Working_Notes A2, decided 2026-10-20). A model may judge
# a backtest pool as of T only if its training cutoff is <= T. Cutoff: the stated one when the provider states it, else the
# heuristic release date minus 6 months. A model without a release date or cutoff here is not eligible.
# Stated cutoffs (2026-10-30) come from data/models/llm_cutoffs.yaml (the developers' pages; end of the stated period; for
# Anthropic the training data cutoff). gemini-3.5-flash and deepseek-v4.1-flash-1017 have no stated cutoff: heuristic only.
heuristic_months: 6
models:
  gemini-3.5-flash: {released: "2026-05-19"}
  deepseek-v4.1-flash-1017: {released: "2026-10-17"}
  gpt-4o: {cutoff: "2023-10-01"}
  gpt-4.1: {cutoff: "2024-06-01"}
  o3: {cutoff: "2024-06-01"}
  gpt-5-nano: {cutoff: "2024-05-31"}
  gpt-5: {cutoff: "2024-09-30"}
  gpt-5.1: {cutoff: "2024-09-30"}
  claude-haiku-4-5-20251001: {cutoff: "2025-07-31"}
  claude-opus-4-5-20251101: {cutoff: "2025-08-31"}
  claude-sonnet-4-6: {cutoff: "2026-01-31"}
  gemini-2.0-flash: {cutoff: "2024-08-31"}
  gemini-2.5-pro: {cutoff: "2025-01-31"}
  gemini-2.5-flash: {cutoff: "2025-01-31"}
  llama-3.1-405b-instruct: {cutoff: "2023-12-31"}
