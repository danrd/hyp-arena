  - {id: itp-2023-dmf, program: ITP, pmid: "38041783", public_date: "2023-12-02", compound: dimethyl fumarate, species: mouse, strain: UM-HET3, route: diet,
     label: no_effect, quote: "Amounts of dimethyl fumarate in the diet averaged 35% of the target dose, which may explain the absence of lifespan effects.",
