# Post-2022 outcomes of the multi-site programs (ITP: mice; CITP: Caenorhabditis), for backtests with T after
# 2022 (card spec 8a, Data_Sources 9.4). Curated by hand from the PubMed abstracts of the batch papers on
# 2026-10-20; every `quote` is verbatim from the abstract of `pmid` (python -m hyparena.backtest check-outcomes).
# DrugAge is not a source here: its invertebrate entries end around 2021 and Build 5 added 7 papers from
# 2023-2024 only.
#
# Unit = one compound tested in one regimen (dose, start age): a repeat at another dose or start age is a
# separate test (`repeat_of`). label: supports (a significant increase of lifespan in at least one sex) |
# no_effect | harmful (only a significant decrease). Sex-specific results and effect sizes are kept apart
# (`by_sex`, `effect_percent`: % change of median lifespan as the abstract states it).
# public_date: first public date (e-pub; preprint where known, Data_Sources 9.4); date_precision "year" when
# PubMed gives only the year (the date then is the first of January: such tests leave the pool earlier,
# which errs on the side of no leakage).
# Not labelled (the abstract does not state the result): the rapamycin + acarbose combination started at 16
# months and sodium thiosulfate (36179270, 38753230), 17alpha-estradiol, acarbose and rapamycin in CITP
# (37923874), the three unnamed compounds of 41843349, and 42694712 (an FUdR dependence study, not a test).
tests:
  # ---- ITP C2017 cohort (PMID 36179270, online 2022-09-30) ----
  - {id: itp-2022-bd, program: ITP, pmid: "36179270", public_date: "2022-09-30", compound: "(R/S)-1,3-butanediol", species: mouse, strain: UM-HET3, route: diet,
     label: no_effect, quote: "BD seemed to produce a small (2%) increase in females, but only if the analysis included data from the site with unusually short-lived controls.",
     notes: "the small female effect depends on one site with short-lived controls"}
  - {id: itp-2022-captopril, program: ITP, pmid: "36179270", public_date: "2022-09-30", compound: captopril, species: mouse, strain: UM-HET3, route: diet,
     label: supports, by_sex: {female: supports, male: unclear}, effect_percent: {female: 4.5},
     quote: "Capt led to a significant, though small (4% or 5%), increase in female lifespan."}
  - {id: itp-2022-leucine, program: ITP, pmid: "36179270", public_date: "2022-09-30", compound: leucine, species: mouse, strain: UM-HET3, route: diet,
     label: no_effect, quote: "None of the other 4 tested agents led to any lifespan benefit."}
  - {id: itp-2022-pb125, program: ITP, pmid: "36179270", public_date: "2022-09-30", compound: PB125, species: mouse, strain: UM-HET3, route: diet,
     label: no_effect, quote: "None of the other 4 tested agents led to any lifespan benefit.", notes: "Nrf2-activating botanical mixture"}
  - {id: itp-2022-sulindac, program: ITP, pmid: "36179270", public_date: "2022-09-30", compound: sulindac, species: mouse, strain: UM-HET3, route: diet,
     label: no_effect, quote: "None of the other 4 tested agents led to any lifespan benefit."}
  - {id: itp-2022-syringaresinol, program: ITP, pmid: "36179270", public_date: "2022-09-30", compound: syringaresinol, species: mouse, strain: UM-HET3, route: diet,
     label: no_effect, quote: "None of the other 4 tested agents led to any lifespan benefit."}
  - {id: itp-2022-rapa-aca-9m, program: ITP, pmid: "36179270", public_date: "2022-09-30", compound: "rapamycin + acarbose", species: mouse, strain: UM-HET3, route: diet,
     age_at_start: "9 months", label: supports, by_sex: {male: supports, female: unclear},
     quote: "In male mice, the combination of Rapa and Aca started at 9 months and led to a longer lifespan than in either of the two prior cohorts of mice treated with Rapa only, suggesting that this drug combination was more potent than either of its components used alone.",
     notes: "compared with earlier rapamycin-only cohorts; each component was known to extend lifespan before"}

  # ---- ITP C2018 cohort (PMID 38041783, online 2023-12-02) ----
  - {id: itp-2023-astaxanthin, program: ITP, pmid: "38041783", public_date: "2023-12-02", compound: astaxanthin, species: mouse, strain: UM-HET3, route: diet,
     dose: "1840 ppm", age_at_start: "12 months", label: supports, by_sex: {male: supports, female: no_effect}, effect_percent: {male: 12},
     quote: "In genetically heterogeneous (UM-HET3) mice produced by the CByB6F1 × C3D2F1 cross, the Nrf2 activator astaxanthin (Asta) extended the median male lifespan by 12% (p = 0.003, log-rank test), while meclizine (Mec), an mTORC1 inhibitor, extended the male lifespan by 8% (p = 0.03)."}
  - {id: itp-2023-meclizine, program: ITP, pmid: "38041783", public_date: "2023-12-02", compound: meclizine, species: mouse, strain: UM-HET3, route: diet,
     dose: "544 ppm", age_at_start: "12 months", label: supports, by_sex: {male: supports, female: no_effect}, effect_percent: {male: 8},
     quote: "In genetically heterogeneous (UM-HET3) mice produced by the CByB6F1 × C3D2F1 cross, the Nrf2 activator astaxanthin (Asta) extended the median male lifespan by 12% (p = 0.003, log-rank test), while meclizine (Mec), an mTORC1 inhibitor, extended the male lifespan by 8% (p = 0.03)."}
