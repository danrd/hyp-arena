  - {id: itp-2023-mycophenolic, program: ITP, pmid: "38041783", public_date: "2023-12-02", compound: mycophenolic acid, species: mouse, strain: UM-HET3, route: diet,
     label: no_effect, quote: "None of these increased lifespan significantly at the dose and method of administration tested in either sex."}
  - {id: itp-2023-4pba, program: ITP, pmid: "38041783", public_date: "2023-12-02", compound: 4-phenylbutyrate, species: mouse, strain: UM-HET3, route: diet,
     label: no_effect, quote: "None of these increased lifespan significantly at the dose and method of administration tested in either sex."}

