# Knowledge cutoffs and release dates from the developers' own pages, for the models that matter for our decisions (2026-10-30).
# Read through WebFetch (a page-to-text tool that answers questions about the page); the quotes are the values it returned for the
# page cell or sentence, not checked character by character. `cutoff_rule` is the date used by the rule "a model may judge a pool
# as of T only if its cutoff <= T": the end of the stated period (month or day), and for Anthropic the broader training data
# cutoff, not the reliable knowledge cutoff. Where the developer states no cutoff, cutoff is null and the pages checked are named.
