[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyp-arena"
version = "0.1.0"
description = "Ranking thousands of scientific hypotheses by promise and feasibility, in the style of Co-Scientist."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "jinja2",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pyyaml",
    "httpx",
    "anthropic>=2.1",
    "toolkit[llm-kit,llm-kit-openrouter] @ git+https://github.com/danrd/toolkit.git",
]

[project.optional-dependencies]
demo = ["gradio>=5"]
embed = ["onnxruntime", "tokenizers", "huggingface_hub"]
site = ["markdown"]
test = ["pytest"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hyparena"]
