# Card spec, Example 3: the contrast fixture "mainly X, not Y" (spec 6, 7). X (c2) is the outcome; Y (a1) is a
# rejected declared alternative, checked like a claim and supported by PMID 22587563 → c2 refuted → gate.
raw: "Rapamycin extends mouse lifespan mainly by postponing death from cancer, not by slowing aging itself."
card:
  id: H-0003
  raw_id: R-0003
  hypothesis_type: mechanistic
  claim_plain: Rapamycin's lifespan effect in mice comes from delayed cancer death rather than slower aging.
  pico:
    population: {taxon: "NCBITaxon:10090", label: mouse}
    intervention:
      - {type: compound, label: rapamycin, id: "CHEBI:9168"}
    outcome: {endpoint: mechanism, metric: "cause of lifespan extension"}
  claims:
    - {id: c1, subject: {label: rapamycin}, relation: extends_lifespan_in, object: {label: mouse, id: "NCBITaxon:10090"}, role: premise, source_span: "Rapamycin extends mouse lifespan"}
    - {id: c2, subject: {label: rapamycin}, relation: suppresses, object: {label: "cancer mortality"}, qualifiers: {species: mouse, contrast: a1}, inherited_from_pico: [species], role: outcome, source_span: "mainly by postponing death from cancer"}
  edges:
    - {from: c2, to: c1, type: supports_if_true}
  declared_alternatives:
    - {id: a1, subject: {label: rapamycin}, relation: slows_aging_in, object: {label: mouse, id: "NCBITaxon:10090"}, qualifiers: {species: mouse, measure: "age-related changes, non-neoplastic"}, inherited_from_pico: [species], source_span: "not by slowing aging itself", stated_as: rejected}
  decisive_experiment: {system: mouse, endpoint: "cause-of-death and non-neoplastic aging pathology", duration_class: years}
verification:
  card_id: H-0003
  claims:
    - id: c1
      evidence:
        - {source: PubMed, record_id: "PMID:19587680", epistemic_type: A_text, species: mouse, endpoint: lifespan, quote_role: finding,
           quote: "Here we report that rapamycin, an inhibitor of the mTOR pathway, extends median and maximal lifespan of both male and female mice when fed beginning at 600 days of age."}
    - id: c2
      evidence:
        - {source: PubMed, record_id: "PMID:19587680", epistemic_type: A_text, species: mouse, quote_role: speculation,
           quote: "Rapamycin may extend lifespan by postponing death from cancer, by retarding mechanisms of ageing, or both"}
    - id: a1
      evidence:
        - {source: PubMed, record_id: "PMID:22587563", epistemic_type: A_text, species: mouse, quote_role: finding,
           quote: "suggesting strongly that rapamycin retards multiple aspects of aging in mice, in addition to any beneficial effects it may have on neoplastic disease",
           qualifiers_match: {species: "yes", intervention_match: exact}}
expected:
  statuses: {c1: supported, c2: refuted, a1: supported}
  contrast: {c2: {alternative: a1, x_status: unverified, y_status: supported}}
  alternatives: [{id: a1, source: declared, status: supported}]   # the prediction table comes at stage C
  profile:
    gate: filtered
    gate_reason: "contrast rule: a1 supported (PMID:22587563)"
  known_result: false
  admission: accepted
