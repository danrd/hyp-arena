# Card spec, Example 2: dasatinib + quercetin and physical function in older adults.
# c1, c2 inherit species from PICO (subject = the intervention); c3 is a general mechanism claim: no inheritance.
raw: "Intermittent dasatinib plus quercetin improves physical function in older adults because it clears senescent cells and lowers their inflammatory secretions (SASP), which drive physical decline."
card:
  id: H-0002
  raw_id: R-0002
  hypothesis_type: interventional
  claim_plain: Intermittent dasatinib plus quercetin improves physical function in older adults.
  pico:
    population: {taxon: "NCBITaxon:9606", label: human, age_at_start: "older adults"}
    intervention:
      - {type: compound, label: dasatinib, regimen: intermittent}
      - {type: compound, label: quercetin, regimen: intermittent}
    outcome: {endpoint: healthspan, metric: "physical function"}
  claims:
    - {id: c1, subject: {label: "dasatinib + quercetin"}, relation: suppresses, object: {label: "senescent cell burden", hallmark: cellular_senescence}, qualifiers: {species: human, direction: decrease}, inherited_from_pico: [species], role: mechanism, source_span: "it clears senescent cells"}
    - {id: c2, subject: {label: "dasatinib + quercetin"}, relation: suppresses, object: {label: SASP}, qualifiers: {species: human}, inherited_from_pico: [species], role: mechanism, source_span: "lowers their inflammatory secretions (SASP)"}
    - {id: c3, subject: {label: "senescent cells / SASP"}, relation: promotes, object: {label: "physical decline"}, qualifiers: {species: unknown}, role: mechanism, source_span: "which drive physical decline"}
    - {id: c4, subject: {label: "dasatinib + quercetin"}, relation: improves_healthspan_in, object: {label: human, id: "NCBITaxon:9606"}, qualifiers: {age_at_start: older_adults, measure: "physical function"}, role: outcome, source_span: "improves physical function in older adults"}
  edges:
    - {from: c4, to: c1, type: requires}
    - {from: c1, to: c2, type: supports_if_true}
    - {from: c3, to: c4, type: supports_if_true}
  decisive_experiment: {system: human, endpoint: "physical function (gait speed, 6-min walk)", duration_class: months}
verification:
  card_id: H-0002
  claims:
    - id: c1
      notes: "Only ex vivo evidence (PMID 29988130, human adipose explants): context does not match the in vivo claim."
      evidence:
        - {source: PubMed, record_id: "PMID:29988130", epistemic_type: A_text, species: human, system: ex_vivo, quote_role: finding,
           quote: "decreased the number of naturally occurring senescent cells and their secretion of frailty-related proinflammatory cytokines in explants of human adipose tissue",
           qualifiers_match: {species: "yes", system: "no"}}
    - id: c2
      notes: "Inconclusive pilot in IPF patients (PMID 30616998)."
    - id: c3
      evidence:
        - source: PubMed
          record_id: "PMID:29988130"
          lab_or_cohort: "Xu et al. 2018"
          epistemic_type: A_text
          study_type: primary_experiment
          species: mouse
          quote: "transplanting relatively small numbers of senescent cells into young mice is sufficient to cause persistent physical dysfunction"
          quote_role: finding
          qualifiers_match: {species: n/a}     # declared species unknown → n/a (counts as matching)
          flags: [conflict_of_interest]
    - id: c4
      notes: "Related human evidence in a different population (IPF, open-label, n = 14): population does not match."
      evidence:
        - {source: PubMed, record_id: "PMID:30616998", epistemic_type: A_text, study_type: open_label_pilot, species: human, endpoint: healthspan, quote_role: finding,
           quote: "Physical function evaluated as 6-min walk distance, 4-m gait speed, and chair-stands time was significantly and clinically-meaningfully improved (p < .05)",
           qualifiers_match: {species: "yes", population: "no"}, flags: [open_label, small_n]}
    - id: an1
      claim: {subject: "dasatinib + quercetin", relation: improves_healthspan_in, object: mouse, qualifiers: {age_at_start: old}}
      evidence:
        - source: PubMed
          record_id: "PMID:29988130"
          lab_or_cohort: "Xu et al. 2018"
          epistemic_type: A_text
          study_type: primary_experiment
          species: mouse
          endpoint: healthspan
          quote: "intermittent oral administration of senolytics to both senescent cell-transplanted young mice and naturally aged mice alleviated physical dysfunction and increased post-treatment survival by 36% while reducing mortality hazard to 65%."
          quote_role: finding
          qualifiers_match: {species: "yes", intervention_match: exact}
          flags: [conflict_of_interest]
expected:
  statuses: {c1: unverified, c2: unverified, c3: supported, c4: unverified, an1: supported}
  profile:
    gate: pass
    effect_level: mammals
    intervention_match: exact
    effect_contested: []
    robustness: single
    multi_site_program: {tested: "no"}
    mechanism: partial
    next_step: "mammals: independent (ideally multi-site) replication"
  known_result: false
  admission: accepted
