# Method v3 on the fresh calibration sample, fixed before the run (user decisions 2026-11-04/05/06: fresh sample from
# late-registered and word-matched trials, outcome labels by hand-run Argon checked by Claude, normalize_card/v9).
id: calibration-v3-fresh
date: 2026-11-06
question: "Does P order fresh trials by their outcome, on trials not used before (clean part: first posted 2023-2026), with the normalizer fixed?"
config: configs/v3-flash-n9.yaml   # normalize_card/v9, verify_claim/v9, proposed alternatives, rules_v3 (variant v3 as run)
code: "scripts/calibration.py run --step 4 / --step 5 --config configs/v3-flash-n9.yaml --tag _v3; score-v3 --steps; cards frozen in calibration/cards_v3_v9.json"
units:
  clean_step4: "14 units (7 positive, 7 null): CT.gov first posted 2023-2026, late-registered or word-matched; 2 excluded before the run because the registry title states the result (units_4_excluded.json)"
  orientation_step5: "30 units (13 positive, 17 null or negative): CT.gov 2000-2022 word-matched and ISRCTN, DRKS, NTR, UMIN; results the models may remember"
  labels: "Argon by hand from the result abstracts and posted results; every decisive label checked by Claude against the rules (fresh/README.md)"
  as_of: "min(registration, primary completion) per unit, as in the calibration"
primary:
  score: "P of the declared hypothesis; filtered by the gate: -1"
  metric: "tied AUC with 95% bootstrap CI, separately for the clean part and the orientation part"
  reading:
    signal: "AUC >= 0.60 and lower CI bound above 0.45"
    no_signal: "AUC < 0.55"
    unclear: "otherwise"
  expected_power: "with 14 clean units the CI is about +-0.25: unclear is the likely reading unless the effect is strong; the clean part is the test, the orientation part and the pooled 44 are reported"
normalizer_check:
  measures: "as specs/normalizer-v8-2026-11-05.yaml on the 44 cards: unparsed, mechanism recall on the 8 texts hand-labelled as stating a reason (MECHANISM_STATED_FRESH), parallel outcomes written as a chain"
  thresholds: {unparsed: "at most 2 of 44", mechanism_recall: "at least 6 of 8", parallel_as_chain: "0"}
reported_not_judged:
  - "V; the gate; sensitivity with no-stance findings as support; v3.1 offline; ASPID trial profiles; the additional indicators (explore-v3)"
  - "pooled with the first calibration (30 units, v7 cards): reported apart, not pooled, since the normalizer differs"
known_limitations:
  - "relevance recall of the verifier about 0.6; effect class formal on the extraction gold"
  - "registry texts are current versions; late registration can carry knowledge of the result (two titles excluded for it; others read for result statements)"
calls: "about 17 per unit, about 750 in all; cap 60 per unit"
cost_estimate_usd: "about 2 (cap: 2640 calls, about 6.5)"
result:
  date: 2026-11-06
  run: "44 units, 883 calls, no network failures; 4 orientation units got no v3 result (admission needs_refinement: NCT02463864, NCT02256072, NCT01832090, NCT01365104)"
  primary_clean: "P tied AUC 0.571 [0.255; 0.867] on 14 units (7 / 7): unclear by the rule (>= 0.55, < 0.60)"
  primary_orientation: "P tied AUC 0.534 [0.319; 0.744] on 26 units (10 / 16): no_signal by the rule (< 0.55)"
  pooled_40: "P 0.556 [0.370; 0.728]"
  normalizer_check: "passed: unparsed 0 of 44, mechanism recall 6 of 8, parallel outcomes as a chain 0; mechanism links in 2 texts labelled as stating none. New: 4 cards stopped at admission (needs_refinement), not counted by the unparsed measure"
  reported:
    V: "clean 0.398, orientation 0.566, pooled 0.515"
    sensitivity_no_stance: "P clean 0.582, orientation 0.575, pooled 0.583"
    v3_1_offline: "P clean 0.571, orientation 0.487, pooled 0.531"
    v3_2_offline: "P clean 0.612, orientation 0.637, pooled 0.629 (V 0.612 / 0.65 / 0.63); distinct P values pooled 29 of 40 (v3 11), tied positive-negative pairs 8% (v3 18%); scale c x0.5 / x1.5: tau 0.94, P AUC 0.629 / 0.616. v3.2 was written and committed (3e955b1) on the first calibration, before these outcomes were scored, but it was not the pre-registered rule: it is the candidate for the next test, not a result of this one"
  notes:
    - "Ties dominate v3 here: P takes 11 values on 40 units, 18% of positive-negative pairs tie; with most cards of one or two links, P is the level of the outcome link, as on the first calibration."
    - "Across the three samples v3 P was 0.677 (first calibration, seen), 0.571 (clean), 0.534 (orientation): no stable signal at the level the criterion asks. v3.2 gave 0.650, 0.612, 0.637: stable, modest, never pre-registered."
