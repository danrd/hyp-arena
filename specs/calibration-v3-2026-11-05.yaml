# First paid check of method v3 on the 30 calibration units, fixed before the run (user decisions 2026-11-04/05: go to the v3
# calibration check with verify_claim/v9 without the second relevance question; record the relevance limitation and a
# sensitivity analysis in advance).
id: calibration-v3
date: 2026-11-05
question: "Does method v3's plausibility P order the 30 calibration trials by their outcome at all (where v2 gave tied AUC 0.46)?"
status_in_advance: "orientation, not a test: these 30 units (17 positive, 13 null or negative) were used to debug v2 and to design v3 (docs/spec/method-v3.md, worked examples). A test of P needs the fresh sample (CT.gov 2023-2026, registered late) with its own threshold, next step."
config: configs/v3-flash.yaml   # normalize_card/v7 (Gemini 3.5 Flash), verify_claim/v9 (DeepSeek V4.1 Flash), proposed alternatives, rules_v3, model-written search, graded admission, temperature 0
code: "scripts/calibration.py run --step 1/2/3 --config configs/v3-flash.yaml --tag _v3, then score-v3; cards frozen per method in calibration/cards_v3.json (v2 cards have no chain links)"
units: "units_1.json, units_2.json, units_3.json (30 units, each as of min(registration, primary completion))"
primary:
  score: "P of the declared hypothesis; a unit filtered by the gate scores -1"
  metric: "tied AUC with 95% bootstrap CI"
  reading:
    signal: "AUC >= 0.60 and lower CI bound above 0.45: go on to the fresh sample"
    no_signal: "AUC < 0.55"
    unclear: "otherwise"
reported_not_judged:
  - "V = P x W x I (not meant to track outcomes, user decision); the gate's filtered units; flags; the weakest link per unit"
  - "sensitivity (score-v3 --no-stance-as-support): findings returned with stance neither (kept as no_stance since verify_claim/v6) counted as support with their own weights. The verifier's relevance recall is about 0.6 with precision 1.0 (extraction-gold-v3b, v8, v9), so P is biased down where support comes from interventions of the same kind (programmes, behavioural interventions: about half the units). Reading fixed now: if P shows no signal but the sensitivity reaches the signal reading, the verifier's recall is the bottleneck (next: another model for the relevance decision); if neither shows a signal, the recall is not the explanation."
  - "comparison: v2 on the same units, tied AUC 0.46 [0.26; 0.66] (calibration-step3)"
  - "exploratory, added 2026-11-05 during the run, before any result was looked at (user: a rough look at all candidates):
    the additional indicators of hyparena/card/v3_extra.py (best design and independent sources for the outcome link, share
    against, feasibility 9.4, weakest link, human evidence, best effect, unverified links, momentum): per indicator its
    Spearman correlation with P and its tied AUC against the outcomes; and the ASPID expected values of the three trial
    profiles (configs/profiles_v3.yaml) with their tied AUC. Decides nothing: indicators are chosen on the fresh sample."
known_limitations:
  - "relevance recall about 0.6 (see above); effect class formal on the extraction gold (most effects 'unclear' under rule A)"
  - "alternatives proposed by a model, without the knowledge graph"
calls: "about 20 per unit (new v3 card, more claims from the chain, model-written queries, alternatives and their support), about 600 in all; cap 60 per unit"
cost_estimate_usd: "about 1-1.5 (cap: 1800 calls, about 4.5)"
code_change_before_the_run: "2026-11-05, after the NCBI search outage (esearch answering 500, or HTTP 200 with 'Search is temporarily unavailable ... Cannot connect to SOLR' in the body): pubmed.search retries an error in the body and then raises instead of returning no papers; the unit is skipped and picked up by the next run. The run waits for esearch to answer with results in at least 9 of 10 probes."
