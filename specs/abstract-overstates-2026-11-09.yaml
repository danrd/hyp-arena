id: abstract-overstates-2026-11-09
written_on: 2026-11-09
status: definitions fixed before the pack was built or sent
why: >-
  Argon pack 10: the full text changed the stance of 2 of 28 papers, both a positive abstract turning into a null result
  (a primary outcome named but its null result left out; a positive result restricted to a subgroup); one of them was a
  dangerous error of ours (link +0.97, refuted by the full text). User 2026-11-09: plan a targeted full-text re-read of such
  records and extend the test through Argon to catch more.
records: "records 'for' from RCTs on the outcome link of both pools (231 records); abstracts from PubMed"
rule_v0: >-
  code flags a record when its quote has a subgroup cue (subgroup, post hoc, per-protocol, completers, "among / in those
  who") or the record is flagged subgroup_only, or its abstract names a primary outcome or end point (98 of 231 records,
  69 distinct papers; the primary-outcome cue alone is broad)
pack: Argon pack 11 (longevity-kg reviews/argon-2026-11-08/pack_11_task.json; hidden key pack_11_key.json)
sample:
  targeted: "the distinct papers flagged by rule_v0 whose full text is open in PMC (Europe PMC isOpenAccess), up to 40, by SHA-1 of 'over|<pmid>'"
  control: "papers of the same records NOT flagged by rule_v0 and open in PMC, up to 20, by the same order"
asked: >-
  per paper, with the claim it was used for: the finding from the abstract (A) and from the full text (B) as in pack 10, and
  abstract_overstates yes / no with the kind (primary_omitted, subgroup, secondary_as_main, within_group_as_between,
  per_protocol_only, other) and the full-text sentence that shows it
measures:
  prevalence: "share of papers where the abstract overstates (targeted, control)"
  rule_v0: "precision (overstating among targeted) and the overstating papers it misses (control rate times the unflagged pool)"
  kinds: "which kinds occur, to sharpen the rule (code cue or a model check of the abstract)"
next: >-
  a cheap model check of each abstract (DeepSeek: is the between-group result of the named primary outcome given? is the
  positive result restricted to a subgroup?) is scored against this gold before any full-text re-read is run; priced then
result:   # Argon pack 11 answer 2026-11-09 (longevity-kg reviews/argon-2026-11-08/pack_11_answer.json); python -m scripts.pack11_analysis
  targeted: "full text read 26 of 28; overstates 12/26, of serious kinds (primary omitted, subgroup, secondary as main, within as between) 8/26; stance for -> null or against 2/26"
  control:  "full text read 18 of 20; overstates 11/18, serious 6/18; stance flips 2/18"
  kinds_all: "other 14, per-protocol only 12 (mostly attrition), within-group as between 10, secondary as main 3, primary omitted 3, subgroup 2"
  rule_v0: "no enrichment: the crude rule flags papers that overstate less often than the ones it leaves out (46% vs 61%): useless as a filter"
  flips: >-
    4 of 44 papers (9%) change from for to null or against with the full text (pack 10: 2 of 28); two of the four (PMID
    29227175: the abstract itself says the primary and secondary outcomes did not differ and only a post hoc subgroup moved;
    PMID 40011687: between-group comparisons non-significant in the abstract's own words) are visible in the abstract: our
    reader misread it; the other two (PMID 36316421, PMID 39764482) need the full text
  reading: >-
    overstatement is common and not concentrated where a code cue points: a third of the RCT papers our reader takes as
    evidence for a claim overstate it in a serious way, and about one in ten turns into a null or a negative with the full
    text. A filter by cues does not work; what works is (1) the reader's own between-group rule on the abstract (v13 restates
    it) and (2) a full-text re-read of every 'for' record from an RCT on the outcome link where PMC allows it, which is cheap
    (about half of 231 records)
fulltext_reread:   # user decision 2026-11-09 ("go"); written before the run; about 0.05-0.08 USD
  records: "every record 'for' from an RCT on the outcome link of both pools (231) whose paper is open in PMC (Europe PMC isOpenAccess)"
  reading: "reader verify_claim/v13 on that one paper with the abstract plus the PMC methods and results excerpt (verifier search mode 'fixed+fulltext'); DeepSeek, off-peak"
  replace: "the paper's records on that link are replaced by the full-text reading; papers that are closed keep their records"
  measures: >-
    flips (for -> against / none) and their share; the known cases caught (LISA 38911477, 31121926, and the 4 flips of
    pack 11); agreement of the new stance with pack 11's full-text finding where the papers overlap; pack 8 link and trial
    Spearman; R2 / R3 under the 0.03 rule
  adopt_if: "R2 and R3 not worse by more than 0.03 and the known cases caught; then the full-text re-read of 'for' RCT records becomes a step of the method"
fulltext_reread_result:   # 2026-11-09 10:49-10:55 UTC off-peak; {prospective,calibration}/fulltext_reread.json; python -m scripts.fulltext_reread score
  cost_usd: "prospective 0.053, calibration 0.029: 0.082 (named 0.05-0.08)"
  sample: "77 'for' RCT records on the outcome link with an open paper (52 prospective, 25 calibration) of 231"
  new_stance: "for 56, none 12, against 9: 22 of 77 (29%) leave 'for', but 'none' is partly the reader dropping a record (the known recall loss), not a null"
  known_cases: "1 of 6 caught (29227175); LISA 38911477 and 31121926 were not in the sample (closed or not a 'for' RCT record on the outcome link); the 3 prospective pack-11 flips (40011687, 36316421, 39764482) stay 'for'"
  vs_pack11_full_text: "44 overlapping papers that Argon read in full: same stance 31 (for 28, against 3); Argon against -> ours for 3; Argon none -> ours for 5; Argon for -> ours none 4, against 1"
  references: "R2 0.695 (before 0.702, 180 targets vs 195), R3 0.581 (before 0.593): both inside the 0.03 rule"
  decision: >-
    not adopted: the references hold, but the known cases are not caught (1 of 6) and the reader keeps 'for' where the full
    text shows the claim's outcome was not significant (40011687: only knee-extensor strength and one SF-36 domain). The
    full text is read, the overstatement is not seen: the same reader reads the same text the same way. A check aimed at the
    gap between the abstract's claim and the results table (a question, not a re-read) is the next candidate.
claim_vs_results:   # user decision 2026-11-09 ("запускай", about 0.07 USD, stop at 0.15); written before the run
  why: "the full-text re-read kept 'for' where the claim's outcome was not significant: the same reader reads the same text the same way; a narrow question is asked instead"
  sample: "the same 77 'for' RCT records on the outcome link with an open paper (scripts.fulltext_reread.targets)"
  text: "abstract + a new Results-and-tables excerpt (pmc.results_excerpt: Results sections, then every table with at least half of 20 000 characters; methods left out)"
  question: "claim_vs_results/v1, DeepSeek: is there a significant BETWEEN-GROUP difference on the claim's outcome Y at the primary time point: yes | no | not_measured | unclear; a verbatim quote from the results; which outcomes did differ"
  second_family: "every 'no' or 'not_measured' with a verbatim quote is asked again of Gemini; a change counts only when both say no / not_measured with verbatim quotes"
  rule: "both 'no' -> the record moves to against (a null, weighed by the power of its study, as every null); both 'not_measured' -> the record is removed from the link; otherwise unchanged"
  measures: "the 4 known cases in the sample (29227175, 40011687, 36316421, 39764482); agreement with pack 11's full-text finding on the overlapping papers (full re-read: 31 of 44); R2 / R3"
  adopt_if: "R2 and R3 not worse by more than 0.03, at least 3 of the 4 known cases caught, and agreement with pack 11 above 31 of 44; then a step of the method for 'for' RCT records with an open paper"
