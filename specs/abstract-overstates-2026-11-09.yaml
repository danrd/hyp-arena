pack13_result:   # Argon pack 13 answer 2026-11-09 (longevity-kg reviews/argon-2026-11-08/pack_13_answer.json); 35 of 35 answered
  argon: "no 12, not_measured 11 (a fair stand-in for Y in 4), yes 11, full text unavailable 1"
  argon_action: "no -> null; not_measured without a fair stand-in -> removed; not_measured with one, or yes -> stays 'for'"
  counted_changes_19: "Argon agrees the record should leave 'for' in 10 (3 removed as removed, 4 null as null, 2 removed that Argon makes null, 1 null that Argon removes), disagrees in 8 (5 nulls where Argon finds a between-group effect, 3 removals where a fair stand-in was measured), 1 unknown: precision 10 of 18"
  uncounted_16: "Argon would change 10 (6 null, 4 removed), keep 6: the verbatim filter does not pick the right ones (10/18 counted vs 10/16 uncounted)"
  model_as_flag: "the model's no / not_measured is right that the record should not stay 'for' in 20 of 34 (59%)"
  disagreements: >-
    mostly what Y is: an interaction effect counted as no between-group difference (94e72e9d), significance only on a
    secondary or a component measure (ea6b3559 primary frailty null, secondary function positive; c1bfc729 free but not
