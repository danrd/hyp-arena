  side_finding: >-
    in 14 of 35 notes Argon says the paper tested another intervention or population than the claim (not mSMT, not
    STEP@Home, not Meritene, other ages): the record was 'for' an exact context it does not have, a reading error before
    this check; it feeds the context-label work (intervention_match), not this step
  decision: >-
    not adopted as a weight change: precision 10 of 18 is too low for an automatic step and the code filter does not
    select. Kept as a report flag 'the trial's results may not support this record' on 'for' RCT records with an open
    paper (59% right), for a reader to check; a v3 of the question would separate interaction, primary vs secondary and
    stand-in measures before a new holdout
