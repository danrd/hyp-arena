id: sources-experiment-2026-11-07
written_on: 2026-11-07
status: design and metrics fixed before any of the three runs
why: >-
  User decision 2026-11-07: maximum attention to the quality of reading sources and building the card; show whether full
  texts or a knowledge graph give a real gain over abstracts. Reading and labelling are delegated to an outside reader
  (Argon); every label is re-checked here (quotes verbatim against the paper, publication date before the cut-off, PMID
  exists; a hand check of a sample).
units: ["NCT06160141", "NCT06407583", "NCT03240094", "NCT01365104", "NCT04598464", "NCT03212859", "NCT07864831", "NCT06975540", "NCT02923843", "NCT00935493", "NCT01417663", "NCT06878001", "NCT05685667", "NCT05870046", "NCT02787889"]   # 15 calibration trials (8 positive, 7 null), NCT, not used in the Argon pack 2; SHA-256 order within label
arms:
  A_abstracts: "the current pipeline (configs/v3-flash-n10.yaml runs already saved) and its next version with the exact-population query (configs/v3-flash-n11.yaml, rerun of these 15: paid, price before the run)"
  B_full_texts: the same pipeline, the verifier reading PMC open-access full texts (methods and results) where they exist, abstracts otherwise; only extracted fields are stored (paid, price before the run)
  C_graph: Argon's knowledge graph for the same links (pack 3, task C) fed to the same v3.4 rules as records
gold: Argon's labels of our records (pack 3, task D), re-checked; plus the three hand-labelled extraction sets already used
metrics_primary:
  - recall: share of the gold-relevant papers per link (union of A, B, C after re-check) that each arm found
  - field accuracy against gold: stance, design, n, comparison, population, intervention match, effect number present and its class
  - share of outcome-slot records with a numeric effect (input of the experiment forecast)
  - records against found on the outcome slot (the signal of P)
metrics_secondary:
  - P v3.4, support share, novelty per arm and their change; AUC on the 15 (direction only) and, if an arm is run on all 74, on the 74
  - cost per hypothesis (calls, tokens, USD)
decision_rule: >-
  an arm is worth adopting if it raises recall or field accuracy by at least 10 points, or the share with a numeric effect
  by at least 15 points, at a cost below 3x of A; downstream AUC is reported but not used to decide (too few units).

result_arm_C_and_gold:   # scripts/argon_check.py -> calibration/argon_pack3_check.json; Argon's answers in longevity-kg reviews/argon-2026-11-07/task_cd.json
  recheck: {items: 222, pmid_exists: 222, quote_verbatim: 213, before_cutoff: 222}   # 96% of quotes verbatim (abstract or PMC full text)
  gold_vs_our_extraction_86_records:
    stance: "72 agree; 9 ours for -> Argon not about the link; 5 ours against -> Argon for"
    design: 80 agree
    n_total: 74 agree
    comparison: 79 agree
    population: 71 agree
    intervention: "47 agree; ours narrower in 23 (class or dose/regimen differs -> Argon exact); related_compound vs class is a naming difference (same weight)"
    numeric_effect: "46 agree; Argon has a number where our parser has none in 39 records, the reverse in 1"
  recall_link_paper_pairs: {ours: 84, graph_valid: 128, both: 47}   # the graph adds 81 pairs we did not find; we have 37 it left out
  outcome_slot_numeric_effects_graph: 42
  auc_15_direction_only: {P_ours: 0.696, P_graph: 0.589, support_ours: 0.661, support_graph: 0.536}
  reading: >-
    A fuller, hand-curated literature (Argon's graph) finds 1.5x the link-paper pairs and numbers for most effects, but does
    not separate the 15 trials better: it adds data against to three positive trials (their P falls to 0.3-0.45). More
    literature makes the description better (numbers, populations, the papers we miss), not the forecast. Our extraction is
    sound on stance, design, n and comparison (84-93% agreement); the weak fields are the intervention match (55%, ours too
    narrow) and numeric effects (we miss them in 46% of records).

fixes_2026_11_08:   # user decision: fix the intervention match and the numeric effects
  code_effect_parser: >-
    ratio "hazard ratio [HR], 0.82"; percent "Mean Δ% = 40.4%", "ΔEG/CG: 29.67%", "increases from baseline of 21%"; a raw
    difference with its 95% CI and n -> d (effect_class.d_from_ci), used in the record weight and the forecast. On the saved
    records: agreement with Argon on "has a numeric effect" 46 -> 60 of 86; trials with a numeric expected effect 31 -> 32
    of 73; P AUC unchanged (0.595). The rest of the gap is phrases the verifier did not copy.
  verifier_prompt_v10: >-
    intervention match judged at the level at which the claim names the intervention (a kind -> any study of that kind is
    exact); the effect phrase must not be empty when the abstract gives any number. configs/v3-flash-n11*.yaml use it. Not
    run yet: checked by the rerun of arm A (paid, price before the run).

result_arm_A_2026_11_08:   # v10 prompt + exact-population query, 15 units, same frozen cards; scripts/sources_compare.py
  link_paper_pairs: {old_v9: 63, arm_A: 63}
  argon_graph_pairs_found: {old_v9: "44 of 128", arm_A: "23 of 128"}
  argon_graph_papers_on_outcome_link: {old_v9: "27 of 73", arm_A: "10 of 73"}
  argon_graph_papers_read_at_all: {old_v9: "61 of 122", arm_A: "45 of 122"}   # searched_pmids
  turned_into_records: {old_v9: "72% of the graph papers read", arm_A: "51%"}
  agreement_with_argon: {old_v9: {stance: 0.87, design: 0.91, intervention: 0.81, population: 0.84, numeric_effect: 0.68, n: 63},
                         arm_A: {stance: 0.93, design: 0.86, intervention: 0.71, population: 0.86, numeric_effect: 0.61, n: 28}}
  auc_15_direction_only: {old_v9: {P: 0.70, support: 0.66}, arm_A: {P: 0.39, support: 0.41}}
  reading: >-
    Arm A is worse, in search (the exact-population query leads the merge and pushes out papers the model queries found) and
    in reading (fewer of the papers read became records). Not adopted: configs/v3-flash-n11*.yaml are not used further.
    Caveat: one run each; the model-written queries vary between runs, so part of the drop may be run-to-run noise. Two
    changes were tested together, so their effects are not separated.
graph_v36_2026_11_08:   # user decision 2026-11-08 (item 3), written before computing; free
  what: >-
    Argon's graph (pack 3, task C; edges that passed the quote and date checks) scored by the v3.6 rules on the same 15
    calibration trials, three sources: ours (the verifier's records), graph, union (ours plus graph edges for papers we do
    not have on that link)
  measures: >-
    R2 on the links of the 15 trials (later RCT / meta-analysis of a link predicted from the earlier records of that source;
    years from PubMed); AUC of the evidence balance on the 15 trials (direction only, 8 positive, 7 null); records per link
  reading: >-
    exploration: 15 trials and a few dozen R2 targets; the question is whether a fuller literature makes the balance a better
    predictor of later trials of the same link (R2), the reference the record weight was chosen on, not the trial outcome
graph_v36_result:   # scripts/graph_r2.py -> calibration/graph_r2.json
  ours:  {records: 68,  R2: 0.757, R2_targets: 22, against_targets: 4,  balance_auc_15: 0.634}
  graph: {records: 128, R2: 0.542, R2_targets: 49, against_targets: 9,  balance_auc_15: 0.661}
  union: {records: 147, R2: 0.619, R2_targets: 61, against_targets: 13, balance_auc_15: 0.661}
  reading: >-
    on v3.6 the graph and ours order the 15 trials alike (0.66 vs 0.63; under v3.4 the gap was 0.59 vs 0.70: the record
    weight and the fold, not the graph, made the difference). R2 is lower with the graph, but the target sets differ (the
    graph adds 27 later trials, 5 of them against, that our search never found): on the harder set of a fuller literature
    the balance predicts later trials less well. Too small to decide a source (22-61 targets on 15 trials); no reason
    found to replace the search by a curated graph, and no reason to think it hurts.
