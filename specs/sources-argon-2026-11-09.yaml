id: sources-argon-2026-11-09
written_on: 2026-11-09
status: definitions fixed before the pack was built or sent
why: >-
  User request 2026-11-09: let Argon run the sources test (abstract vs full text vs knowledge graph) that our paid arm B
  (PMC full texts, specs/sources-experiment-2026-11-07.yaml) never ran. Question: how much does reading the full text change
  what a paper says about a link (stance, effect size, n, design, population), and how much does a curated knowledge graph
  add beyond the papers, link by link.
pack: Argon pack 10 (longevity-kg reviews/argon-2026-11-08/pack_10_task.json; hidden key pack_10_key.json)
sample: >-
  chain links of the 30 pilot trials (prospective) whose pack-8 key papers include at least two with an open-access full
  text in PMC (pmc.is_open); up to 12 links by SHA-1 of "sources10|<NCT>|<link>", up to 5 open-access key papers per link
access: "open-access PMC full texts only (the pack gives the PMCID); no other source for the full-text arm; nothing that bypasses a site's access rules"
asked:
  per_paper_A_abstract: "finding for / against / none on the claim, verbatim quote, design, n, comparison, effect size phrase, population"
  per_paper_B_full_text: "the same fields from the PMC full text (methods and results), and what changed versus A (none / stance / effect / n / population / design / adds a finding the abstract lacks)"
  per_link_C_graph: "the link's verdict (supported / mixed / refuted / no evidence, strength) from the literature Argon knows up to T, with up to 5 key PMIDs and an effect size per PMID where known; and the verdict from A alone and from B alone over the given papers"
measures:
  paper: "share of papers where B changes A, by field; share where B turns none into a finding or flips the stance (the critical changes)"
  link: "verdict A vs B vs C agreement; our 2S - 1 (v3.6) vs each; papers C adds that are not in the pack, and how many our search had retrieved"
reading: >-
  full text is worth a paid reading arm when B flips stance or turns none into a finding in at least 15% of papers, or moves
  link verdicts in at least a fifth of links; otherwise abstracts stay the default (rule 12 of longevity-kg)
built: "12 links, 31 open-access papers, 70 KB"
fix_found: >-
  hyparena/tools/pmc.is_open called the PMC OA web service at a URL that now answers 404, so every paper looked closed and
  arm B (full texts) would have read none; it now uses Europe PMC's isOpenAccess flag (checked: PMC11191791 open, its
  methods and results excerpt 5.3 k characters)
result:   # Argon pack 10 answer 2026-11-09 (longevity-kg reviews/argon-2026-11-08/pack_10_answer.json); python -m scripts.pack10_analysis
  full_text: "28 of 31 read in PMC, 3 unavailable"
  changed_fields: "design 14, population 10, effect 6, n 5, stance 2, adds a finding 1; nothing changed in 11 of 28"
  critical: "2 of 28 papers (7%): PMID 38911477 none -> against (the LISA trial's abstract omits its primary outcome, leg extensor power, which the full text reports as null); PMID 31121926 for -> against (the abstract's gain is a first-cycle subgroup; the whole cohort did not change)"
  links: "verdict A -> B changes in 2 of 12 links (17%), both from supported or no evidence to refuted; B -> C (Argon's own knowledge) 0 of 12"
  ours: "the sign of our 2S - 1 agrees with Argon's verdict in 9 of 12 links (A, B and C alike); S04 is a dangerous error: ours +0.97, full text and Argon's knowledge: refuted (moderate)"
  rule: "not met (7% < 15% of papers, 17% < 20% of links): abstracts stay the default"
  reading: >-
    the full text rarely changes what a paper says about a link, but when it does it turns a positive into a null: an
    abstract that leaves out a null primary outcome, or reports a subgroup as the result. Both are recognisable from the
    abstract (a primary outcome named in the methods but missing from the results; a positive result restricted to a
    subgroup), so a targeted full-text reading of such records is cheaper than a full-text arm for all. C added nothing
    over B here, but the sample was built from Argon's own key papers, so that comparison is biased towards agreement.
