id: meta-and-nulls-2026-11-09
written_on: 2026-11-09
status: definitions fixed before the pack was built or sent
why: >-
  User 2026-11-09: what else to check in the direction of pack 11. Two record kinds pack 11 did not cover: (1) meta-analyses
  read as FOR a claim, which weigh as an RCT (1) in v3.6 although the full text may report low GRADE certainty, high
  heterogeneity or high risk of bias of the included trials; (2) RCTs read as AGAINST a claim (nulls), whose abstract may
  understate (an underpowered null, a positive primary or claim outcome left out, a null only in a per-protocol analysis).
pack: Argon pack 12 (longevity-kg reviews/argon-2026-11-08/pack_12_task.json; hidden key pack_12_key.json)
sample: >-
  records on the outcome link of both pools, open in PMC (Europe PMC isOpenAccess): up to 20 meta-analyses 'for' and up to 20
  RCTs 'against', distinct papers, by SHA-1 of 'mn|<pmid>'; mixed, the kind told (the questions differ)
asked:
  meta_analysis_for: >-
    from the full text, for the claim's outcome: trials and participants pooled, the pooled effect with its interval, I2,
    GRADE certainty if reported, risk of bias of the included trials, and abstract_overstates yes / no with kinds
    (low_certainty_not_in_abstract, high_heterogeneity, small_study_or_publication_bias, outcome_not_pooled, subgroup, other)
  rct_against: >-
    from the full text: was the claim's outcome the primary one, the sample size calculation and whether it was reached,
    the result with its interval, adherence, and abstract_understates yes / no with kinds (underpowered,
    positive_on_claim_outcome_left_out, positive_in_itt_or_secondary, equivalence_or_noninferiority, other)
measures: "share of meta-analyses that overstate (and of the serious kinds); share of nulls that understate; how many change the stance or should change the weight (a low-certainty meta-analysis at RCT weight; an underpowered null)"
reading: >-
  if a fifth or more of the meta-analyses are low or very low certainty, the design weight of a meta-analysis should follow
  its certainty (GRADE), to be tested on R2 / R3; if a fifth or more of the nulls are underpowered, the power weight of
  nulls (v3.5) is checked against the full-text sample size calculations
result:   # Argon pack 12 answer 2026-11-09 (longevity-kg reviews/argon-2026-11-08/pack_12_answer.json); python -m scripts.pack12_analysis
  meta_analyses_for: >-
    18 of 20 read; the abstract overstates in 17 (the reader is generous: 'other' 14; of the named kinds high heterogeneity 9,
    a subgroup 8, the claim's outcome not pooled 7, low certainty not in the abstract 4, small-study bias 3); GRADE reported
    in 10: high 2, moderate 4, low 3, very low 1 (low or very low 4 of 18 read, 22%); risk of bias of the included trials
    high 6, some concerns 9, low 3
  rct_against: >-
    15 of 16 read; the claim's outcome was primary in 14; the planned sample was not analysed in 8; the abstract understates
    in 9 (underpowered 8, positive in ITT or a secondary outcome 2)
  our_null_weights: >-
    the v3.5 power weight already tracks it: the nulls Argon calls understated carry power 0.10-0.51 (median about 0.24),
    the others 0.24-0.87; no change needed for nulls
  rule: >-
    meta-analyses: met (low or very low certainty in 22% >= a fifth): the design weight of a meta-analysis should follow its
    certainty, to be tested on R2 / R3; nulls: the power check is done above and agrees
  reading: >-
    a meta-analysis is not one level of evidence: two in ten that our reader takes as 'for' are low or very low certainty,
    most pool trials at some or high risk of bias, and in seven the claim's own outcome is not pooled at all (our reader
    took another outcome). In v3.6 every meta-analysis weighs 1, as much as a large RCT. A certainty-aware weight (high or
    moderate 1, low 1/2, very low 1/4; not reported: by the risk of bias or I2) needs the certainty of every meta-analysis
    record: GRADE is often in the abstract, else a short model call on the abstract (and the full text where open)
meta_certainty:   # user decision 2026-11-09 ("do it"); written before any call; about 0.02-0.05 USD
  records: "every meta-analysis record 'for' on the outcome link of both pools"
  free_step: "GRADE certainty from the abstract by code (high / moderate / low / very low certainty or quality of evidence, near GRADE)"
  model_step: >-
    meta_certainty/v1 (DeepSeek), one call per paper and claim: the abstract, plus the PMC methods and results excerpt
    where open; claim_outcome_pooled, certainty, risk_of_bias, I2, a verbatim quote (checked)
  weight_variants:   # the design factor of a meta-analysis record, everything else v3.6
    current: "1"
    certainty: "high or moderate 1, low 1/2, very low 1/4; not reported: risk of bias low 1, some concerns 3/4, high 1/2, not reported 3/4"
    certainty_and_pooled: "as certainty, and a record whose claim outcome is not pooled is dropped (the reader took another outcome)"
  measures: "R2 and R3 (v3.6, 0.03 rule) for each variant; R4 tau-b on pack 5; how many records change and by how much"
  adopt_if: "not worse than current by more than 0.03 on R2 and R3 (GRADE clause: certainty is GRADE's own rule); the user decides between the two variants"
meta_certainty_result:   # 2026-11-09 10:56-11:00 UTC off-peak; calibration/meta_certainty.json, meta_certainty_score.json
  cost_usd: 0.026
  records: "75 meta-analysis records 'for' on human links of both pools; quote verbatim 69 of 75"
  certainty: "GRADE named (regex on the abstract, else the model on abstract + PMC excerpt): high 2, moderate 5, low 4, very low 3; not reported 61"
  risk_of_bias: "high 6, some concerns 9, not reported 60"
  claim_outcome_pooled: "yes 57, no 18"
  vs_pack12: >-
    18 overlapping meta-analyses Argon read in full: Argon gives a GRADE level for 10, we for 1 (very low vs our low); the
    full text holds the certainty table, our excerpt does not reach it. Outcome not pooled: Argon 7, ours 7, both 4
  references:
    current: {R2: 0.702, R3: 0.593}
    certainty: {R2: 0.697, R3: 0.582}
    certainty_and_pooled: {R2: 0.687, R2_targets: 179, R3: 0.582}
  reading: >-
    both variants are inside the 0.03 rule and neither gains. Because GRADE is found for 14 of 75, the certainty variant is
    mostly a flat 0.75 on meta-analyses (risk of bias not reported); the pooled clause removes 18 records and 16 R2 targets.
    R4 on pack 5 was not computed (no meta-analysis pair of pack 5 changes weight by more than the fold). Decision to the user.
