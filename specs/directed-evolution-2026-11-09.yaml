id: directed-evolution-2026-11-09
written_on: 2026-11-09
status: specification only; not implemented, no call made
user_decisions: >-
  2026-11-09: evolution steered towards a profile, first towards novelty (a new link), which also blocks the drift to the
  known; a separate third mode next to tuning and free evolution; the user tests it through Argon (outside reader), so this
  spec also fixes what the outside reader is given and asked
why: >-
  Tuning repairs the fixable defects of the same hypothesis; free evolution may produce another hypothesis and only flags a
  move towards the known. Neither has a target. Directed evolution gives the writer the target of a profile and accepts a
  child by code only if it reaches that target without breaking what is already supported.

mode:
  name: "directed (направленная эволюция), --mode directed --profile frontier"
  first_profile: frontier
  target_frontier: "the child adds exactly one new link (no record of either sign before T) between pieces that are supported, and its novelty N is not lower than the parent's"
  later_profiles:   # same scheme, other targets; not specified further until the frontier pilot is read
    evidence: "raise the evidence balance (close to tuning: rewrite refuted links, narrow to the supported context)"
    funding: "raise feasibility (cheaper system, shorter duration, approved intervention) and move the endpoint towards function or a clinical event"

writer_input:   # one call per attempt; the parent's text and the facts below, no other literature
  - "the parent text and its normalised chain (id, type, subject - relation - object, qualifiers)"
  - "per link: S, its novelty level (novelty_v34.link_levels) and the PMIDs of the records that set it"
  - "the record that sets N (novelty_v34.novelty_source) and the parent's N"
  - "the frontier profile's order: N > evidence balance > I > feasibility > W"
  - >-
    the task: keep the intervention and every link with S > 1/2; add ONE new link - a new mediator between two known
    pieces, or a new outcome for a supported mechanism - that, as far as the writer knows, was not studied before T;
    name the two neighbouring links it connects; state the experiment that would test the new link
  - "the writer names the papers it relies on (as in free mode); they count only if the verifier finds them before T with a verbatim quote"

pipeline: "the child runs the whole pipeline with the parent's cut-off T (card, search, reading, alternatives, endpoint), as in the other modes"

acceptance_by_code:   # a child failing any check goes back to the writer with the reason, once; if it fails again it is kept with the flag "target not reached" and ranked as its own row
  same_intervention: "the parent's intervention is named in the child (evolve_v3.problems)"
  new_link: "exactly one link of the child's chain is at the level new_link (no record of either sign before T)"
  novelty_not_lower: "N child >= N parent on the ladder (unknown never counts as higher)"
  neighbours_supported: "the links on both sides of the new link have S > 1/2: a new piece between known pieces, not a chain of guesses"
  kept_links: "every parent link with S > 1/2 is in the child with the same text, or its balance contribution drops by at most 0.1"
  no_drift: "novelty_v34.drift(parent, child) is false"
  pubmed_absence: >-
    a separate PubMed count for the new link: records with the subject AND the object of the link (labels and synonyms
    from the card) published before T; above a threshold (fixed before the pilot, proposed 5) the link is not new and the
    child fails. Guards against 'new' meaning only that our reader missed the papers (key-paper recall 0.2-0.3, N
    overstated, kappa 0.14 in pack 7)

scoring: "the child is scored like every hypothesis (v3.6, ASPID under every profile on fixed scales); the report shows it as 'directed evolution (frontier)' next to the parent, with the new link marked and the PubMed count beside it"

outside_check:   # the user runs it through Argon; Claude builds the pack after a run
  pack: "every accepted child and every child kept with 'target not reached'; per child: parent text, child text, T, the new link (subject - relation - object), its two neighbours with their PMIDs"
  not_shown: "our S, N, balance, the PubMed count, the scores"
  asked_per_child:
    new_link_known_before_T: "was this link studied before T: no | partly (a related pair) | yes, with up to 3 PMIDs"
    plausible: "is the new link biologically plausible given its neighbours: yes | weak | no, one sentence"
    same_hypothesis: "is the child still a version of the parent (same intervention and question) or another hypothesis"
    testable: "does the stated experiment test the new link itself: yes | partly | no"
    better_for_frontier: "would an exploratory programme prefer the child or the parent, one sentence"
  measures: >-
    share of new links Argon calls not studied before T (the main measure: true novelty, not reader misses); agreement of
    our PubMed count with Argon's verdict; plausible and testable shares; share 'another hypothesis'; Argon's preference
    against our frontier score change
  reading_rule: >-
    the mode is worth keeping when at least 2/3 of the accepted new links are 'not studied before T' by Argon and at least
    2/3 'plausible'; if the PubMed count disagrees with Argon on more than 1/3 of the links, its threshold or the synonym
    list is the next fix; decisions go to the user

pilot:
  pool: "prospective (the writer knows the literature up to about T)"
  units: "the 10 hypotheses with the largest room to improve under the frontier profile (evolve_v3 --top 10 --profile frontier --dry, free)"
  writer: "Gemini (as free mode); open to the user's choice"
  cost: "about 21 calls per child, up to twice with a retry, about 0.05-0.1 USD per child off-peak: about 0.5-1 USD for 10; named again with the exact count before the run"
  limits: >-
    as for the other modes: evolution makes no new evidence; the new link is by design unsupported, so the balance of the
    child is at most the parent's on the old links and 0 on the new one; the child is written and scored by the same
    pipeline (circular), so a rise is a hint, not proof. Novelty rests on our search and reader; the PubMed count and the
    outside check are the guard.

implementation:   # after the user's go
  code: "hyparena/card/evolve_v3.py: MODES gains 'directed'; propose_directed + directed_problems (the checks above); prompt evolve_directed/v1; tests on hand-made pairs (a child with a new link between supported neighbours passes; with a known link, two new links, unsupported neighbours, another intervention, or drift fails)"
  manual: "section 11, the modes table gains the row 'directed'"

argon_trial_2026_11_09:   # Argon applied this spec by hand to 4 prospective trials (report sent by the user; data read by Claude)
  result: >-
    all four children reach 'new link' and the top of every profile (frontier +0.40 ... +0.57; evidence 0.47 -> 0.83 for
    NCT07726758), with P = 1.0 and W = hallmark in all four; room after ~0.01
  what_drove_it:
    against_records_gone: "every record against of the parents (10 of them, up to weight 0.84) is absent in the children; P -> 1.0 in all four: the 'rewrite refuted link' upper bound taken as a fact, not a re-reading"
    context_rewritten_to_fit: "the same papers move from 'adjacent' to 'exact' because the child's claims are narrowed to the papers' populations (e.g. 29508134 0.125 -> 0.25, 36324034 0.25 -> 0.5, 22770932 0.36 -> 0.72)"
    records_moved: "records moved from the outcome link to another link (NCT07726758: RCTs 34127610, 42297625 put on the morphometric link c2)"
    links_rewritten: "every parent link is rewritten (types changed: effect -> engagement, effect -> pathway), against kept_links"
    scope_relabelled: "W -> hallmark in all four through rewritten supported links naming a hallmark (loss of proteostasis)"
    experiment_inflated: "I up to 0.78-0.88 through 2x2(x2) factorial designs with biopsies, HD-sEMG, imaging; feasibility barely moves (0.85 -> 0.82): feasibility does not see the number of arms or invasive measures"
    pubmed_absence_by_conjunction: >-
      the 'PubMed <= T = 0' counts come from 3-4-way AND queries written by the writer (intervention form AND mediator AND
      population). Recounted by Claude (E-utilities, pdat <= T): the link's own subject AND object give 80 / 37
      (eccentric or resistance training AND Piezo1 / agrin / CAF22), 21 (galvanic vestibular stimulation AND hippocampus /
      theta), 136 (HIIT AND BDNF), 19 (vitamin D / VDR AND mitochondria AND skeletal muscle, before 2014-11-01)
    data_errors: "every record carries year 2024 whatever its publication year"
  amendments:   # to the checks above, before implementation
    pubmed_query_by_code: "the absence count is built by code from the new link's subject and object (labels and synonyms of the card), never by the writer; no third facet"
    reread_not_remove: "the child's records come only from the pipeline's own reading of the child (the same papers re-read against the child's claims); a parent record against disappears only if the code-checked context of the child no longer matches it, and the report lists each such disappearance with the reason"
    no_record_moves: "a record is never moved between links by the writer; links take findings by matching (paper skeleton)"
    kept_links_enforced: "parent links with S > 1/2 must be in the child with the same subject, relation, object and qualifiers; any change fails the check"
    scope_from_parent_links: "W of the child is computed from the kept links and the parent's supported links only; a rewritten link cannot raise W"
    narrowing_flagged: "narrowing a claim's context so that adjacent records become exact is reported as 'fitted to the found papers' with the records it lifts (it is the narrow_population item, which costs novelty)"
    experiment_cost: "feasibility gains the number of arms and invasive or specialised measures (biopsy, imaging, HD-sEMG); to be specified with the test-model work"
  reading: >-
    the spec's targets were met on paper but by the moves the checks were meant to stop; the mode is not adopted in this
    form; the amendments above go in before any implementation, and the Argon pack for the children asks for the
    against-records and the pair count explicitly

argon_trial_2_2026_11_09:   # Argon's second hand run with the manual's section 11 rules (report sent by the user)
  rules_kept: >-
    every parent link kept with its records (records against included: P unchanged in all four); no record moved; W
    unchanged (organ); one new link per version between supported neighbours; the PubMed count on the link's own subject and
    object (rechecked by Claude: 0, 2, 0, 1 before T; Argon gave 1, 2, 0, 0, all under 5); feasibility lowered for arms and
    invasive measures (0.85 -> 0.72, 0.82 -> 0.70, 0.74 -> 0.66, 0.88 -> 0.72)
  result: "frontier score +0.04, 0.00, -0.01, +0.05; evidence +0.08, +0.01, -0.01, +0.10 (from I); funding -0.05 ... -0.07"
  structural_finding: >-
    under the method as written a new mechanistic link cannot raise a frontier score on a trial whose outcome link has
    records: N is read from the outcome link (new_combination / new_link only without any outcome record), so it stays; and
    the new link's slot (S = 0.5, nothing known) enters the evidence balance as 0, diluting it (NCT07726758: 0.527 x 3/4 =
    0.395 exactly). With feasibility charged, directed evolution towards the frontier can only add I. The first run's gains
    all came from breaking the rules.
  decision_needed: "whether mechanism novelty (a supported-neighbour new link) should count for the frontier, and whether an untested inserted slot should dilute the balance; for the user"

decision_mechanism_novelty_2026_11_11:   # user decision; manual sections 7, 11, 12 (v3.9)
  question: "argon_trial_2_2026_11_09.decision_needed: should mechanism novelty count for the frontier, and should an untested inserted slot dilute the balance"
  balance: "already settled by v3.7 (2026-11-09): a slot without records is left out of the evidence balance"
  decision: >-
    a level of N, not a separate indicator: "new mechanism of a known effect" (new_mechanism), between analog and
    new_combination. Given when the outcome has records, a link before the outcome has none, both its chain neighbours are
    supported (S > 1/2 with a record for), and the PubMed count on the link's own subject AND object before T is under 5
    (rule 6, the same code); no count, no level. Reason: the ladder already holds mechanism levels (new combination, new link)
    used only without outcome records; the new level is their counterpart when the outcome was studied.
  code: "hyparena/card/novelty_v34.py (mechanism_candidates, mechanism_absence, new_mechanism_links, novelty(absence=...)); evolve_v3.compare counts when as_of is known; aspid_v3 N scale has six levels"
  tests: "tests/test_new_mechanism.py: candidate only between supported neighbours; under 5 counts, 5 does not, no count does not; no change without outcome records; count on subject AND object only; loss of the level is drift"
  checks_pending: >-
    free: Argon's four directed versions (counts 0, 2, 0, 1 rechecked earlier) must get the level; hand counter-examples (a
    known link reworded, an unsupported neighbour) must not; the admission rule of N re-run on the pools after the counts are
    made for saved runs (on registry pools the level is expected to be rare).
  side_effect: "the N scale has six levels instead of five: ASPID's random monotone mapping spreads the levels over [0, 1] differently, so frontier and funding scores of hypotheses with N move slightly when re-scored; frozen scores are untouched"
