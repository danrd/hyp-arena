id: balance-check-2026-11-08
written_on: 2026-11-08
status: definitions fixed before the pack was built or sent
why: >-
  User request 2026-11-08 ("prepare a new task for Argon"). The evidence balance (mean over the chain of 2S - 1, method v3.6)
  is the main axis of every profile. It was checked against trial outcomes (R3), later trials of the same link (R2) and the
  order of pairs of records (R4), but no outside reader has said, link by link, whether the literature before T supports or
  refutes it. Packs 6 and 7 showed that our inputs (alternatives, class label, search for prior work) were weaker than the
  rules; this pack asks the same of the links.
cost: free in money (Argon is the user's outside reader); PubMed (free) to check the PMIDs it gives
pack: Argon pack 8 (longevity-kg reviews/argon-2026-11-08/pack_8_task.json; hidden key pack_8_key.json)

sample: all 59 scored prospective trials (not the 74 calibration trials); every link of the normalised chain (150 links)
shown: "the registry text, T, the chain (id, type, subject - relation - object, qualifiers, which link is the outcome). Not shown: our S, F, A, records, balance"
asked:
  per_link: >-
    verdict from papers published on or before T: supported | mixed | refuted | no_evidence; strength of the verdict: weak |
    moderate | strong (for no_evidence: none); up to 3 PMIDs for and up to 3 against, the most informative ones
  per_trial: "balance from -1 (the chain is refuted) through 0 (nothing known, or balanced) to +1 (well supported), and one sentence"
measures:
  link: >-
    Argon's signed link score: refuted strong -1, moderate -2/3, weak -1/3; no_evidence and mixed 0; supported weak 1/3,
    moderate 2/3, strong 1. Spearman with our 2S - 1 (v3.6, judged d irrelevant here) over the 150 links; agreement on the
    sign (positive / zero / negative, with |2S - 1| < 0.1 as zero); the links Argon calls refuted that we put above 0.33
  trial: Spearman of our evidence balance with Argon's balance over the 59 trials
  pmids: "share of Argon's PMIDs that exist and are dated by T's year; share among our records of that link (recall of the key papers)"
reading:
  reproducible: "link Spearman >= 0.5 and trial Spearman >= 0.5: the main axis survives a second reader"
  missed_refutations: "links Argon calls refuted (moderate or strong) that we score above +0.33 are listed one by one: they are the dangerous errors"
  recall: "if fewer than half of Argon's key PMIDs are among our records, the search is the bottleneck of the balance too"
  note: "Argon is a second reader with its own knowledge, generous on support in pack 6; decisions go to the user"
result:   # Argon pack 8 answer 2026-11-08 (longevity-kg reviews/argon-2026-11-08/pack_8_answer.json); python -m scripts.pack8_analysis
  verdicts: "Argon: supported 106, mixed 36, refuted 5, no evidence 3 of 150 links"
  link: "Spearman of our 2S - 1 with Argon's signed score 0.24; sign agreement 0.41; ours 0 -> Argon supported 56, ours negative -> Argon supported 12"
  trial: "Spearman of the evidence balance 0.39; mean balance ours 0.08, Argon 0.45"
  readings: "not reproducible (both below 0.5); no missed refutation (no link Argon calls moderately or strongly refuted that we put above +0.33); recall triggered"
  pmids: "310 distinct, all in PubMed and dated by 2026"
  recall: "88 of Argon's 474 key papers (19%) are among our records of that link"
  where_lost:   # free diagnostic after the answer: each key paper against the search logs of the trial
    record_on_this_link: 88
    read_for_this_link_no_record: 147
    read_only_for_another_link_of_the_trial: 216
    never_retrieved: 23
  reading: >-
    the main axis does not survive a second reader at the level of a link, and the cause is located: not the search (95%
    of the key papers were retrieved) and not the rules, but the reading. A paper is read only against the claim whose
    search found it (46% of the key papers were read for another link of the same trial), and the reader turns only part
    of the papers it reads for a link into records (31% read, no record). The second reader is generous (a 0.45 mean
    balance against our 0.08) and is no gold standard; the safe direction holds: we never call a refuted link supported.
pilot_crosslink:   # user decision 2026-11-08 ("run", about 0.9 USD); written before the run
  sample: "the 30 prospective trials with the most pack-8 key papers (ties by NCT order)"
  reading: >-
    every chain link reads the union of the papers retrieved by the chain searches of its trial (its own first, then the
    others, deduplicated), in batches of at most 10 papers per call (verify_claim/v9, DeepSeek, no new search); the
    batches' records are merged; then the split reader (relabel_context/v1, Gemini) re-labels intervention_match and the
    contradicted qualifiers of every record, one call per link
  compared_with: "on the same 30 trials: the original reading (v9), the second v9 reading (reader noise), and the pilot"
  measures:
    recall: "pack-8 key papers that are a counting record on their link (v3.6 weights, judged d irrelevant)"
    link_and_trial: "Spearman of 2S - 1 per link and of the evidence balance per trial with pack 8"
    volume: "records per link; papers read per link; tokens and USD"
  decision: >-
    go to both pools in full (then R2 / R3 under the 0.03 rule) when recall at least doubles and the link Spearman with
    pack 8 rises by more than the gap between the two v9 readings
