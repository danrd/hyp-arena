id: reader-v12-2026-11-08
written_on: 2026-11-08
status: definitions fixed before any call
plan: docs/plans/reader-v12-2026-11-08.md (removed 2026-11-12 after the work was done; in git history)
user_decision: "2026-11-08: run the pilot (about 0.5 USD); 'unsure' papers of the filter go to the reader"
changes:
  filter_rule: >-
    a paper whose PubMed publication type is Review, Systematic Review, Editorial or Comment passes only when its abstract
    states a quantitative result (a 95% CI, a p value, or WMD / SMD / MD / OR / RR / HR with a number); Meta-Analysis passes
  filter_call: >-
    relevance_filter/v1 (DeepSeek), one call per link: title and the first 600 characters of each abstract; own_result
    yes / no / unsure for every PMID (a missing PMID counts as unsure); yes and unsure go on
  reader: >-
    verify_claim/v12 = v9 + "papers": one entry per PMID given (finding for / against / none); batches of at most 10
    papers; PMIDs missing from "papers" are asked again once in their own call; a PMID still missing is counted as a skip
papers: "each link's own search log (the papers its original reading had); no cross-link reading in this pilot"
dev: "the 10 links of Argon pack 9; at most two prompt revisions, on dev numbers only"
holdout: "the 102 links of the 30 pilot trials (pilot_crosslink sample), run once with the final prompts"
measures:
  dev: "recall and precision of own findings against pack 9 (a paper counts as found when it has a record on the link), direction agreement, share of PMIDs answered, gold findings dropped by the filter (rule and call separately), papers per link after the filter"
  holdout: "pack-8 key papers that are a counting record on their link (v3.6), link and trial Spearman with pack 8, next to original (0.16 / 0.19 / 0.44), second v9 and cross-link pilot"
  cost: "tokens and USD per step; stop if a step exceeds its line of the plan (dev run 0.03, revisions 0.06, holdout 0.40)"
pass: >-
  dev recall >= 0.65 and precision >= 0.65 with direction agreement kept and at most 1 of the 21 gold findings dropped by
  the filter; holdout key-paper recall >= 0.24 (1.5x the original 0.16) and link Spearman above the original by more than 0.03
dev_revisions:   # on dev numbers only (pack 9 links); costs in USD
  rev0: "filter v1 + reader v12: kept 2.0 of 20 papers per link; gold findings dropped by the filter 10 of 21 (call 8, rule 2); recall 6/21 = 0.29, precision 0.75, direction 6/6; every PMID answered; 0.009"
  rev1: "filter v2 ('no' only for a clear absence of an own result) + rule with result words: kept 8.1 per link, no gold finding dropped; recall 7/21 = 0.33, precision 0.78, direction 7/7; the reader answered 'none' for all 14 gold findings it missed, 10 of them for an intervention of the same kind; 0.022"
  rev2: "reader verify_claim/v13 = v12 + the manual's reading rules 1-2 restated in the per-paper answer (a same-kind intervention, another population or animals is for / against with intervention_match class; a between-group null is against); filter v2 unchanged"
dev_rev2_result: "filter v2 + reader v13: kept 7.8 of 20 per link, no gold finding filtered; recall 11/21 = 0.52, precision 11/15 = 0.73, direction 11/11; every PMID answered, no skip; 0.022 USD"
holdout_result:   # run once, filter v2 + reader v13, 102 links of the 30 pilot trials, own searches; 0.257 USD
  volume: "19.7 papers per link, 9.7 kept (filter drops 946, rule 71); every PMID answered, no skip"
  pack8: "key papers on their link 63/327 = 0.19 (original 0.16, cross-link pilot 0.24); link Spearman 0.20 (original 0.19); trial Spearman 0.20 (original 0.44)"
  pass: "not met: dev recall 0.52 < 0.65; holdout recall 0.19 < 0.24; link Spearman +0.01 (< 0.03); trial order worse"
  cost_total: "0.31 USD (dev 0.053, holdout 0.257; named about 0.5)"
  reading: >-
    the per-paper answer removes silent skips and the filter halves what the reader reads without losing gold findings;
    on the per-paper gold the reader becomes more precise (0.50 -> 0.73) and finds more (0.38-0.48 -> 0.52). But against
    pack 8 (Argon's key papers per link) almost nothing changes, and the trial order gets worse: two thirds of Argon's key
    papers are not in a link's own search at all (pack 8 diagnostics), so a better reader of the same papers cannot reach
    them, and fewer, more precise records move the balance of whole trials. The two outside references reward different
    things: pack 9 the reading of what was found, pack 8 the literature Argon knows. Not adopted.
crosslink_v13:   # user decision 2026-11-09 (option 1: v13 on top of cross-link reading, about 0.7-0.9 USD); written before the run
  papers: "each chain link of the 30 pilot trials reads the union of the chain searches of its trial (as pilot_crosslink), then filter v2 + rule, then reader v13 in batches of 10 with an answer for every PMID"
  run: "once, off-peak (not 01-04 or 06-10 UTC on weekdays); stop if the cost passes 1.0 USD"
  measures: "pack 8 (key papers on their link, link and trial Spearman) on the 102 links; pack 9 (recall, precision, direction) on its 10 links, which are among them"
  pass: >-
    key-paper recall >= 0.30 (cross-link alone 0.24, original 0.16), link Spearman >= 0.32 (cross-link alone 0.29 + 0.03),
    trial Spearman >= 0.39 (original 0.44 - 0.05), and pack-9 recall >= 0.52 with precision >= 0.65; then both pools in
    full and R2 / R3 under the 0.03 rule
crosslink_v13_result:   # 2026-11-09 10:06-10:20 UTC (off-peak); prospective/reader_v12_crosslink_v13.json; python -m scripts.reader_v12 score --part crosslink --rev v13
  run: "102 links of 30 trials; 57.4 papers per link, 21.9 kept by rule + filter v2 (filter drop 3400, rule drop 226, yes 1845, unsure 385); every kept PMID answered; 0.57 USD"
  pack8: "key-paper recall 0.29 (95/327; cross-link alone 0.24, original 0.16); link Spearman 0.306 (0.29); trial Spearman 0.319 (original 0.44)"
  pack9: "recall 0.57 (12/21), precision 0.75 (12/16), direction 12/12; no gold finding dropped by the filter"
  pass_rule: "not met: recall 0.29 < 0.30, link Spearman 0.306 < 0.32, trial Spearman 0.319 < 0.39; pack-9 recall and precision pass"
  reading: >-
    v13 on top of the cross-link union gives the best recall of any reader so far (0.16 -> 0.29 of the key papers, pack-9
    recall 0.57 at precision 0.75), but the trial order against the second reader falls (0.44 -> 0.32): more records per
    link do not yet order the trials better. Not adopted for both pools; no run on the full pools.
