id: record-weight-2026-11-08
written_on: 2026-11-08
status: >-
  step 0 (definitions, references, menu, decision rules) fixed before any value of steps 3-7 was computed. Steps 1-2 are
  descriptive; their only numbers seen before writing this file are the shares of the spread of log w and the level counts
  of design, context and n shown to the user in the conversation of 2026-11-08 (604 records).
plan: docs/plans/record-weight-2026-11-08.md
why: >-
  User request 2026-11-08: work out step by step which factors of the record weight are needed (and whether some are
  missing), their levels, their relative weights, and how records for and against are folded into a link state; the result
  must be methodologically clear (GRADE as the frame) without making quality noticeably worse. The trial outcome is too
  noisy to decide this alone (ablation 2026-11-07: counting records 0.602 vs P 0.595).
cost: free (no model calls; PubMed E-utilities for dates and abstracts)

records:
  pool: >-
    every record of the 73 calibration units (scripts.ablation.units, runs run_<s>_v10, verifier verify_claim/v9) and of the
    60 prospective trials (prospective/run_60.json) that counts under v3.5 (usable, context not None, weight > 0), on the
    declared claims of the cards (alternatives excluded); v3.5 = evaluate(..., v34=True, null_power=True).
  link: one claim of one card. Records of the same paper on two claims are two records.

step1_descriptive:
  per_factor: level counts (for, against; outcome link vs links before the outcome); mean, min, max of the factor value
  share_of_spread: >-
    var(log w) split as cov(log f_k, log w) / var(log w) (the shares sum to 1), for all records, for, against, outcome link,
    links before the outcome
  correlations: Spearman between the log factors (does one factor duplicate another)
  missing: n unknown, effect unclear, comparison unknown, design unknown/other
  fold: how much the fold by independence group changes F and A (share of records folded, ratio folded / unfolded sum)
  availability_for_step6: >-
    share of records with a usable value for each candidate factor: flags open_label, subgroup_only, conflict_of_interest,
    small_n; marker_validation; endpoint; blinding / placebo words in the abstract (regex, step 6)

step2_extraction_reliability:
  earlier: >-
    from specs/extraction-gold-v9-2026-11-05.yaml (16 relevant pairs): design 0.88, comparison 0.88, n_total 0.81,
    effect_class 0.81 (= constant baseline); from specs/sources-experiment-2026-11-07.yaml: intervention match and effect
    numbers are the weak fields. No earlier gold for the context label (intervention_match, qualifiers).
  context_check:
    sample: >-
      40 records drawn by SHA-1 of "record_id|card|claim" (lowest first), stratified by the verifier's context label:
      25 class, 10 adjacent, 5 exact (all if fewer), from the whole pool.
    labeller: Claude, by hand, from the claim, the quote and the abstract (PubMed), before looking at the record's weight
    rule: >-
      manual section 4, reading rules 1 and 5 (verifier prompt v10 wording): the match is judged at the level at which the
      claim names the intervention; a kind named in the claim makes any study of that kind exact; class only when the claim
      names a specific product, compound or programme and the study used another member of its kind; adjacent when the
      population, species, age, sex, dose or comparator differs; none when the intervention is another altogether.
    measures: agreement with the verifier (share and Cohen kappa over exact / adjacent / class / none); share of class that
      should be exact; the weight ratio this implies (class 1/3 -> exact 1).
    decision: >-
      if 30% or more of the class labels should be exact, the context label carries a systematic error of extraction:
      steps 4-7 are computed twice, with the verifier's label and with the hand label on the sample (the sample is too
      small to relabel the pool), and the fix (code rule, or a paid re-run of the verifier with v10) is a separate question
      to the user.
    privacy: quotes and abstracts only in longevity-kg (calibration/record_weight_context_check.jsonl); the public spec gets
      counts.

references:
  dates: >-
    PubMed publication year (hyparena.tools.pubmed.fetch gives the year only); "strictly before" = an earlier year (same
    year is not before); a record without a year is dropped from R1 and R2 and counted.
  R1_meta_analysis:
    unit: a link with at least one usable meta-analysis record and at least two primary records (design not meta_analysis,
      not review) of distinct independence groups published strictly before the earliest such meta-analysis
    label: 1 if that meta-analysis record is for, 0 if against; links where two meta-analyses before T disagree are left
      out and counted (a measure of the reference's own noise)
    score: link state s = 2S - 1 from the earlier primary records only, under each variant
    measure: tied AUC; sign agreement (s > 0 vs label) reported
  R2_later_trial:
    unit: >-
      every record of design rct or meta_analysis (the target) of a link, given the records of that link of other
      independence groups published strictly before it, when there are at least two of them; one link may give several
      targets
    label: 1 if the target is for, 0 if against
    score: s from the earlier records only, under each variant
    measure: tied AUC; the confidence interval by bootstrap over links (targets of one link resampled together)
    primary: R2 is the main reference (the larger one); R1 confirms
  R3_trial_outcome:
    measure: tied AUC of the chain state (v3.5) on the 73 calibration units
    constraint: a variant may not lower it by more than 0.03 against the current rules
  R4_pairs_argon: step 5, pack 5, prospective pool only (definitions written before the pack is sent)

context_variants:   # user decision 2026-11-08: steps 3-7 computed under both (written before step 3 was computed)
  verifier: the context label as the verifier set it (v3.5)
  claim_qualifiers: >-
    a "no" in qualifiers_match counts only when the claim fixes that qualifier: population when the claim names population,
    disease or age_at_start; age_at_start, sex, dose, comparator when the claim names them; species when the claim names a
    species or is a claim about humans (rules_v3.human_claim). Other "no" are ignored; then the v3.4 rule (species alone on
    the outcome link of a human claim is exact) as before. intervention_match unchanged. Records that did not count only
    because of an ignored "no" now count. The gate is unchanged (rules_v3).

menu:   # every variant changes one thing against the current rules (v3.5); steps 4-7 compute all of them
  current: v3.5 (design 7 levels on the outcome link of a human claim, 3 before it; precision min(1, ln n / ln 300), floor
    1/4, constant 1/2 before the outcome; effect continuous / class; comparison 1/3, 2/3, 1; context 1/3, 2/3, 1; null by
    power; fold 1/4; Beta with c = 6.67)
  step4_factors:
    drop: for each factor, the factor set to 1
    design_grade3: RCT and meta-analysis 1; non-randomised and observational 1/2; animal, cells, review, other 1/4 (GRADE
      high / low / very low); before the outcome unchanged
    precision_steps3: n < 50 -> 1/4; 50-299 -> 1/2; >= 300 -> 1; unknown 1/4
    precision_power_both: >-
      the records for also weigh by the power of the study (d 0.4, as the nulls) instead of precision x effect; a large
      effect multiplies by 1.5 (GRADE rating up), capped at 1
    effect_rate_up: >-
      records for: effect none or small 1/2, everything else (medium, large, unclear) 1; the effect only lowers a small
      effect
    comparison_2: between groups 1, else 1/2
    context_2: exact or class 1, adjacent 1/2 (indirectness charged once, class not charged)
  step6_new:
    risk_of_bias: >-
      a record for from a study without blinding or placebo (abstract words: open-label, unblinded, single-arm, no placebo /
      sham; and no "double-blind", "placebo", "sham") x 1/2 (GRADE: rate down one level); records against unchanged
    subgroup_only: a record for flagged subgroup_only x 1/2
    surrogate: a record for on an unvalidated marker (marker_validation exploratory) x 1/2 on the outcome link
    admission: a usable value on at least 70% of the records it applies to; else reported and not computed
  step7_fold:
    beta_current: S = (cF + 1) / (c(F + A) + 2), s = 2S - 1, c = 6.67
    loglr_sum: >-
      L = lambda (F - A), s = tanh(L / 2) (equal to 2 sigmoid(L) - 1); lambda anchored as c is: F = 0.6 alone gives
      s = 2/3, lambda = 2 atanh(2/3) / 0.6 = 2.68. Each record is evidence with log likelihood ratio lambda w (for) or
      -lambda w (against)
    best_evidence: >-
      s = sign of the heaviest record times its weight (in GRADE the certainty is set by the best evidence), ties by the
      sum
    count_diff: s = (nF - nA) / (nF + nA + 1) over independence groups (weights ignored)
    fold_rest: 1/4 (current), 0 (one record per independence group), 1 (no fold)

decision_rules:
  simpler_unless_worse: >-
    a simpler variant (fewer factors or levels) or one closer to GRADE replaces the current one unless it is worse by more
    than 0.03 on R2 (or on R3); differences inside 0.03 count as equal and the simpler / clearer one wins
  more_complex_only_if_better: >-
    a variant that adds a factor or a level is adopted only if it raises R2 by at least 0.03 and lowers neither R1 nor R3
    by more than 0.03, or if GRADE requires it (risk of bias) and it is not worse by more than 0.03
  noise: >-
    with tens of units an AUC moves by about 0.05-0.10 by chance; the rules above choose between equals by clarity, they do
    not claim significance. Every decision goes to the user before the code of the method changes.
  one_change_at_a_time: variants are compared one at a time against the current rules; the combination of the chosen ones
    is computed once at the end and reported, not tuned.

step1:   # python -m scripts.record_weight_check step1 -> calibration/record_weight_step1.json
  records: "595 (calibration 279, prospective 316; for 453, against 142) on 186 links; outcome link 509, before it 53, null 33"
  share_of_spread_log_w: {all: {precision: 0.39, effect: 0.18, design: 0.17, comparison: 0.14, context: 0.13},
                          for: {precision: 0.42, design: 0.21, comparison: 0.16, context: 0.11, effect: 0.10},
                          against: {precision_as_power: 0.67, context: 0.15, comparison: 0.11, design: 0.07, effect: 0.0},
                          before_outcome: {comparison: 0.42, design: 0.28, context: 0.15, effect: 0.12, precision: 0.03}}
  weight: "median 0.13 (10-90%: 0.04-0.29); records for 0.12, against 0.19"
  levels:
    design: >-
      outcome link: RCT 1 (326), meta-analysis 6/7 (80), non-randomised 5/7 (54), observational 3/7 (16), review 4/7 (11);
      33 outcome-link records sit on the preclinical 3-level scale (observational, non-randomised, animal at 1, meta-analysis
      2/3) because their claim has no species "human" (card qualifiers missing). Meta-analysis weighs below RCT (6/7), the
      opposite of GRADE for a meta-analysis of RCTs.
    precision: "records for: n 50-299 148, < 50 99, unknown 79, >= 300 78, constant 1/2 before the outcome 49; against (power): 50-299 69, < 50 29, >= 300 27, unknown 17"
    effect: "records for: class unclear (1/2) 352 of 453 (78%), a continuous value 62, a stated class 39; against: always 1"
    comparison: "between groups 500, within group 78, none 17"
    context: "class (1/3) 465, adjacent (2/3) 98, exact 32"
  spearman_log_factors: "all |rho| <= 0.22 except design~comparison 0.31: no factor duplicates another"
  missing: "n unknown 128 (22%); effect unclear 375 of 453 records for (83%); design other 3"
  fold: "only 18 records share an independence group with another record of the same link; the fold changes F and A by 1%: the fold rule is moot on these data"
  availability_for_step6: >-
    flags on records for: small_n 80, subgroup_only 35, open_label 31, disease_model 3 (open_label is set by the verifier
    only when an abstract says so; blinding must come from the abstract words); marker_validation n/a on all 453 (the
    surrogate candidate cannot be computed from it; the field endpoint is filled: healthspan 174, biomarker 119, disease 60,
    mechanism 48, unknown 52)
  reading: >-
    the order of records is set mostly by n (precision, and power for nulls); design hardly varies (most records are RCTs
    on the outcome link); effect is a constant 1/2 for four records in five; context is nearly constant but lowers the
    level threefold (78% class). The links before the outcome have 53 records in all: the weights matter almost only on
    the outcome link.
step2:   # python -m scripts.record_weight_check step2-sample / step2-score; labels in longevity-kg calibration/record_weight_context_check.jsonl
  sample: "40 records (25 class, 10 adjacent, 5 exact), labelled blind to the verifier's label, rule of verifier prompt v10 (the records were read with v9)"
  agreement: {share: 0.575, kappa: 0.38}
  confusion: {class->class: 13, class->exact: 6, class->adjacent: 5, class->none: 1, adjacent->adjacent: 5, adjacent->exact: 5, exact->exact: 5}
  class_should_be_exact_share: 0.24
  class_should_be_higher_share: 0.44
  weight_ratio_hand_over_verifier: {mean: 1.46, median: 1.0}
  decision_rule: "formally not triggered (24% < 30% exact); but 11 of 25 class labels should weigh more (exact or adjacent) and 5 of 10 adjacent should be exact"
  causes:
    kind_named_in_claim: >-
      6 of the 12 upgrades: the claim names a kind (probiotics, exercise, heavy resistance training, a nutritional
      intervention) and v9 called a study of that kind class; verifier prompt v10 fixes this rule (not run on these pools)
    unfixed_qualifiers: >-
      4 upgrades: adjacent only because the verifier marked "no" on a qualifier the claim does not fix (sex, dose,
      population, comparator). In the whole pool 53 of 98 adjacent records are adjacent only on such qualifiers: a free code
      rule (count "no" only on qualifiers the claim names) removes them
    other: "2 adjacent kept as adjacent but dose or population really differ; 1 class is no result on the claim at all (both arms got the intervention)"
  caveats: "one labeller (Claude); records extracted with v9 judged by the v10 rule; two claims of the sample are malformed (subject 'interventions', object 'profit potential')"
  consequence_for_steps_3_7: >-
    steps 3-7 are computed with the verifier's context and with the code rule for unfixed qualifiers; the kind-level match
    needs the v10 verifier (paid re-run) and is the user's decision
step3:   # python -m scripts.record_weight_check step3 -> calibration/record_weight_step3.json; current rules (v3.5)
  years: "all 595 records have a PubMed year"
  R1: >-
    55 links have a meta-analysis; 9 left out because their meta-analyses disagree, 28 because fewer than two primary
    records of distinct groups came before the first meta-analysis; 18 links remain, 15 for and 3 against. AUC 0.756, sign
    agreement 0.72; with 3 negatives the AUC is not informative: R1 is reported, decisions rest on R2 and R3
  R1_noise: "9 of 27 links with a meta-analysis and enough history have meta-analyses that disagree (one third): the meta-analysis verdict is itself a noisy label"
  R2: "195 targets on 71 links (146 for, 49 against), median 3 earlier records per target; AUC 0.666 (95% CI by links 0.57-0.75)"
  R2_noise: "in 26 of the 71 links later trials disagree among themselves"
  R3: "chain state AUC 0.609 on the 73 calibration units (as specs/link-scoring-2026-11-08.yaml)"
  context_variants: >-
    claim_qualifiers: one more record counts (596); R1 the same, R2 0.657 (0.56-0.75), R3 0.608: inside 0.03 of the
    verifier's label, i.e. equal by the decision rule
  reading: >-
    R2 is usable: the link state from earlier records orders later trials better than chance (0.67), more clearly than the
    trial outcome does (0.61); its interval is about +-0.09, so the 0.03 rule chooses between equals by clarity. The
    meta-analysis reference is too small and itself noisy.
step4:   # python -m scripts.record_weight_check step4 -> calibration/record_weight_step4.json; one change at a time against v3.5
  notes: >-
    design_grade3 applies where the 7-level clinical scale applied (outcome link of a human claim); precision_steps3 and
    precision_power_both change records for on the outcome link (nulls keep their power); dR2 = paired bootstrap over
    links (2000), variant minus current
  verifier_context:   # R2 / dR2 95% CI / R3 / R1 / Spearman of the 186 link states vs current
    current:              [0.666, null, 0.609, 0.756, 1.0]
    drop_design:          [0.665, [-0.010, 0.008], 0.621, 0.756, 0.990]
    drop_precision:       [0.659, [-0.046, 0.036], 0.602, 0.800, 0.948]
    drop_effect:          [0.650, [-0.031, 0.000], 0.594, 0.756, 0.986]
    drop_comparison:      [0.665, [-0.008, 0.006], 0.625, 0.756, 0.994]
    drop_context:         [0.675, [-0.017, 0.039], 0.607, 0.756, 0.977]
    design_grade3:        [0.669, [-0.004, 0.010], 0.598, 0.778, 0.997]
    precision_steps3:     [0.674, [-0.013, 0.028], 0.587, 0.800, 0.982]
    precision_power_both: [0.663, [-0.033, 0.026], 0.619, 0.733, 0.962]
    effect_rate_up:       [0.669, [-0.005, 0.012], 0.605, 0.778, 0.999]
    comparison_2:         [0.666, [-0.004, 0.004], 0.599, 0.756, 0.999]
    context_2:            [0.683, [-0.015, 0.057], 0.606, 0.711, 0.957]
  claim_qualifiers_context: "the same picture shifted by about -0.01 on R2 (current 0.657; context_2 0.672, drop_context 0.675, drop_effect 0.643); R3 identical within 0.002"
  reading: >-
    every single change stays inside 0.03 of the current rules on R2 and on R3 (lowest R3 0.587, precision_steps3), and
    every paired interval contains 0: by the decision rule all are equal to the current rules. The order of the links
    hardly moves (Spearman >= 0.95 for every change; precision moves it most). The only factor whose removal lowers both
    R2 and R3 is effect (-0.016, -0.015); removing or flattening context raises R2 (+0.009, +0.017), consistent with the
    unreliable class label of step 2; removing design or comparison raises R3 a little (+0.012, +0.016). The references
    cannot tell the factors apart: this is a limit of power (R2 interval about +-0.09), not evidence that the factors are
    useless; the choice between equals is made by clarity and GRADE (decision of the user, step 8), and the combination is
    computed once (step 8), with counting records (step 7, count_diff) as the counterfactual.
combination_preview:   # 2026-11-08, at the user's request after step 4 (earlier than planned: several combinations were looked at, not one)
  simplified: "design_grade3 + comparison_2 + context_2, with precision steps3 or continuous, and effect rate-up / dropped / as now"
  verifier_context:   # R2 / dR2 95% CI / R3 / R1
    current:                               [0.666, null, 0.609, 0.756]
    steps3_effect_rate_up:                 [0.685, [-0.018, 0.058], 0.573, 0.778]
    steps3_no_effect:                      [0.676, [-0.033, 0.055], 0.583, 0.756]
    steps3_effect_as_now:                  [0.683, [-0.021, 0.058], 0.582, 0.778]
    continuous_precision_effect_rate_up:   [0.689, [-0.009, 0.065], 0.589, 0.756]
    continuous_precision_no_effect:        [0.678, [-0.024, 0.054], 0.580, 0.733]
    continuous_precision_effect_as_now:    [0.686, [-0.013, 0.061], 0.593, 0.756]
    count_of_papers_no_weights:            [0.653, [-0.061, 0.040], null, 0.822]
  claim_qualifiers_context: "the same order, R2 about 0.01 lower"
  reading: >-
    the small R3 losses of single changes add up: with precision in three steps R3 falls to 0.573 (beyond the -0.03
    constraint); with continuous precision kept the simplified set raises R2 by about 0.02 and lowers R3 by about 0.02,
    both inside the noise. Dropping effect costs most on R3 (0.580, at the limit). Counting papers without weights is the
    lowest on R2 (0.653). Candidate: continuous precision + design_grade3 + comparison_2 + context_2 + effect_rate_up
    (R2 0.689, R3 0.589); step 6 (risk of bias) and step 7 (fold) to be computed on top of it.
step6_step7_definitions:   # written 2026-11-08 before steps 6-7 were computed (user agreed: risk of bias by variants 1 and 2, then the fold)
  base: "candidate = continuous precision + design_grade3 + comparison_2 + context_2 + effect_rate_up; every variant below is the candidate plus one change; both context variants"
  applies_to: "records on the outcome link whose design is rct or non_randomised (trials); observational, meta-analyses, reviews, animal and cell studies unchanged"
  words: >-
    from the PubMed title + abstract, lower case: blinded = double-blind | triple-blind | placebo | sham | assessor-blind |
    blinded assessor | blinded outcome; open = open-label | unblinded | non-blinded | not blinded | single-arm | no blinding
    (blinded wins when both)
  rob_words3: "records for: blinded 1, open 1/2, no words 2/3"
  rob_words3_both_sides: "the same factor on records against too"
  rob_subjective: >-
    records for: x 1/2 when not blinded (open or no words) and the outcome is subjective; subjective = the claim's measure,
    object or the record's quote contains quality of life | QoL | pain | fatigue | self-report | questionnaire | perceived |
    mood | depress | anxiety | sleep quality | satisfaction | well-being | wellbeing | PSQI | SF-36 | VAS
  subgroup_only: "records for flagged subgroup_only x 1/2"
  surrogate: "not computed: marker_validation is n/a on every record (step 1)"
  admission: "every trial record has a value for rob (no words is a level), so rob passes the 70% availability rule"
  step7_fold:
    on: "the candidate weights (rob only if step 6 adopts it)"
    beta_current: "S = (cF + 1) / (c(F + A) + 2)"
    loglr_sum: "S = sigmoid(lambda (F - A)), lambda = 2.68 (s = tanh(lambda (F - A) / 2))"
    best_evidence: "per link the heaviest record for (Fmax) and against (Amax), both after the fold; s = Fmax if Fmax > Amax, -Amax if Amax > Fmax, 0 if equal (ties by the sum are not separated)"
    count_diff: "s = (nF - nA) / (nF + nA + 1), n = independence groups with a usable record on that side"
    fold_rest: "0 and 1 against the current 1/4"
    r3: "the chain state with the link's S replaced accordingly; the gate unchanged"
step6:   # python -m scripts.record_weight_check step67 -> calibration/record_weight_step67.json; verifier context (claim_qualifiers about -0.01 on R2, same reading)
  trial_records: "392 trial records on the outcome link: blinded 129, open stated 10, no words 253; subjective outcome 70 (unblinded subjective 50)"
  R2_R3_R1:   # vs the candidate (R2 0.689, R3 0.589, R1 0.756)
    rob_words3:            [0.687, 0.584, 0.778]
    rob_words3_both_sides: [0.693, 0.594, 0.778]
    rob_subjective:        [0.691, 0.583, 0.778]
    subgroup_only:         [0.695, 0.578, 0.756]
  reading: >-
    no risk-of-bias variant moves R2 or R3 by more than 0.01 against the candidate (every paired interval contains 0); all
    pass the GRADE clause (required by the frame, not worse by more than 0.03). Abstract words leave 65% of trial records
    "no words": the factor is mostly "unknown", so a verifier field is needed for it to mean much. subgroup_only lowers R3
    to 0.578, beyond the constraint against the current rules (0.579): not adopted.
step7:   # on the candidate weights
  R2_R3_R1:
    beta_current:  [0.689, 0.589, 0.756]
    loglr_sum:     [0.712, 0.595, 0.733]
    best_evidence: [0.685, 0.565, 0.311]
    count_diff:    [0.653, 0.622, 0.822]
    fold_rest_0:   [0.689, 0.589, 0.756]
    fold_rest_1:   [0.689, 0.588, 0.756]
  dR2_vs_candidate: {loglr_sum: [0.003, 0.049], best_evidence: [-0.063, 0.048], count_diff: [-0.088, 0.018]}
  reading: >-
    the sum of log likelihood ratios (for minus against, then tanh) is the only variant of the whole check whose paired
    interval excludes 0 (+0.023 on R2) and it also raises R3; with about twenty intervals computed, one excluding 0 can be
    chance, so it is read as "not worse and clearer", which the rules already suffice for. Best evidence fails R3 (0.565).
    Counting papers is lowest on R2 (0.653) but highest on R3 (0.622): on trial outcomes the weights still add nothing
    over counting. The fold rest (0, 1/4, 1) is moot.
final_combinations:   # vs the current rules; R2 / dR2 95% CI / R3 / R1 / Spearman of the 186 link states vs current
  verifier_context:
    candidate_loglr:                [0.712, [0.011, 0.092], 0.595, 0.733, 0.911]
    candidate_rob_subjective_loglr: [0.717, [0.016, 0.097], 0.594, 0.778, 0.909]
    candidate_rob_words3_both_loglr: [0.710, [0.010, 0.087], 0.606, 0.800, 0.899]
  claim_qualifiers_context:
    candidate_loglr:                [0.702, [0.009, 0.091], 0.593, 0.756, 0.918]
    candidate_rob_subjective_loglr: [0.706, [0.015, 0.094], 0.593, 0.778, 0.917]
    candidate_rob_words3_both_loglr: [0.698, [0.009, 0.081], 0.604, 0.800, 0.903]
  reading: >-
    the simplified GRADE-shaped weights with the log-likelihood fold beat the current rules on R2 by about 0.045 (interval
    above 0) and stay within the R3 constraint (0.594-0.606 vs 0.609); the link order moves moderately (rho about 0.90).
    Decision on adoption and on the risk-of-bias variant: the user (step 8).
