id: review-gold-2026-11-17
written_on: 2026-11-17
status: "definitions fixed before the pack is sent; Argon pack 29 (labels), nothing run by the pipeline"
why: >-
  The end-to-end check against the outcomes of single trials is limited by how much the literature before T says about one
  trial (R3 0.578 [0.445, 0.710] on 73 trials; the pipeline's own noise costs about 0.02; specs/whole-system/
  calibration-current-2026-11-16.yaml), and one RCT is a noisy label (R2 between links 0.552, on meta-analysis targets
  0.658 on 36 targets). The conclusion of a later systematic review is a stronger label and measures what the method
  claims: the state of the evidence on a link. The question: does the strength of the outcome link at T, computed by the
  method from what was published before T, predict the pooled result of a systematic review that also pools trials
  published after T?
candidates:
  source: "PubMed (NCBI E-utilities), code: scripts/argon/pack29_reviews.py build; free"
  query: >-
    "Cochrane Database Syst Rev"[ta] AND 2021/01/01:2025/12/31[dp] AND hasabstract AND ("older adults"[tiab] OR
    "older people"[tiab] OR "older persons"[tiab] OR elderly[tiab] OR frail*[tiab] OR "aged 65"[tiab] OR "aged 60"[tiab] OR
    "Aged"[mh] OR older[ti] OR "later life"[ti]) NOT (withdrawn[ti] OR "diagnostic test accuracy"[tiab] OR
    "diagnostic accuracy"[ti] OR prognos*[ti] OR qualitative[ti] OR overview[ti] OR "Cochrane reviews"[ti])
  pool: "216 reviews on 2026-11-17"
  sample: "60 drawn at random from the pool sorted by PMID (random.Random(20261117)); every one is labelled or excluded with a reason, none is replaced"
  why_cochrane: "a fixed format: the main comparison and outcomes in the abstract, GRADE certainty stated, a table of included studies"
labels_by: "Argon (outside reader), three parts of 20 in separate chats; code checks every PMID, title and quote"
per_review:
  include: >-
    a review of an intervention (drug, supplement, exercise, nutrition, behavioural, device, procedure, organisation of
    care) in older adults or in an age-related condition, with a pooled estimate for its main outcome
  exclusion_reasons: [not_intervention, population_not_ageing, no_pooled_estimate, included_studies_not_accessible, other]
  main_comparison: "the first comparison the abstract reports results for"
  main_outcome: "the first primary outcome of that comparison with a pooled estimate in the abstract"
  link: "intervention -> main outcome -> population, in the review's words, plus the comparator and the kind of intervention"
  label: >-
    benefit: the pooled estimate favours the intervention and its 95% interval excludes no effect (for an outcome where
    less is better, such as falls, a reduction); no_effect: the interval includes no effect; harm: favours the comparator
    with the interval excluding no effect. With the verbatim sentence of the abstract that gives the estimate
  certainty: "GRADE certainty of that outcome as the abstract states it (high, moderate, low, very low, not stated), with its sentence"
  included_studies: >-
    the studies that contribute to the main outcome's pooled estimate (when the review does not say which, all included
    studies of the main comparison, marked so): per study its name as the review gives it and the year of its first
    publication, and its PMID when Argon finds it; for more than 40 studies, the number of studies per year only. Only
    openly accessible versions of the review are used (the Cochrane Library or PMC); if none is open, the review is excluded
    (included_studies_not_accessible)
T_rule: >-
  by code from the years of the contributing studies (y1 <= ... <= yn): Y is the earliest year by which at least half of
  them had been published (count of yi <= Y at least n/2), and T = Y-12-31. A link is usable when at least one study was
  published before or in Y and at least one after Y, so that the method sees part of the pooled evidence and the review
  adds later trials. Every study year given with a PMID is checked against PubMed (the year of the PubMed record, plus or
  minus 1); a study year that fails is reported, and T is computed with the PubMed year
checks_by_code: "review PMID exists, title matches; the three quotes verbatim in the abstract; study PMIDs exist, before the review, years agree; T and usability per link (scripts/argon/pack29_reviews.py check)"
later_run:   # recorded now; the pass rule and the price are confirmed before the paid run
  what: >-
    for each usable link: a card built by code from the link (no parse by a model), the working search before T and the
    working reader (configs/v3-flash-n10.yaml), the strength S of the outcome link by the rules of the manual
  measure: >-
    AUC of S against the label (benefit 1; no_effect and harm 0), with a bootstrap interval over links; beside it the
    plain count of records for minus against, and the share of links with no record before T (left out of the AUC, counted).
    Second cut: the same with certainty moderate or high only
  rule_proposed: "signal when AUC >= 0.65 and the lower end of its 95% interval above 0.5; no signal below 0.55; unclear between"
  price: "about 0.08 USD per link by the calibration run; about 2.5 USD for 30 links; a dry run before"
labels_result_2026_11_17:
  answers: "longevity-kg reviews/argon-2026-11-17/pack_29_{1,2,3}_answer.json; code check pack_29_check.json"
  counts: "60 answered; 31 included, 29 excluded (no pooled estimate 12, population not ageing 12, included studies not accessible 2, not an intervention 2, other 1)"
  usable: "30 links (benefit 17, no_effect 13, harm 0); one included link unusable: all its 3 studies published by its T"
  checks: "the result, certainty and conclusion quotes verbatim in the abstract for every included review (one certainty not stated); 183 of 213 contributing studies with a PMID; 10 study years off by more than a year against PubMed (6 links), T computed with the PubMed year; contributing studies known from the analysis in 27 of 31"
  T: "from 1989 to 2022 (median about 2009); studies per link 2 to 83 (median 5)"
  certainty: "high 4, moderate 10, low 13, very low 3, not stated 1"
  kinds: "drug 11, procedure 4, exercise 3, organisation of care 3, behavioural 3, supplement 2, device 2, nutrition 1, other 2"
  next: "the paid run of the method on the 30 links (later_run above): pass rule and price confirmed before it"
sample_size_2026_11_17:
  why: "30 links give a 95% interval of about +-0.20 on an AUC of 0.65 (Hanley-McNeil), so the rule's lower bound above 0.5 could not be met even by a real signal; about 60 links are needed for that, 100-150 for a firm conclusion"
  pack_30: "the rest of the pool: 156 reviews (216 by the same query on 2026-11-17, minus the 60 of pack 29), random order, 8 parts of 20, the same instructions (scripts/argon/pack29_reviews.py build-rest); about 105 usable links expected with pack 29"
  plan: "a mechanics run of the method on the 30 links of pack 29 first (no conclusion drawn from it), then the main run on every usable link of packs 29 and 30 with the rule written before it"

mechanics_run_2026_11_17:   # written before the run
  what: "the 30 usable links of pack 29: per link a card built by code (one outcome claim: intervention -> main outcome -> population, the comparator and the review's outcome as the claim's measure), the working search (filtered) and reader (verify_claim/v21, batches of 10) of configs/v3-flash-n10.yaml as of T, the rules of the manual (rules_v32.evaluate v36): S, F, A of the outcome link and the gate; scripts/whole_system/review_gold.py run"
  purpose: "mechanics, not a conclusion: does the search find records before T, how many links stay empty, cost per link; the AUC is computed and reported but no conclusion is drawn from 30 links"
  mechanics_ok: "at least 80% of links with one or more records before T, and no link failing on an error"
  cost: "about 0.08 USD per link by the calibration run, about 2.5 USD; cap 3.5 USD (MAX_USD)"
mechanics_run_result_2026_11_17:
  mechanics: "passed: 28 of 30 links with records before T (0.93 >= 0.80), no errors; records per link median 7 (0 to 19); 4 links filtered by the gate"
  cost: "0.24 USD by the call log (about 0.008 per link: one claim, no card parse, no alternatives), far below the 0.08 per link estimated from the calibration run; the main run on about 105 links costs about 1 USD"
  numbers_no_conclusion: "AUC of S against the label 0.656 [0.415, 0.867] on 28 links; plain count of records for minus against 0.69 [0.48, 0.88]; moderate or high certainty only 0.476 (13 links). 30 links cannot carry a conclusion (see sample_size_2026_11_17)"
  fix: "the script summed the cost from the wrong field (0 shown); corrected"

main_run_2026_11_18:
  status: "protocol fixed before scoring any new pack 30 link"
  cohort: "all usable links in packs 29 and 30 once all eight parts of pack 30 are answered and checked; no replacements"
  development: "pack 29 served as a mechanics pilot; report it with the combined cohort and show pack 30 separately as the unseen cohort"
  method: "freeze the existing one-outcome card builder, search and reader configuration, cutoff T and v3.11 scoring. Reuse a saved calculation only when its input matches the checked label and card inputs."
  primary: "AUC of S among usable links with records. Benefit is positive. No effect or harm is negative. Bootstrap 95% interval over links (2,000 replicates, seed 0); the link is the unit of analysis."
  comparison: "on the same links, report AUC of count for minus against and paired bootstrap interval for the difference (S minus count). No superiority claim if the interval includes zero."
  additional: "report pack 30 separately, high/moderate certainty, full-cohort AUC with neutral S=0.5 for empty links, coverage, errors and costs. Keep gates separate from the endpoint score S."
  interpretation: "signal when AUC >= 0.65 and lower 95% limit > 0.50; no signal if AUC < 0.55; otherwise unclear. Apply this only after every usable link is scored without error. Treat partial results as descriptive."
  execution: "first verify local labels and cards offline. Run paid in one resumable stream only with approval for the specified cohort and cost."
  budget_estimate: "43 usable links already labelled in pack 30: 0.35 USD from 0.241/30 pilot USD per link; proposed session cap 0.70 USD. The 76 unlabelled reviews have unknown eligible count. At the observed yield they would add about 41 links and about 0.33 USD, to be re-estimated after checking."
  partial_run: "if approved, cache the 43 currently eligible pack 30 links with the frozen protocol. Report this checkpoint as descriptive and apply the interpretation rule only after the full cohort."
  run_command_after_approval: "ALLOW_PAID=1 MAX_USD=0.70 python -m scripts.whole_system.review_gold run --packs 30"
  score_commands: "python -m scripts.whole_system.review_gold score --packs 29 30 --out <combined.json>; repeat with --packs 30 for the unseen cohort"

readiness_2026_11_18:
  labels: "pack 30 attachment matches four saved answer files (80 reviews), 45 included, 43 eligible (20 benefit, 21 no_effect, 2 harm); 76 reviews in parts 5-8 are still unlabelled. Together with pack 29 there are currently 73 eligible links (37 benefit, 34 no_effect, 2 harm)."
  offline_checks: "all 73 cards build, all eligible dates parse, all included reviews have a result quote previously checked against the abstract. Among the 43 new links, 3 use the comparison's studies as a proxy for outcome contributors; 27 study year discrepancies on these links were resolved using PubMed years and 1 study PMID was not found."
  scored: "30/73, all from the pilot (28 with records). AUC S 0.656 [0.415, 0.867]; count 0.690 [0.479, 0.878]; paired difference -0.034, 95% interval [-0.193, 0.106]. With empty links neutral: 0.654 [0.422, 0.853]. Moderate/high certainty: 0.476 [0.125, 0.833], 13 links with records."
  reading: "The pilot confirms mechanics and yields no evidence that the weighted score improves on the simple count. The new labels provide a larger comparison cohort, but do not provide the method's scores. Keep the pilot and trial calibration conclusions provisional."

partial_result_2026_11_18:
  coverage: "43 of 43 available pack 30 links scored without errors; 40 with records before T. Combined with pack 29: 73 scored, 68 with records. Only parts 1–4 of pack 30 are labelled."
  pack_30: {auc_S: 0.843, ci95_S: [0.702, 0.952], auc_count: 0.887, ci95_count: [0.756, 0.984], delta_S_minus_count: -0.044, ci95_delta: [-0.150, 0.039]}
  combined: {auc_S: 0.772, ci95_S: [0.651, 0.876], auc_count: 0.801, ci95_count: [0.687, 0.901], delta_S_minus_count: -0.029, ci95_delta: [-0.098, 0.036]}
  sensitivity: "with empty links given S=0.5: pack 30 AUC 0.843 [0.710, 0.952], combined 0.770 [0.656, 0.871]. For moderate or high certainty among links with records: 0.950 [0.800, 1.000], n=17, and 0.764 [0.565, 0.928], n=30, respectively."
  cost: "0.351 USD for the new links by recorded usage; 0.591 USD including the pilot."
  interpretation: "The interim AUC of S clears the numerical thresholds on the new cohort and combined. The simple count has a higher point estimate in both, with paired intervals including zero. The review target pools some pre-T studies, so this measures agreement with later pooled results, not prediction using entirely unseen outcomes. The final rule remains pending parts 5–8."

final_cohort_readiness_2026_11_19:
  status: "all labels checked; final 32 calculations approved and queued outside peak hours"
  received: "Parts 5–8 contain exactly the 76 unique assigned review PMIDs. Unmodified answers are in longevity-kg reviews/argon-2026-11-17/pack_30_{5..8}_answer.json."
  new_inclusions: "33/76 included; all 33 result quotes matched in the PubMed check. One lacks contributing studies on both sides of T, leaving 32 eligible (18 benefit, 13 no_effect, 1 harm)."
  new_exclusions: {population_not_ageing: 22, no_pooled_estimate: 14, not_intervention: 4, included_studies_not_accessible: 3}
  checks: "27 reported study years differed by more than one year and were replaced by the PubMed year under the existing rule. One new eligible link uses studies of the comparison as a proxy. All 105 cards built offline. All 73 prior saved calculations still match the checked inputs and can be reused."
  full_cohort: "Pack 30: 156 assigned and answered, 78 included, 75 usable (38 benefit, 34 no_effect, 3 harm). Packs 29–30 combined: 105 usable (55 benefit, 47 no_effect, 3 harm)."
  execution: "Run only the 32 pending pack 30 links under the same protocol and working reader used in the previous checkpoint, after approval. Score pack 30 and combined separately. Apply the previously fixed rule after completeness and error checks."
  final_budget: "USD 0.26 estimated (32 × 0.351/43), proposed session cap USD 0.55, off-peak."
  command_after_approval: "ALLOW_PAID=1 MAX_USD=0.55 python -m scripts.whole_system.review_gold run --packs 30"
  approval: "User approved the final 32 links at the stated estimate and cap. Queued 2026-11-19 for the end of the 06:00–10:00 UTC peak window. Post-run scoring writes pack 30 and combined metrics and applies the fixed interpretation only after completeness checks."

final_result_2026_11_19:
  completion: "All 105 eligible links scored, 98 with records, zero errors. Pack 30: 75 scored, 70 with records."
  combined: {auc_S: 0.793, ci95_S: [0.700, 0.874], auc_count: 0.814, ci95_count: [0.727, 0.893], ci95_S_minus_count: [-0.081, 0.033]}
  pack_30: {auc_S: 0.844, ci95_S: [0.745, 0.928], auc_count: 0.865, ci95_count: [0.778, 0.942], ci95_S_minus_count: [-0.099, 0.053]}
  sensitivity: "Combined AUC 0.784 [0.691, 0.866] with empty links at S=0.5; 0.806 [0.653, 0.936] for 42 moderate/high-certainty links with records."
  decision: "Signal by the fixed rule on all packs: AUC at least 0.65 and lower interval bound above 0.50. The weighted score does not show an advantage over the simple count. The later reviews pool some pre-T studies."
  cost: "USD 0.242 for the last 32; USD 0.833 total recorded charges."
  files: "Private review_gold_{pack30,combined}_final_score.json and review_gold_final_analysis.md."
