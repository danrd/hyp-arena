id: trend-genetics-2026-11-06
written_on: '2026-11-06'
status: computed 2026-11-06 (after this file was committed)
origin: >-
  user decision 2026-11-06 after the Eternal Search presentation "Спектр борьбы со смертью" (Open Longevity, snapshot
  2026-09-17): "мода в Longevity" (capital follows a rising interest) and human genetics as a priority filter
  (Minikel et al., Nature 2024). Network proximity (SHARP, Gross et al., Nature Aging 2026) is a separate task
  (docs/tasks/network-proximity.md), not here.
data: >-
  units with v3 results: calibration steps 1-5 (as of their dates) and the prospective pilot (as of 2026-11-06);
  no model calls; PubMed E-utilities, ClinicalTrials.gov API v2, OpenGenes (open-genes.com/api, snapshot 2026-11-06)
indicators:
  trend_pubmed: >-
    term = the card's first intervention label (parentheses removed) as a phrase in [tiab]; if the two windows have fewer
    than 5 hits together, the content words (4+ letters, no stop words) joined by AND in [tiab]; fewer than 5 again ->
    unknown. Windows by publication date: A = [T-3y, T), B = [T-6y, T-3y). trend = ln((a+1)/(b+1)) - ln(N_A/N_B), N =
    all PubMed records in the window (growth of the field removed). Higher = rising interest.
  trend_trials: >-
    the same term in ClinicalTrials.gov interventions (query.intr), trials by start date in A and B;
    ln((a+1)/(b+1)); unknown when a+b < 3. Secondary.
  genetic_support: >-
    targets = genes of the ChEMBL mechanism targets of the card's compounds (gene symbols among the target names) plus
    claim subjects / objects that are gene symbols or OpenGenes aliases; level: none (targets found, none in OpenGenes) <
    aging_gene (in OpenGenes, no human association) < human_genetic (OpenGenes cause "Association of genetic variants and
    gene expression levels with longevity" or "Association of the gene with accelerated aging in humans"); unknown when no
    target gene is found (programmes, devices). Snapshot 2026-11-06: for the retrospective units it may contain later
    findings (stated limitation; for the prospective pool it is as of T).
conditions:
  reliability: computed by code from public data (condition 1 by construction); reported - share of units with a value
  separation: trend - at least 3 distinct values and no value above 70%; genetic_support - at least 2 levels with 20%+ among known
  non_redundancy: |Spearman| < 0.7 with P (v3.2 fold), I, scope, feasibility, momentum, endpoint_clinical where known
  own_question: >-
    trend - is the direction gaining attention (investor profile; not plausibility); genetic_support - does human genetics
    back the intervention's target (evidence profile, lowest tier). Outcome AUC for orientation only, not decisive.
decision: >-
  passing indicators enter ASPID: trend_pubmed in a draft "investor" profile (trial-1), genetic_support in the lowest tier
  of evidence; both before the pilot scores are frozen
code_changes_before_results:
- partial dates of T (YYYY-MM, YYYY) read as the first day
- trend_trials: labels longer than 6 words and queries CT.gov answers with 400 are unknown (a long descriptive label of a
  programme gave HTTP 400); seen before any value was computed
- genetic_support: claim entities matched on OpenGenes official symbols only, ChEMBL target names only where the name
  is the official symbol (an alias "NAD" matched a gene and "DMD" a medical food); found on the first computed output,
  changes 1 of 7 values
result:
  units: 111 (calibration 23, fresh 40, prospective 48 done at the time)
  trend_pubmed: {known: 80, share_known: 0.72, distinct: 78, top_share: 0.05, median: 0.20,
                 spearman_max_abs: 0.19 (momentum), with_P: 0.12, with_I: 0.0, with_endpoint: 0.15,
                 orientation_auc: '0.563 (19 / 26)'}
  trend_trials: {known: 74, share_known: 0.67, spearman_with_trend_pubmed: 0.19, orientation_auc: '0.514 (17 / 25)'}
  genetic_support: {known: 7, share_known: 0.06, levels: {none: 4, aging_gene: 2, human_genetic: 1}}
  verdict:
    trend_pubmed: admitted; draft investor profile (configs/profiles_v3.yaml, draft-1). Limitation - for programmes the
      fallback query is the label's content words, which measures attention to a generic topic ("multicomponent AND
      structured AND physical")
    trend_trials: not admitted (secondary; less coverage, nearly unrelated to the PubMed trend, nothing it adds to it)
    genetic_support: not admitted - non-redundancy cannot be measured on 7 known values; registry trials are mostly
      programmes without a target gene. Kept in code for compound hypotheses (KG, DrugAge), where coverage is high
