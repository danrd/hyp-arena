id: design-rule-2026-11-16
written_on: 2026-11-16
status: the kinds, the verdict rule and the pass rule fixed before the independent check (pack 6) was scored
why: >-
  On the alternatives benchmark (pack 22) the proposer covers 0.34 of the outside reader's methodological alternatives (a
  plain LLM 0.63) and the design verdict agrees with the outside reader at a weighted kappa of about 0.1. A methodological
  alternative (regression to the mean, practice on the test, expectation, the assessor's knowledge of the arm, unequal
  contact, selection and attrition, co-interventions, multiplicity) is not weighed by a literature search in any
  risk-of-bias tool (Cochrane RoB 2, ROBINS-I): it is judged from the design. The registry's structured design fields
  (allocation, who is masked, the type of each arm) are already parsed by code.
cost: free (saved cards and packs; ClinicalTrials.gov design fields of the 59 prospective trials fetched once)
kinds:      # by words of the alternative's statement, the first that matches (scripts/alternatives/design_rule.py KINDS)
  practice: practice, familiarisation, learning on the test, repeated testing
  regression: regression to the mean, natural course, spontaneous change, time trend
  assessor: the observer, assessor or rater knows the arm; measurement bias
  expectation: expectation, placebo response, unblinded participants, self-report, effort
  attention: contact, attention, supervision, Hawthorne
  selection: selection, attrition, dropout, completers, baseline differences
  cointervention: adherence, compliance, co-interventions, carry-over, the vehicle
  multiplicity: multiple comparisons or endpoints, false-positive rate, non-independent observations
verdict_rule:   # what the stated design does to the alternative if the expected result is seen; under a null result always "unchanged"
  practice: "randomised with a concurrent control: eliminated; a concurrent control without randomisation: weakened; one group: unchanged"
  regression: as practice
  assessor: "the outcomes assessor is masked: eliminated; otherwise unchanged"
  expectation: "the participant is masked and the control is a placebo or a sham: eliminated; the participant is masked or the control is a sham, not both: weakened; otherwise unchanged"
  attention: "a placebo or sham control: eliminated (the arms get the same contact); an active comparator: weakened; usual care, no intervention, waiting list: unchanged"
  selection: "randomised: weakened; otherwise unchanged"
  cointervention: "randomised: weakened; otherwise unchanged"
  multiplicity: unchanged
derivation: >-
  the rule follows the risk-of-bias logic and was written after reading the 38 methodological alternatives of pack 22 with
  the outside reader's verdicts next to the design fields of their trials, the 10 holdout trials included. Its agreement on
  pack 22 is therefore in-sample and is reported, not judged
independent_check: >-
  Argon pack 6 (2026-11-08): the outside reader's verdict (d under the expected result) for the 293 alternatives our
  proposer wrote for the 59 prospective trials. Not read while the rule was written. Each alternative is classed by the
  kind words above from its own text; the methodological ones get the code verdict from the trial's registry design fields
measures:
  agreement: linear-weighted Cohen kappa (eliminated > weakened > unchanged) and exact agreement, code verdict against the outside reader, on the alternatives a kind matches
  against_the_judge: the same for the model's verdict saved in the key of pack 6 (on_positive), on the same alternatives
  coverage_pack_22: share of the outside reader's methodological alternatives of rank 1 to 3 whose kind is one of the eight (a fixed checklist would list them all), against 0.34 for the proposer
  by_kind: agreement per kind, with counts
rule:
  the_design_rule_replaces_the_model_verdict_for_methodological_alternatives_when: >-
    on pack 6 at least 40 alternatives are classed, the weighted kappa of the code verdict is at least 0.4 and higher than
    the model's on the same alternatives by at least 0.1
  if_it_passes: >-
    the change is a change of the method (how I is computed for methodological alternatives, and whether they keep their
    literature search): it goes to the user with the numbers, then through the manual; nothing changes before that
  if_not: the kinds and their numbers are reported; the rule is not adopted
script: scripts/alternatives/design_rule.py -> longevity-kg reviews/argon-2026-11-14/design_rule.json

result_2026_11_16:
  pack_22_in_sample:
    kinds: "36 of the 38 methodological alternatives fall into one of the eight kinds; of those of rank 1 to 3, 0.97 (the proposer covered 0.34)"
    code_verdict: "weighted kappa 0.50, exact 0.66 on 35 (holdout 12: 0.60 and 0.67); the proposer's verdict on this pack: about 0.1"
  pack_6_independent:
    classed: "124 of 293 alternatives (practice 25, regression 28, attention 36, expectation 13, co-intervention 13, selection 9); the other 169 are not methodological by the words"
    code_verdict: "weighted kappa 0.447, exact 0.565"
    model_verdict_on_the_same: "weighted kappa 0.143, exact 0.363 (the verdict saved with the run of 2026-11-06; it never says eliminated)"
    by_kind:      # exact agreement, code / model
      practice: [0.76, 0.16]
      regression: [0.75, 0.32]
      attention: [0.53, 0.58]
      expectation: [0.38, 0.15]
      selection: [0.33, 0.22]
      cointervention: [0.23, 0.54]
  by_the_rule: "passes: 124 classed, weighted kappa 0.447 (at least 0.4), higher than the model's 0.143 by 0.30"
  reading: >-
    the gain is practice and regression to the mean: a randomised concurrent control rules them out, the outside reader
    agrees in three cases of four and the model said "weakened" or "unchanged". Attention is on par with the model;
    co-interventions and selection are weak (the outside reader often calls them ruled out by randomisation, the rule says
    weakened). The comparison is with the verdict of the run of 2026-11-06, not with the later judge
    (judge_alternatives/v2, kappa 0.35 on another sample)
  open_for_the_user: >-
    (1) a fixed checklist of the eight kinds for every trial in place of proposing methodological alternatives; (2) their
    verdict by this rule; (3) their support: now from a literature search, which a design judgement does not need: what
    a checklist item weighs in I without records is a new rule; (4) the kinds co-intervention and selection as "ruled out
    by randomisation" or as now

universal_rule:
  written_on: 2026-11-16
  status: definitions fixed before Argon pack 28 was sent
  why: >-
    a hypothesis need not come from a registry and need not state a design. The verdict must rest on the hypothesis's own
    text: the stated experiment of the card (design, control, system, n; filled by the normaliser from any text, with the
    verbatim phrase). On the 124 alternatives of pack 6 the verdict from these card fields alone agrees with the outside
    reader at a weighted kappa of 0.57 (exact 0.65), against 0.45 from the registry's structured fields: the registry is
    one kind of text the block is filled from, not a requirement
  principle:
    source: the card's stated experiment; a feature the text does not state is unknown
    unknown: "an unknown feature gives the verdict unchanged and an improvement item naming the feature that would rule the threat out"
    no_experiment: "informativeness is not computed; the threats of the hypothesis's system are listed as what an experiment must contain"
    by_system: >-
      the threats depend on the system of the experiment. Humans: the eight kinds above (RoB 2, ROBINS-I). Animals:
      allocation (cage, litter, batch), assessor, attrition, handling and vehicle, housing, one sex / strain / age,
      multiplicity (SYRCLE). Cells: batch (passage, clone, donor), off-target of the tool, vehicle, culture artefact, line
      identity, multiplicity. Data analysis: confounding, reverse causation, selection, measurement, multiplicity
  not_yet: >-
    the card has no fields for blinding, for how animals are allocated, for replication or for a specificity control; the
    lists for animals and cells and their verdict rules have no gold. Pack 28 gives both: which features the outside
    reader's verdicts rest on, and the threats it raises per system
  pack: Argon pack 28 (longevity-kg reviews/argon-2026-11-16/pack_28_task.json; builder scripts/argon/pack28_alternatives.py)
  sample: the 30 hypotheses of pack 26 (13 Bio Arena, 13 chat-written, 4 evolved versions of registry trials), T 2026-10-14
  asked: >-
    per hypothesis: whether an experiment is stated, its system, six design features with the phrase that states each; up
    to 5 alternatives with kind, threat (from the list of its system), the verdict under the expected and the null result,
    the feature and the phrase the verdict rests on, the one addition that would rule it out; up to 3 papers for the
    substantive alternatives of rank 1-2
  measures:
    lists: share of the outside reader's methodological alternatives whose threat is one of the list of its system ("other" is a miss), per system
    features: which design features the verdicts rest on, by system and threat; share of hypotheses that state each feature
    card_fields: agreement of the card's experiment fields (design, control, system) with the features the outside reader extracts
    verdict: weighted kappa of a code verdict from the features the outside reader extracted (the upper bound of a rule) and from the card's fields (what we have), per system
  rule:
    lists_usable_when: at most 0.2 of the methodological alternatives are "other", in every system with at least 10 of them
    fields_to_add: a design feature becomes a field of the card's experiment when at least 0.2 of the verdicts of a system rest on it
    verdict_rule_adopted_when: >-
      the code verdict from the card's fields reaches a weighted kappa of 0.4 on the methodological alternatives of the
      pack; per system it is reported with its count and decides nothing under 30 alternatives
    then: the change goes to the user with the numbers and through the manual (how I is computed, whether a checklist item needs a literature search, what it weighs)
  verdict_rule_by_system_written_2026_11_16: >-
    the code verdict per threat (scripts/alternatives/pack28_score.py, verdict) was written after the answer arrived and
    after its counts were seen (threats per system, verdicts per feature), before any agreement was computed: practice and
    regression ruled out by a randomised concurrent control; assessor by blinding; expectation by blinding with a control;
    selection, co-interventions and allocation weakened by randomisation; handling and vehicle ruled out by a concurrent
    control; off-target by a specificity control; batch weakened by replication; the rest unchanged
  result_2026_11_16:
    answer: "30 hypotheses (cells 15, mixed 8, humans 5, animals 2; an experiment stated in 29), 62 methodological and 60 substantive alternatives; the 70 PMIDs of the literature exist and are before T"
    lists: "no threat outside the list of its system and none named other: the lists are usable"
    features_stated: "readout 30, a concurrent control 29, a specificity control 26, allocation 14, replication 11, blinding 9 of 30"
    verdicts_rest_on: "cells: no feature 0.60, a specificity control 0.20, the control 0.10; mixed: the readout 0.31, the control 0.25, a specificity control 0.19; humans: none 0.50, the control 0.33, blinding 0.08"
    card_against_argon: "the card's system agrees in 19 of 30 (mixed experiments are one system on the card); the card names a control in 20 of the 29 where the text states one"
    verdict:      # weighted kappa, exact, on the 62 methodological alternatives
      from_argon_features: [0.362, 0.581]
      from_card: [0.307, 0.597]
      always_unchanged: [0.0, 0.565]
      by_system_from_card: {humans: [0.455, 0.667, 12], mixed: [0.424, 0.562, 16], cells: [0.07, 0.567, 30], animals: [0.0, 0.75, 4]}
    by_the_rule:
      lists_usable: "yes (no other in any system)"
      fields_to_add: "a specificity control (a second tool, a rescue, a dose-response): 0.20 of the cell verdicts and 0.19 of the mixed rest on it; the readout and the control are on the card already"
      verdict_rule_adopted: "no: 0.31 from the card's fields < 0.4 (0.36 even from the features the outside reader extracted)"
    reading: >-
      for humans the rule from the card works as on the registry trials (0.46 here, 0.57 on pack 6); for cells it does
      not: there the verdict depends on what the stated control is (a matched vehicle or not, an independent donor or a
      passage), which a yes/no feature does not carry. The threat lists are usable as a fixed checklist for every system;
      the verdict by code only for experiments in humans, elsewhere "does not tell apart" by default with the improvement
      item naming what would rule the threat out (the outside reader gave it for every alternative)

correction_2026_11_16: >-
  registry_design read "non randomized" (NON_RANDOMIZED as the text builder writes it) as randomised; 5 of the 60 prospective
  trials changed allocation. Recounted on pack 6 with the fix: code verdict weighted kappa 0.451, exact 0.573 (was 0.447,
  0.565); the model's verdict unchanged (0.143). The rule still passes
