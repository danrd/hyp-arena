# verify_claim/v8 on fresh pairs, fixed before the first call (user decision 2026-11-04: fix relevance for same-class
# interventions, test the fix on pairs not looked at before, then the paid v3 calibration check).
id: extraction-gold-v8
date: 2026-11-04
question: "With the same-class rule, does the verifier keep relevant papers (relevance >= 0.8) without losing the extraction quality of v7, on pairs it was not tuned on?"
code: "scripts/extraction_gold_v3.py --gold v8 (pairs: per calibration unit of steps 2-3, SHA-1 order, one paper the v2 verifier recorded something for and one it did not; papers of the 45 earlier pairs left out)"
prompt: "verify_claim/v8 = v7 + one rule: a finding for an intervention of the same kind on the claim's outcome, or in another population, is supports or refutes with intervention_match class or related_compound, never neither (examples in the rule are generic, written from the v3b misses before labelling these pairs)"
config: configs/v3-flash.yaml
gold: "longevity-kg extraction_gold/labels_v8.jsonl: 29 pairs (task_v8.jsonl) labelled by hand 2026-11-04 by the rules of the README (relevance rule of gold v3); 18 relevant, 11 not; 6 borderline relevance calls noted (4 reviews, oxidative markers, fat-free milk review)"
measures: "as extraction-gold-v3b: relevance on all 29 pairs; design, comparison, n_total, effect_class on the 18 relevant pairs; a missing record is wrong on every field"
thresholds: {relevance: 0.8, design: 0.8, comparison: 0.8, n_total: 0.8, effect_class: 0.6}
constant_baselines: {relevance: 0.62, design: 0.44, comparison: 0.56, n_total: 0.39, effect_class: 0.72}
reading:
  passed: "every measure at or above its threshold and above its baseline (relevance at least 24 of 29; design, comparison, n_total at least 15 of 18; effect_class at least 14 of 18)"
  not_passed: "per-measure review with the user before the paid v3 calibration check"
code_change_before_the_run: "effect_class.py reads spelled-out percent ('12 percent', '113 +/- 8 percent') and 'by about 40%' as relative changes; a bare percent without a sign or change word stays unclear; gold v3 classes unchanged by it"
calls: "29 (v8 only; v5 on the same pairs for comparison is 29 more, about 0.06 USD, on request)"
cost_estimate_usd: "about 0.07"
caveat: "one labeller (Claude), who also wrote the rule; 18 relevant pairs, so one pair moves a field by 0.06"
