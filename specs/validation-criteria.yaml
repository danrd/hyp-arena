# Критерии «пройдено» для проверок системы (три уровня). Записано 2026-10-26.
#
# declared: before_run     — критерий записан до прогона, статус честно сравнивается с ним;
#           after_result   — критерий записан ПОСЛЕ того, как результат был известен: статус информативен, не подтверждающий;
#           pending        — пороги предложены, ждут одобрения; после одобрения и коммита становятся before_run для непроведённых тестов.
# status:   pass | fail | inconclusive | not_run | blocked | not_applied
#           inconclusive — измерено, но критерий не выполнен и не опровергнут (интервал включает порог или выборка мала);
#           blocked      — нельзя запустить, причина в `blocker`.
# Пороги предложены автором сводки и не калибровались; меняются только до прогона и только коммитом.

version: 1
declared_on: "2026-10-26"

levels:
  1: "Внутренняя валидность отбора (система сама по себе)"
  2: "Валидность относительно Co-Scientist"
  3: "Способность определять рабочие гипотезы"

tests:
  # ---------------- уровень 1 ----------------
  - id: L1.1
    level: 1
    name: Инварианты и регрессия кода (весь набор pytest)
    cls: "[0]"
    criterion: "все тесты проходят при PYTHONHASHSEED 0, 1, 2; снимок ITP совпадает со списком изменений"
    declared: before_run
    status: pass
    evidence: "tests/; tests/test_snapshot.py; docs/rules-method.md (Золотой снимок и защита по дате)"
    note: "CI пока нет (задача у Jules); проверка запускалась вручную. Проверяет код, не качество отбора."

  - id: L1.2
    level: 1
    name: Независимость рейтинга от пула, копий, порядка подачи, зерна (C1–C4)
    cls: "[0]"
    criterion: "копии не меняют P(топ-k) остальных; доминируемая гипотеза не меняет остальных в пределах ошибки Монте-Карло; порядок и зерно меняют только в пределах ошибки"
    declared: before_run
    status: pass
    evidence: "tests/test_aspid_pool_invariance.py; tests/test_aspid_properties.py"

  - id: L1.3
    level: 1
    name: Сверка АСПИД с точным интегралом и правило «на равных» (C5)
    cls: "[0]"
    criterion: "ожидание в пределах 4 стандартных ошибок Монте-Карло, вероятности в пределах 4 биномиальных ошибок; одинаковые гипотезы всегда в одной группе"
    declared: before_run
    status: pass
    evidence: "tests/test_aspid_exact.py"

  - id: L1.4
    level: 1
    name: Калибровка АСПИД на симуляции
    cls: "[0]"
    criterion: "ECE < 0.05 и отклонение любой группы свыше 100 случаев < 0.08; отрицательный контроль обязан провалиться"
    declared: before_run
    status: pass
    evidence: "tests/test_aspid_calibration.py"
    note: "Истинные веса берутся из того же распределения: проверяет корректность сэмплера и конвейера, а не предсказательную силу."

  - id: L1.5
    level: 1
    name: Дисциплина дат (D1, D2)
    cls: "[0]/[K]"
    criterion: "аудит `backtest audit --final`: ноль записей позже T и ноль недатированных в финальном прогоне"
    declared: before_run
    status: pass
    evidence: "docs/rules-method.md (Золотой снимок и защита по дате); tests/test_card_pipeline.py"
    note: "Пройден на замороженных прогонах ITP. К финальному прогону на чистой выборке ещё не применялся."

  - id: L1.6
    level: 1
    name: Спецификация до данных (A4)
    cls: "[0]"
    criterion: "коммит спецификации старше метки прогона; хэш в мете совпадает с хэшем по коммиту"
    declared: before_run
    status: not_applied
    evidence: "hyparena/prespec.py; tests/test_prespec.py; specs/"
    note: "Механизм проходит тесты; ни один реальный прогон ещё не шёл со --spec (все проведённые прогоны до механизма)."

  - id: L1.7
    level: 1
    name: Зависимость проверяющей модели от названия соединения (парная проверка)
    cls: "[$]"
    criterion: "слепая рука против оригинала: совпадение stance и effect на общих записях не ниже, чем у повтора (шум), минус 0.05; совпадение набора статей не ниже шума минус 0.10"
    declared: after_result
    status: pass
    evidence: "docs/rules-method.md (Парная проверка…); scripts/blind_check.py"
    note: "Критерий записан после результата. Проходит у границы по набору статей (разница 0.09 при допуске 0.10); 64 вызова, мощность низкая; проверена одна модель. «Не обнаружено» не равно «нет»."

  - id: L1.8
    level: 1
    name: Инвариантность к перефразированию (B2)
    cls: "[$] малый"
    criterion: "нормализованные поля (контекст, субъект, отношение, объект) совпадают с ручной карточкой не менее чем по 90% граней для 15 перефразирований; статус и место в рейтинге не меняются"
    declared: pending
    status: not_run
    blocker: "нужны 10 перефразирований другой моделью и 5 ручных от вас; ОК на платную часть"

  - id: L1.9
    level: 1
    name: Инвариантность к стилю (B3)
    cls: "[$]"
    criterion: "тау-b между местами одной гипотезы в трёх стилях не ниже 0.9 для нашего метода; для базовых систем сдвиг сообщается рядом"
    declared: pending
    status: not_run
    blocker: "нужен бэйзлайн Elo на этих гипотезах; платно"

  - id: L1.10
    level: 1
    name: Согласие проверяющих моделей разных семейств (E3)
    cls: "[$]"
    criterion: "каппа Коэна по статусу основного утверждения не ниже 0.6; расхождения перечислены с причинами"
    declared: pending
    status: not_run
    blocker: "платно, около 10 вызовов на гипотезу на семейство"

  - id: L1.11
    level: 1
    name: Несёт ли каждая ось сигнал (D15)
    cls: "[K]"
    criterion: "для каждой оси нижняя граница ДИ для AUC выше 0.5 на выборке, не использованной для правок; иначе ось — кандидат на удаление"
    declared: pending
    status: blocked
    blocker: "правила на ITP заморожены, подгонять нельзя; нужна независимая выборка (L3.2)"

  - id: L1.12
    level: 1
    name: Диагностика пула предупреждает о слабо различимых пулах
    cls: "[0]"
    criterion: "предупреждение при менее чем трёх меняющихся показателях, при доле упорядоченных пар ниже 0.5 или при одном показателе, создающем не менее 0.8 пар"
    declared: before_run
    status: pass
    evidence: "hyparena/diagnostics.py; tests/test_diagnostics.py"
    note: "Пороги по умолчанию, не калибровались."

  # ---------------- уровень 2 ----------------
  - id: L2.1
