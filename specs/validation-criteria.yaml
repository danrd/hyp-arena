# Критерии «пройдено» для проверок системы (три уровня). Версия 12, 2026-10-30.
#
# Поля проверки:
#   kind        code  — проверка кода/метода (корректность реализации, инварианты);
#               claim — проверка утверждения об отборе (система выбирает хорошо / лучше / находит рабочие гипотезы).
#   criterion   что считается «пройдено».
#   can_fail    может ли проверка провалиться и при каком исходе (честная оценка: если почти не может, так и сказано).
#   declared    before_run   — критерий зафиксирован коммитом до прогона;
#               after_result — критерий записан ПОСЛЕ результата: статус информативен, не подтверждающий;
#               pending      — ждёт подтверждения.
#   status      pass | formal | fail | inconclusive | uninformative | not_run | blocked | not_applied
#               formal        — критерий выполнен формально (почти не мог провалиться), содержательного вывода нет;
#               inconclusive  — измерено, критерий не выполнен, но и не опровергнут;
#               uninformative — мало единиц (см. min_units), результат ничего не говорит независимо от значения;
#               blocked       — запуск невозможен, причина в `blocker`.
#   measured_on  на каком наборе показателей измерено: префикс хэша (8 знаков) — набор на момент измерения; older — прежний набор (результат устарел);
#               frozen — эталон, заморожен намеренно. Если префикс не совпадает с текущим набором, таблица помечает результат «УСТАРЕЛО»;
#   min_units   минимальный объём, ниже которого результат «неинформативен» (scored — оцениваемые единицы с метками, positives — положительные).
#   multiplicity  поправка на множественность для вторичных проверок.
# Пороги предложены автором сводки и не калибровались; меняются только до прогона и только коммитом.

version: 12
declared_on: "2026-10-28"

levels:
  1: "Внутренняя валидность отбора (система сама по себе)"
  2: "Валидность относительно Co-Scientist"
  3: "Способность определять рабочие гипотезы"

# Правило интерпретации (Working_Notes A1): судья Co-Scientist использует память о исходах напрямую, поэтому на историческом пуле
# (модели могут помнить исходы) победа нашей системы консервативна, а ничья и поражение неинформативны. Это не относится к пулу,
# где все используемые модели имеют отсечку не позже T и исходы опубликованы после отсечки.

power:
  note: "Минимальный обнаружимый AUC при мощности 80% (односторонний α = 0.05, критерий Манна—Уитни, бинормальная модель, симуляция)"
  designs:
    - {positives: 8,  negatives: 22, mde_auc: 0.78, power_at_auc_0_70: 0.51}
    - {positives: 10, negatives: 30, mde_auc: 0.75, power_at_auc_0_70: 0.60}
    - {positives: 15, negatives: 45, mde_auc: 0.71, power_at_auc_0_70: 0.76}
    - {positives: 20, negatives: 60, mde_auc: 0.68, power_at_auc_0_70: 0.87}
  rule: "Основной тест (L3.3) рассчитан на AUC ≥ 0.80 с мощностью 80%: для этого нужно не менее 8 положительных и 22 отрицательных (30 единиц). Меньше 30 оцениваемых единиц или меньше 8 положительных → «неинформативно» независимо от значения. AUC от 0.5 до 0.78 при p ≥ 0.05 — «не доказано», а не «провал»."

multiplicity:
  family: [L3.4, L3.5]
  method: "e-BH при α = 0.05: p перестановки → e-значение калибратором e = 0.5·p^(−0.5) (hyparena/tools/multitest.py: p_to_e, e_bh); допустима произвольная зависимость между проверками"
  primary: "L3.3 проверяется отдельно при α = 0.05 и в семейство не входит"

# Политика чистоты (вариант А для основного теста). ЖДЁТ ПОДТВЕРЖДЕНИЯ после ответа по реализуемости.
clean_policy:
  confirmed: false
  main_test: "А: модели с отсечкой не позже T; пул `data/backtest/outcomes_2024-12-31.json` пересобирается с `--clean-after` = максимальная отсечка используемых моделей"
  separate: "В: текущие модели (отсечка позже T) на том же пуле, результат только с пометкой «исторический набор», в главное число не входит"
  background: "Б: накопление тестов, опубликованных после отсечки проверяющей модели; фоном"
  feasibility_of_A:
    checked_on: "2026-10-27"
    candidates:
      - {model: "gpt-5-mini", stated_cutoff: "2024-05-31", source: "https://developers.openai.com/api/docs/models/gpt-5-mini", note: "на странице статус Deprecated; снимок gpt-5-mini-2025-08-07"}
      - {model: "gpt-5-nano", stated_cutoff: "2024-05-31", source: "https://developers.openai.com/api/docs/models/gpt-5-nano", note: "на странице статус Deprecated"}
      - {model: "gpt-5",      stated_cutoff: "2024-09-30", source: "https://developers.openai.com/api/docs/models/gpt-5", note: "о статусе страница не сообщает"}
    available_in_cometapi_catalog: true
    needs_before_a_run:
      - "записать заявленные отсечки в configs/model_cutoffs.yaml (поле `cutoff`, код читает его первым) отдельным коммитом"
      - "карточки пула строить кодом по шаблону (как в scripts/drugage_pool.py), чтобы нормализатор-модель не требовалась; иначе нормализатор тоже должен быть допущенной моделью"
      - "проверка качества кандидата в роли проверяющего: критерий приёмки L1.13 выполнен для gpt-5 2026-10-27 (мини-выборка 8, затем 64 вызова): не допущен, формально «неинформативно» (58 общих записей из требуемых 60), по существу пороги не достигнуты"
      - "пересобрать пул с --clean-after по максимальной отсечке"
    risks:
      - "модели помечены устаревшими: их могут снять; снимок и дату запуска записать"
      - "модели с рассуждением: скрытые токены рассуждения; параметры задать в конфиге и проверить на мини-выборке"
      - "результаты ITP иногда докладывают на конференциях до статьи (Data_Sources 9.4): остаточная утечка возможна и при отсечке до T"
      - "качество этих моделей как проверяющих в нашем конвейере не измерено; код сам задаёт stance по извлечённому направлению (verify_claim/v4), что смягчает слабость модели"

tests:
  # ---------------- уровень 1 ----------------
  - id: L1.1
    level: 1
    kind: code
    name: Инварианты и регрессия кода (весь набор pytest)
    cls: "[0]"
    criterion: "все тесты проходят при PYTHONHASHSEED 0, 1, 2; снимок ITP совпадает со списком изменений"
    can_fail: "Да: любой упавший тест или расхождение снимка. Но проверяет код, не качество отбора."
    declared: before_run
    status: pass
    evidence: "tests/; tests/test_snapshot.py; docs/rules-method.md (Золотой снимок и защита по дате)"
    note: "CI пока нет (задача у Jules); проверено вручную под тремя значениями PYTHONHASHSEED. Повторено 2026-10-27 на текущем коде: 347 тестов проходят при PYTHONHASHSEED 0, 1, 2."

  - id: L1.2
    level: 1
    kind: code
    name: Независимость рейтинга от пула, копий, порядка подачи, зерна (C1–C4)
    cls: "[0]"
    criterion: "копии не меняют P(топ-k) остальных; доминируемая гипотеза не меняет остальных в пределах ошибки Монте-Карло; порядок и зерно меняют только в пределах ошибки"
    can_fail: "Да: нарушение инварианта за пределами ошибки Монте-Карло (противоположный пример — добавление доминирующей гипотезы — обязан менять результат)."
    declared: before_run
    status: pass
    evidence: "tests/test_aspid_pool_invariance.py; tests/test_aspid_properties.py"

  - id: L1.3
    level: 1
    kind: code
    name: Сверка АСПИД с точным интегралом и правило «на равных» (C5)
    cls: "[0]"
    criterion: "ожидание в пределах 4 стандартных ошибок Монте-Карло, вероятности в пределах 4 биномиальных ошибок; одинаковые гипотезы всегда в одной группе"
    can_fail: "Да: отклонение за 4 стандартные ошибки; отрицательный контроль доказывает, что сверка не пуста."
    declared: before_run
    status: pass
    evidence: "tests/test_aspid_exact.py"

  - id: L1.4
    level: 1
    kind: code
    name: Калибровка АСПИД на симуляции
    cls: "[0]"
    criterion: "ECE < 0.05 и отклонение любой группы свыше 100 случаев < 0.08; отрицательный контроль обязан провалиться"
    can_fail: "Только при ошибке реализации: истинные веса берутся из того же распределения, что и в оценке (проверяет сэмплер и конвейер, не предсказательную силу). Отрицательный контроль (чужое распределение) обязан провалиться."
    declared: before_run
    status: pass
    evidence: "tests/test_aspid_calibration.py"

  - id: L1.5
    level: 1
    kind: code
    name: Дисциплина дат (D1, D2)
    cls: "[0]/[K]"
    criterion: "аудит `backtest audit --final`: ноль записей позже T и ноль недатированных в финальном прогоне"
    can_fail: "Да: любая запись позже T или недатированная запись в финальном прогоне."
    declared: before_run
    status: pass
    evidence: "docs/rules-method.md (Золотой снимок и защита по дате); tests/test_card_pipeline.py"
    note: "Пройден на замороженных прогонах ITP; повторен 2026-10-27 на четырёх сохранённых прогонах (эталон и разведочные, обе половины): ok. К финальному прогону на чистой выборке ещё не применялся."

  - id: L1.6
    level: 1
    kind: code
    name: Спецификация до данных (A4)
    cls: "[0]"
    criterion: "коммит спецификации старше метки прогона; хэш в мете совпадает с хэшем по коммиту"
    can_fail: "Да: коммит позже метки или несовпадение хэша. Не доказывает, что спецификацию не писали, видя данные где-то ещё."
    declared: before_run
    status: pass
    evidence: "hyparena/prespec.py; tests/test_prespec.py; specs/clean-2024-12-31.yaml; docs/rules-method.md (L3.3 и L3.9 на чистой выборке)"
    note: "Первый реальный прогон со --spec (L3.3, 2026-10-29): спецификация в коммите 1e2cd94 (15:43:50 UTC), метка прогона 15:43:58 UTC, хэш совпал, prespec.verify без замечаний."

  - id: L1.12
    level: 1
    kind: code
    name: Диагностика пула предупреждает о слабо различимых пулах
    cls: "[0]"
    criterion: "предупреждение при менее чем трёх меняющихся показателях, при доле упорядоченных пар ниже 0.5 или при одном показателе, создающем не менее 0.8 пар"
    can_fail: "Да: пул без различий не вызвал предупреждения. Пороги по умолчанию, не калибровались."
    declared: before_run
    status: pass
    evidence: "hyparena/diagnostics.py; tests/test_diagnostics.py"

  - id: L1.7
    level: 1
    kind: claim
    name: Зависимость проверяющей модели от названия соединения (парная проверка)
    cls: "[$]"
    criterion: "слепая рука против оригинала: совпадение stance и effect на общих записях не ниже, чем у повтора (шум), минус 0.05; совпадение набора статей не ниже шума минус 0.10"
    can_fail: "Да, если слепая рука отстаёт от шума больше допусков. Но мощность низкая: при 64 вызовах зависимость в пределах допуска не заметить; «не обнаружено» не равно «нет»."
    declared: after_result
    status: pass
    evidence: "docs/rules-method.md (Парная проверка…); scripts/blind_check.py"
    note: "Критерий записан после результата. Проходит у границы по набору статей (разница 0.09 при допуске 0.10); проверена одна модель."

  - id: L1.8
    level: 1
    kind: claim
    name: Инвариантность к перефразированию (B2)
    cls: "[$] малый"
    criterion: "для каждой грани карточки (контекст, субъект, отношение, объект) согласие перефразирования с оригиналом не ниже согласия между двумя повторами нормализации оригинала минус 0.05; доля неизменённых статусов и мест не ниже той же доли между повторами минус 0.05; 15 перефразирований (10 другой моделью, 5 ручных)"
    can_fail: "Да: если перефразирование расходится с оригиналом больше, чем два повтора между собой. Порог привязан к шуму, а не к абсолютной цифре."
    declared: before_run
    status: fail
    procedure: "Уточнено 2026-10-27 до первого вызова. Выборка: 15 ранжированных режимов ITP 2010 с разными соединениями, отбор по хэшу текста (scripts/paraphrase_check.py select, data/validation/l1_8_texts.json); первые 10 перефразирует другая модель (семейство deepseek, не нормализатор; промпт в скрипте), последние 5 перефразированы вручную (по решению пользователя 2026-10-27 вручную пишет Claude, а не пользователь; перефразирования одним предложением, без дублирующего «Hypothesis:»). Если модель изменила факт (вещество, доза, возраст старта, линия, пол, конечная точка, направление), перефразирование пересоздаётся один раз и это записывается; иначе перефразирования не правятся. Три полных прогона конвейера по 15 текстов на дату T = 2010-12-31 (config v2-flash, проверяющий deepseek, дедупликация выключена): O1 и O2 (оригиналы, нормализация и проверка заново) и P (перефразирования). Грани основного утверждения: субъект, отношение, объект, контекст (вид, линия, пол, доза, возраст старта, мера из qualifiers), сравниваются по нормализованным строкам; статус основного утверждения и исход должны совпасть; место совпало, если диапазоны мест профиля evidence_first перекрываются (правило «на равных»). Для каждой меры P против O1 не ниже O2 против O1 минус 0.05; пройдено, если выполнены все шесть мер (четыре грани, статус, место). Оценка: порядка 160 вызовов (около 3.3 вызова на текст в прежних прогонах ITP), несколько центов"
    result: "Выполнено 2026-10-27 по записанной процедуре (три прогона по 15 текстов, 44 + 47 + 45 вызовов, пороги не менялись). Совпадение P с O1 / повтор O2 с O1: субъект 1.00 / 1.00, отношение 1.00 / 1.00, объект 1.00 / 1.00, статус и исход 1.00 / 1.00, место 0.73 / 0.73 — все в пределах допуска. Контекст 0.33 / 1.00: не пройдено (мера «контекст» провалена, значит проверка в целом не пройдена по правилу «все шесть мер»)."
    note: "Причина провала разобрана после результата, на статус не влияет: контекст сравнивался по строкам, и расхождения только в формулировке одних и тех же значений — 10 раз доза («30 ppm food» против «30 ppm»; «100000 ppm food» против «100000 ppm in food») и 2 раза возраст старта («4 months» против «4 months of age»); числа, единицы, линия, пол и мера совпадают во всех 15 случаях. То есть к смыслу карточки перефразирование не приводит, но сравнение строк слишком строго для свободных текстовых полей: повторы O1 и O2 совпадают потому, что нормализатор на одном и том же тексте пишет поле одинаково, а на перефразированном тексте копирует его формулировку. Исправление меры (числовое сравнение дозы и возраста) было бы новым критерием; на этих же данных он не засчитывается, повтор нужен на новых текстах. С 15 единицами одна единица равна 0.067, больше допуска 0.05: любое лишнее расхождение по сравнению с повтором делает меру проваленной; статус «пройдено» малоинформативен, «не пройдено» надо читать с учётом шума."
    evidence: "scripts/paraphrase_check.py; data/validation/l1_8_texts.json"

  - id: L1.9
    level: 1
    kind: claim
    name: Инвариантность к стилю (B3)
    cls: "[$]"
    criterion: "тау-b между местами одной гипотезы в трёх стилях не ниже тау-b между двумя повторами одного стиля минус 0.05; для базовых систем сдвиг сообщается рядом"
    can_fail: "Да: если разница между стилями больше шума повторов. Порог привязан к шуму."
    declared: before_run
    status: fail
    procedure: "Уточнено 2026-10-27 до первого вызова. Те же 15 текстов ITP 2010, что в L1.8; три стиля: исходный (прогоны O1 и O2 из L1.8, это и есть два повтора одного стиля), «рекламный» (H) и «телеграфный» (T) — их переписывает модель семейства deepseek (промпт в scripts/style_check.py, 30 вызовов), факты (вещество, доза, возраст старта, линия, пол, конечная точка, направление) проверяются вручную, при изменении факта текст пересоздаётся один раз и это записывается. Две полные прогона конвейера по 15 текстов (H и T, на дату T = 2010-12-31, config v2-flash, проверяющий deepseek, дедупликация выключена). Мера: тау-б Кендалла между ожиданиями профиля evidence_first одних и тех же 15 гипотез в двух стилях; три пары стилей (исходный–H, исходный–T, H–T); пройдено, если каждая пара не ниже тау-б между O1 и O2 минус 0.05. Базовая система (Co-Scientist, L0: одно семейство, Elo, 4 цикла по 3 матча на гипотезу, config paid-test, европубмед на дату T) запускается на тех же 15 текстах в трёх стилях и с повтором исходного стиля (зерно 1); сдвиг сообщается рядом, порога нет. Оценка: порядка 100 вызовов нашего метода и около 100–300 тыс. токенов на каждый из четырёх запусков L0 (по прежним прогонам L0 на группах из 10 гипотез)"
    result: "Выполнено 2026-10-27 по записанной процедуре (30 вызовов на переписывание, 44 + 47 вызовов нашего метода, четыре запуска L0 по 113–121 вызову; пороги не менялись). Наш метод: тау-б между стилями исходный–H 0.714, исходный–T 0.543, H–T 0.600 при тау-б повтора O1–O2 0.905 (порог 0.855): ни одна пара не достигает порога, не пройдено. Базовая система L0 (рядом, порога нет): тау-б повтора исходного стиля (зёрна 0 и 1) 0.172; между стилями 0.486 (исходный–H), 0.352 (исходный–T), 0.257 (H–T)."
