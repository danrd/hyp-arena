    status: inconclusive
    evidence: "docs/negative-sampling.md (разделы 5 и 6)"
    note: "Сейчас 5–6 групп, одно зерно, интервалы включают 0; разница в нашу пользу, но не доказательна. Доступно 76 групп."

  - id: L2.2
    level: 2
    name: Метод против дешёвого листового базового ответа («один вызов»)
    cls: "[$]"
    criterion: "то же: парная разность AUC с ДИ выше 0 при равном бюджете"
    declared: pending
    status: fail
    evidence: "docs/negative-sampling.md (разделы 5 и 6)"
    note: "На пяти группах метод 0.71 и базовый ответ 0.71: преимущества нет. Листовой арм обязан быть в любом сравнении."

  - id: L2.3
    level: 2
    name: Сравнение с Co-Scientist на историческом пуле ITP (метки есть)
    cls: "[$]"
    criterion: "L0, листовой арм и метод на одном пуле; парная разность AUC с ДИ выше 0; затраты сообщены"
    declared: pending
    status: not_run
    blocker: "платно; ждёт решения по бюджету и по политике чистоты"

  - id: L2.4
    level: 2
