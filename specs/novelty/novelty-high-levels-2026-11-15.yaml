id: novelty-high-levels-2026-11-15
written_on: 2026-11-15
status: definitions fixed before the pack was sent; our own N on these hypotheses is not computed yet
why: >-
  The novelty benchmark so far (pack 18, pack 7) is registry trials, almost all at "new context": the upper levels of N
  (new mechanism of a known effect, new combination, new link) and novelty by absence (the PubMed count on a link's own
  subject and object) have never been checked against an outside reader. They are what the frontier profile and directed
  evolution rest on.
cost: >-
  the pack is free. Our N on the 30 hypotheses needs the pipeline (search, reading) on them: priced by a dry count and run
  only after the user's go, off-peak.
pack: Argon pack 26 (longevity-kg reviews/argon-2026-11-15/pack_26_task.json; key pack_26_key.json); builder scripts/argon/pack26_novelty.py
sample: >-
  30 hypotheses that are not registry trials, with a saved card of the working template (card benchmark, packs 19 and 20)
  that has at least one mechanism step: 13 Bio Arena, 13 written in a chat, 4 evolved versions of registry trials with three
  or more steps (expected near the known). One date T for all, 2026-10-14 (the earliest date a text of the set was written).
shown: the text, T, the card's chain (steps and outcomes as subject - relation - object with qualifiers and how the text states them)
asked:
  per_hypothesis: >-
    novelty (new_context | translation | analog | new_mechanism | new_combination | new_link | unknown), outcome_level under
    a new_mechanism, up to 3 defining PMIDs, known_result with its PMID
  per_link: "level, supported, up to 2 PMIDs; for a new_link the PubMed query on the link's subject AND object and its count before T"
measures:
  N: "linear-weighted Cohen kappa over the six ordered levels on hypotheses where neither reader says unknown; confusion table; agreement on unknown against a level"
  direction: share of hypotheses where our level is farther from the known than Argon's, and nearer
  absence: "for links either reader calls new: our PubMed count against Argon's (both under 5, both at least 5, split)"
  pmids: "every PMID Argon gives is fetched from PubMed (exists, public on or before T); share valid; whether our search found it"
  links: weighted kappa of the per-link levels
rule:
  pack_usable_when: Argon puts at least 8 of the 30 at new_mechanism or above and at least 5 at analog or below; else the pack does not separate the levels and decides nothing
  N_passes_when: weighted kappa at least 0.4 and our level farther from the known in at most 0.25 of the hypotheses
  absence_passes_when: our count and Argon's fall on the same side of 5 in at least 0.8 of the links either reader calls new
  if_not: the misses are sorted by cause (search, reading, card chain, the level rule) before any rule is changed

argon_answer_2026_11_16:
  check: "86 PMIDs, all exist and were public on or before T; every one of the 35 links called new carries its query and count"
  levels: {new_link: 10, new_combination: 10, new_mechanism: 2, new_context: 7, analog: 1}
  pack_usable: "yes: 22 of 30 at new_mechanism or above, 8 at analog or below (the rule asked at least 8 and at least 5)"
our_run:
  written_on: 2026-11-16
  status: written before the run (one hypothesis run as a trial of the script)
  what: >-
    the working pipeline (configs/v3-flash-n10.yaml: search filtered, the working reader, which is v19 since 2026-11-16,
    cross-link reading; the trial hypothesis read with v17 is run again) on the 30 hypotheses
    with their saved cards, T 2026-10-14; scripts/novelty/bench_novelty.py
  cost: "dry count 2.19 USD off-peak (0.0076 a search from the confirming run of the search, 108 links, about 128 alternatives, the cross-link reading); the trial hypothesis cost 0.068; cap MAX_USD 3"
  also_measured: >-
    the search on stated steps: the share of the PMIDs Argon gives per link that our search handed to the reader and that
    became a record, for step links against outcome links (the registry trials of pack 18 had 5 steps in all)

result_2026_11_16:
  run: >-
    the working pipeline on the 30 hypotheses with saved cards, off-peak, 2.36 USD for the kept runs and about 0.3 USD for
    runs lost to three pipeline errors on written hypotheses, fixed during the run (admission asked an endpoint class that a
    cell or tissue outcome does not fit; a declared alternative has no link; a model's "other" outside an ordinal scale).
    Reader: 12 hypotheses read with v19, 18 with v21 (the working reader changed during the run)
  N: >-
    27 pairs, weighted kappa 0.185, exact 0.33; ours nearer the known in 14, farther in 4; ours unknown in 3. Ours: new
    context 10, analog 12, new combination 2, new link 3; Argon: new combination 10, new link 10, new context 7, new mechanism
    2, analog 1
  links: "108 links, weighted kappa 0.315; ours analog 45 where Argon says analog 13 (new context 60)"
  absence: "of 26 links Argon calls new with a count from both, 22 fall on the same side of 5 (0.85); 9 such links have no count of ours (a label too long for the count)"
  search_on_stated_steps: >-
    of 100 papers Argon names for steps, the search gave 46 to the reader on their own link (59 anywhere in the hypothesis)
    and 32 became records on the link; for outcomes 14 of 30 given, 10 recorded. On written hypotheses the steps are found
    and read about as well as the outcomes: the registry problem was steps missing from the cards, not the search
  by_the_rule:
    pack_usable: "yes (22 of 30 at new_mechanism or above, 8 at analog or below)"
    N_passes: "no: kappa 0.185 < 0.4 (the direction asked was ours farther in at most 0.25; here ours is nearer in 0.52)"
    absence_passes: "yes: 0.85 >= 0.8"
  causes_sorted:   # the 14 hypotheses where ours is nearer the known (if_not of the rule)
    regimen_is_the_idea: >-
      V05, V09, V12, V22, V29 and others: the hypothesis is a regime of a known agent (brief, pulsatile, timed, intermittent);
      the reader marks studies of the agent in its usual regime as the same intervention or its class, so the outcome link
      has records and N stops at new context or analog. Argon counts the regime as the idea and calls it a new combination
    outcome_is_a_known_end_of_the_chain: >-
      V19 (SARM1 - axon destruction), V23 (DNA damage - senescence), V26, V30: the card's outcome claim is the last known
      step of the chain, not the main factor's effect; it has many records, so N is new context or analog whatever the new
      link in the middle. Argon judges the chain and says new mechanism or new link
    class_records_on_mechanistic_outcomes: "V04, V18, V21, V27: records of related agents on a broad outcome (inflammation, lifespan in worms) set analog"
  reading: >-
    novelty by absence works; the outcome ladder does not fit hypotheses whose idea is a regime or a new middle link. Two
    candidates, both rules of the novelty stage: (1) for the outcome ladder, a record counts as the same question only when
    it matches the claim's stated regime when the claim states one (the regime is part of the intervention the claim names);
    (2) the outcome link of N is the main factor on the outcome, not the last step: when the card's outcome claim's subject
    is a step, its records set the level of that step, not of the hypothesis. Neither is written into the method yet

rules_2026_11_16:
  written_on: 2026-11-16
  status: written before the variants were scored
  rules:
    regime: "when the claim's subject names a regime (brief, transient, pulsatile, intermittent, timed, reversible, fractionated, pre-injury, post-exercise ...), a record is the same question on the outcome only when its quote names a regime too (novelty_v34.REGIME)"
    main_factor: "when the subject of every outcome claim of the card is not the main factor (no content word of the intervention's label), those claims are steps of the chain for N, not its outcome (novelty_v34.MAIN_FACTOR)"
  scored_on:
    pack_26: "the 30 written hypotheses (where the causes were found: in-sample)"
    pack_18: "the 30 registry trials of the search gold with the working search and reader v17 (run_*_n15x.json): neither rule was looked at there"
  rule: >-
    a rule enters the novelty stage when on pack 26 the weighted kappa rises by at least 0.1 and on pack 18 it does not fall
    by more than 0.03; both together are scored too. The rule goes to the user with the numbers before the manual changes
