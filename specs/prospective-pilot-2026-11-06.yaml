id: prospective-pilot-2026-11-06
written_on: '2026-11-06'
status: run and frozen 2026-11-06 (outcomes pending)
what: 'pilot of the prospective pool (method-v3.md section 10): 60 ongoing CT.gov
  trials on ageing itself, primary completion 2026-11 .. 2028-12, scored before any
  outcome exists'
pool:
  query: condition equal to one of scripts/hypothesis_sources_ctgov.CONDITIONS; interventional;
    RECRUITING, ACTIVE_NOT_RECRUITING, NOT_YET_RECRUITING, ENROLLING_BY_INVITATION
  ongoing: 2815
  in_window: 371
  types:
    behavioral: 146
    drug/supplement: 101
    other (exercise etc.): 98
    device: 26
  pool_sha256: f722487d6a616fb25ad1c00280cab7e10bf3f18002f5ee664e70a04225fc4bc3
sample:
  rule: 'round robin over the four intervention types, SHA-1 of NCT id within each;
    15 per type (devices over-represented relative to the pool, by design: balance
    across types)'
  units_sha256: d5d726fb8e410788d1be95da9b6b9516dc851e82191063a9e42179486841b39a
  texts_sha256: 748cc0662bb6e069eb17867fe3591fcd54e7feb22ae31e64b2ab1e79ec00a084
method:
  run: configs/v3-flash-n10.yaml (normalize_card/v10, verify_claim/v9, verifier deepseek),
    as of the run date
  score: hyparena/card/rules_v32.py (P with 90% interval, I, V = P x I, scope) + ASPID
    trial profiles (configs/profiles_v3.yaml)
  frozen: scores file and SHA-256 written to specs/ by scripts/prospective.py freeze,
    before any outcome
checks_now:
  run_health: cards parsed >= 55/60; needs_refinement <= 6; units with an error after
    one retry <= 3
  ties: 'share of P ties (rounded to 3 digits) <= 15% (v3.2 on the fresh sample: 8%)'
  ai_role: 'report counts only (no criterion: tag not validated yet)'
test_when_outcomes_exist:
  labels: benchmark outcome rules (scripts/fresh_outcomes.py), labelled blind to the
    scores
  primary: P tied AUC with 95% bootstrap CI on units with a decisive label
  signal: AUC >= 0.60 and lower CI bound > 0.45
  no_signal: AUC < 0.55
  otherwise: unclear
  secondary: ASPID expected rank per profile, same thresholds, reported not decided
cost:
  estimate_usd: 3.0
  basis: 'fresh run 2026-11-06: 883 calls for 44 units, about 2.2 USD; cap 60 calls
    per unit'
amendments_before_scores:
- date: '2026-11-06'
  what: >-
    score with rules_v32 fold=True (specs/v32-independence-fold-2026-11-06.yaml, passed) and ASPID profiles trial-2
    (endpoint_clinical in the lowest tier of evidence and funding; specs/estimand-2026-11-06.yaml); the endpoint category
    is extracted from the 60 texts by both families (scripts/prospective.py estimand, about 120 calls, 0.15 USD), unknown
    when they disagree. Decided by the user while the run was in progress; no outcome exists, no score was computed yet.
run_result:
  units: 60
  calls: 1294 (about 3.2 USD) + estimand extraction 120 calls (about 0.15 USD)
  outcomes: {ranked: 53, filtered: 4, known_result: 2, needs_refinement: 1}
  errors_after_retry: 0 (the run was stopped twice by the environment and resumed; no unit was repeated)
  checks_now:
    run_health: passed (cards parsed 60/60, scored 59/60, needs_refinement 1, errors 0)
    ties: passed (7.1% of pairs of P tied at 3 digits, 37 distinct values among 55 units through the gate)
    ai_role: {none: 56, analysis: 2, intervention: 1}
  frozen: specs/prospective-2026-11-06.yaml, scores_sha256 45300a76cdd42110134a319710329f76104ffcf4a34aaad00022fb8dea9e84a9
