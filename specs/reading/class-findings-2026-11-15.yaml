id: class-findings-2026-11-15
written_on: 2026-11-15
status: definitions fixed before the pack was sent and before any reader run on it
why: >-
  Reader v17 loses own studies of an intervention of the same class (6 of 23 on pack 16) and has no field that says whether
  a record's result is on the claim's own outcome; code cannot check reading rule 0 and the gate rule "a null counts only on
  the claim's outcome" could not be tested (specs/scoring/gate-fixes-2026-11-15.yaml, G1). Prompt examples for the class
  boundary come from the loss analysis of pack 16, so they must be scored on abstracts the reader was never tuned on.
cost: >-
  the pack is free (Argon is the user's outside reader; PubMed E-utilities). Every reader run on it is paid: priced by a dry
  count and run only after the user's go, off-peak.
pack: Argon pack 25 (longevity-kg reviews/argon-2026-11-15/pack_25{a,b}_task.json; key pack_25_key.json); builder scripts/argon/pack25_reading.py
sample: >-
  20 outcome links, one per trial, of trials in none of packs 9, 13, 15, 16, 18 and not the walkthrough trial (10 prospective,
  10 calibration); every abstract the link's saved search returned, at most 20: 382 link-abstract pairs. 14 links enriched
  (most abstracts typed by PubMed as a trial or a meta-analysis whose title shares no word with the claim's subject: code
  signals only), 6 random. Every third link in hash order (6 links) is a reserve.
asked: >-
  the fields of pack 16 (finding, none_reason, quote, result_on_claim_measure, comparison, effect_phrase, design, n_total,
  intervention_match, context_differs, secondary_positive) plus outcome_match (same | narrower | broader | other) and
  outcome_measure (the verbatim words that name the measure).
measures:
  recall: share of the gold's for / against findings the reader records on the same link with the same stance
  precision: share of the reader's records the gold also calls a finding with the same stance
  class_recall: recall on gold findings with intervention_match class and a primary-study design (the loss this spec is about)
  outcome_field: >-
    for records both readers have: Cohen kappa of outcome_match in two classes (same or narrower | broader or other); share
    of the reader's outcome_measure phrases that are verbatim in the abstract
  intervals: bootstrap over links
rule:
  baseline: reader v17 is scored on the 14 non-reserve links first (its own paid run); the numbers are written here before any candidate is run
  candidate_replaces_v17_when: >-
    on the 14 non-reserve links, mean of two runs: class_recall higher than v17's by at least 0.15, precision not lower by
    more than 0.03, recall not lower; and on pack 16 recall and precision not lower than v17's by more than 0.03
  outcome_field_usable_when: kappa at least 0.6 and at least 0.95 of the phrases verbatim; then scripts/scoring/gate_variants.py is rerun with the field for rule G1
  second_round: a candidate written after seeing the losses on the 14 links is scored on the 6 reserve links only
  pack_usable_when: the gold has at least 30 class findings from primary studies; fewer, and class_recall is reported with its interval but decides nothing

reader_v18:
  written_on: 2026-11-15
  status: the template and the code checks are written; nothing below was run when this was written
  template: hyparena/prompts/verify_claim/v18.j2 (v17 plus rules 1c and 1d, the papers table with three answers, three record fields)
  changes:
    three_answers: >-
      for every abstract the reader answers separately: the intervention (same | same_kind | component | other), the
      outcome its result is on (same | narrower | broader | other, with the abstract's words for the measure) and whether
      the abstract has a result of its own (yes | no); the finding follows from the three
    code_checks: >-
      an abstract that fits on all three and is called "none", a finding whose three answers do not fit, a finding without
      a record, an abstract without an entry: the reply goes back to the reader (two rounds, as for a quote that is not
      verbatim); a competing explanation may still be "none" (it counts only by its own part). A record whose outcome is
      broader or another is kept apart and not counted
    component_rule: a study of one part of the claim's combined intervention is the same class (manual section 4, reading rule 1)
    effect_numbers: >-
      the numbers of the result as fields (values per group or before and after, standard deviations, the difference, its
      95% interval, p, a ratio, a standardised difference), each kept only when written in the abstract; code computes the
      standardised difference. The record weight reads it for the kinds the manual already names (standardised difference,
      ratio, difference with its interval); a d from two means or from one standard deviation is stored and not weighed
  step_1_pack_16:
    run: "bench_reading v18 and v18_2 (the same filter and batches as v17), two runs"
    cost: "dry count 0.09 USD a run off-peak; the dry count of v17 was 0.051 against 0.063 spent, so about 0.11 a run, 0.25 for both; cap MAX_USD 0.4"
    rule: >-
      mean of the two runs against v17 (recall 0.55, precision 0.79): recall and precision not lower by more than 0.03.
      Pack 16 is the pack the examples come from: passing here only admits v18 to the fresh pack, it does not make it the
      working reader
    reported_not_judged: >-
      same-class primary findings found (v17: 6 of 23); "none" answers by which of the three answers failed; replies sent
      back by the code checks and how many changed; records not counted for a broader or another outcome, against the gold;
      share of records for with numbers, and with a d, by kind (v17: the size was readable in 68 of 297)
  step_2_pack_25: the rule of this spec above (candidate_replaces_v17_when, outcome_field_usable_when), after Argon's answer
  step_3: "if both pass: the confirming run on the 30 trials of pack 18 with the cross-link reading (specs/reading/benchmark-reading-2026-11-12.yaml), priced by its own dry count"

result_step_1_2026_11_15:
  run: "bench_reading v18 and v18_2 on pack 16; 0.147 USD in all (a trial of 2 links 0.008, the runs 0.065 and 0.074)"
  measures:      # recall, precision, records, hits of 94 gold findings
    v17:   [0.564, 0.791, 67, 53]
    v17_2: [0.543, 0.797, 64, 51]
    v18:   [0.596, 0.615, 91, 56]
    v18_2: [0.606, 0.679, 84, 57]
  by_the_rule: "fails: recall 0.60 against 0.55 (higher), precision 0.65 against 0.79 (lower by 0.15, the limit is 0.03). v18 does not go to pack 25 and is not the working reader"
  by_stratum: "precision on outcome links 0.39 and 0.43 (v17 0.57), on mechanism links 0.44 and 0.56 (v17 0.89), on alternatives 0.89 and 0.92 (v17 0.91)"
  same_class_primary_found: "19 of 37 in both runs (v17 13 of 37; all strata, the alternatives without their own part included)"
  where_the_extra_records_come_from: >-
    of 26 records on outcome and mechanism links the gold calls "none" (run 1), all carry the reader's answer outcome
    "narrower": 11 same_kind and 6 component where the gold says another intervention altogether (aerobic exercise for a
    claim about glycation end-products; vibrating insoles for an electric signal; direct-current stimulation for pulsed
    current), 9 same_kind where the gold says another outcome (cognitive test scores for "brain plasticity" and for "lost
    function"). The reader stretches "same kind" and "a narrower measure" at once; nine of the 26 are one claim (R19)
  code_filters_tried_free: >-
    dropping the records with intervention same_kind or component AND outcome narrower gives recall 0.40 / 0.43 at precision
    0.88 / 0.87; dropping only component AND narrower 0.56 / 0.57 at 0.65 / 0.69; keeping only outcome "same" 0.35 / 0.36 at
    0.89 / 0.92: the true same-class findings sit in the same cell as the false ones, so no rule on the three answers
    separates them
  effect_numbers: >-
    numbers on 45 of 91 and 48 of 84 records; a standardised difference computed for 26 and 25 (stated SMD 13, ratio 4,
    interval 3-4, two means 3-5, one SD 1): about 0.30 of the records against 0.23 readable from the phrase (68 of 297 on
    the 30 trials, another sample). The measure's words are verbatim on 61 and 64 records
  reading: >-
    the three separate answers with a send-back raise the same-class findings and lose precision exactly as v14 did; the
    boundary is not in the wording of the rules but in two judgements the cheap reader makes loosely (is this the claim's
    kind of intervention; is this measure the claim's outcome). The fields (outcome match, measure, effect numbers) work
    technically and can be kept without the send-back

reader_v19:
  written_on: 2026-11-16
  status: written before the run
  template: hyparena/prompts/verify_claim/v19.j2
  what: >-
    reader v17 word for word, plus the three record fields of v18 (outcome_match, outcome_measure, effect_numbers). No rule
    1d, no three answers per abstract, no send-back of a reply; the combined-intervention rule (1c) is not in it either, so
    that the run measures the fields alone. Code keeps a record whose outcome is "broader" or "other" apart, uncounted
  run: "bench_reading v19 and v19_2 on pack 16; dry count 0.058 USD a run off-peak (v17: 0.051 counted, 0.063 spent), about 0.15 for both; cap MAX_USD 0.3"
  rule: >-
    mean of two runs against v17 (recall 0.55, precision 0.79): neither lower by more than 0.03. Passing makes v19 the
    candidate for pack 25 (the outcome field against Argon's, rule outcome_field_usable_when) and for the confirming run;
    it is not expected to raise the same-class recall
  reported_not_judged: records not counted for a broader or another outcome, against the gold; share of records with numbers and with a d, by kind

result_reader_v19_2026_11_16:
  run: "bench_reading v19 and v19_2 on pack 16, off-peak; 0.131 USD (0.065 and 0.066)"
  measures:      # recall, precision, records, hits of 94 gold findings
    v19:   [0.585, 0.873, 63, 55]
    v19_2: [0.574, 0.783, 69, 54]
  by_the_rule: "passes: mean recall 0.58 against 0.55, mean precision 0.83 against 0.79 (v17 0.56 / 0.79 and 0.54 / 0.80)"
  outcome_field: >-
    run 1: 6 records kept apart as another outcome, 5 of them "none" in the gold and 1 a gold finding; run 2: none kept
    apart. Of the counted records the reader calls 7 and 9 "same" and 55 and 59 "narrower" (pack 16 has no gold for the field:
    its agreement is measured on pack 25)
  effect_numbers: "numbers on 35 of 63 and 37 of 69 counted records; a standardised difference for 21 and 20 (stated SMD 9, ratio 4 and 3, interval 4, two means 4)"
  reading: >-
    the fields cost nothing in recall or precision; the difference between the two runs of v19 on precision (0.87 and 0.78)
    is the reader's own noise. The same-class loss stays as with v17
  next: v17 and v19 on pack 25 (the outcome field against Argon's, the rule outcome_field_usable_when), then the confirming run

result_pack_25_2026_11_16:
  gold: >-
    Argon's answer: 382 pairs, 111 findings (79 for, 32 against), every quote verbatim. By intervention match of the
    primary studies: exact 17, class 23 (10 on the 14 main links, 13 on the 6 reserve links), category 36; reviews and
    meta-analyses 34. Outcome match of the findings: same 66, narrower 34, broader 6, other 5. The pack has fewer than 30
    class findings from primary studies, so by the rule class_recall is reported and decides nothing
  run: "bench_reading --pack 25: v17, v17_2, v19, v19_2, off-peak, 0.274 USD"
  measures:      # recall, precision, records, hits of 111 gold findings
    v17:   [0.586, 0.714, 91, 65]
    v17_2: [0.550, 0.744, 82, 61]
    v19:   [0.640, 0.763, 93, 71]
    v19_2: [0.604, 0.744, 90, 67]
  class_primary_found: "v17 13 and 13 of 23, v19 15 and 15 of 23 (on the main links 3 and 3 of 10, 3 and 4 of 10); exact primary 11 and 11 of 17, 14 and 11; category primary 18 and 15 of 36, 17 and 17"
  outcome_field: >-
    not usable: on the findings both readers have (78 and 76) the reader calls the outcome its own (same or narrower) in
    all but one, where Argon calls 8 broader or another: kappa 0.0 and -0.02 (the rule asks 0.6). The measure's words are
    given on 86 of 93 and 76 of 90 records. The reader does not use "broader" or "other": a record it writes is, to it, on
    the claim's outcome
  where_precision_is_lost: >-
    of the records the gold does not confirm (26 and 21 for v17, 22 and 23 for v19), 12 to 17 are "none: another outcome"
    in the gold and 6 are the other side; another intervention is not among them. On a fresh pack the loss is the outcome
    boundary, not the intervention class
  reading: >-
    (1) v19 is not worse than v17 on a pack neither was tuned on (recall 0.62 against 0.57, precision 0.75 against 0.73,
    inside the intervals); (2) the same-class loss measured on pack 16 (6 of 23) is 13 of 23 here with the same reader: it
    was partly that pack; (3) the outcome field as a self-report of the reader does not work; the outcome boundary needs
    another check than the reader's own label
  decision: "2026-11-16: v19 is the working reader (configs/v3-flash-n10.yaml), accepted on packs 16 and 25 without the confirming run on the 30 trials; the outcome boundary is the next problem of the reading"

readers_v20_v21:
  written_on: 2026-11-16
  status: written before any run
  why: >-
    on pack 25, 12 to 17 of the 21 to 26 records the gold does not confirm are results on another outcome, and 11 of the 15
    of reader v19 (run 1) are one claim: "mixture - improves healthspan in - human" with the measure "quality of life" in
    its qualifiers, where the reader recorded muscle hypertrophy and lean mass as "narrower". The template names the
    claim's outcome by the claim's object, and for a claim whose object is the organism that is "human": every health
    measure is then a narrower measure of it. 10 of the 20 claims of pack 25 and 6 of the 20 of pack 16 are of this form
  v20: >-
    v19 with the outcome named by the measure qualifier when the claim's object is an organism (code:
    verifier.outcome_label), and one sentence in rule 0: a result on another health measure in the same people is "none"
  v21: "v20 plus the combined-intervention rule (1c: one part of the claim's combined intervention on the claim's outcome is the same class)"
  run: "bench_reading v20, v20_2, v21, v21_2 on packs 16 and 25: 8 runs, about 0.07 USD each off-peak (v19 spent 0.065 to 0.072), about 0.55 in all; cap MAX_USD 0.15 a run"
  rule:
    v20_replaces_v19_when: >-
      on pack 25 (mean of two runs) precision higher than v19's 0.75 by at least 0.05 and recall not lower than 0.62 by more
      than 0.03; on pack 16 recall and precision not lower than v19's (0.58, 0.83) by more than 0.03
    v21_replaces_v20_when: >-
      on both packs recall and precision not lower than v20's by more than 0.03, and the same-class primary findings found
      on the two packs together not fewer than with v20; otherwise the combined-intervention rule stays in the manual and
      out of the reader, and the manual says so
  reported_not_judged: records on another outcome against the gold, on organism-object claims and on the others; the 11 records of claim Q03

result_readers_v20_v21_2026_11_16:
  run: "8 runs off-peak (two templates, packs 16 and 25, two runs each): 0.53 USD"
  measures:      # recall, precision (two runs); records
    pack_16: {v19: [[0.585, 0.873], [0.574, 0.783]], v20: [[0.564, 0.869], [0.521, 0.925]], v21: [[0.596, 0.848], [0.585, 0.833]]}
    pack_25: {v19: [[0.640, 0.763], [0.604, 0.744]], v20: [[0.568, 0.887], [0.577, 0.889]], v21: [[0.631, 0.897], [0.649, 0.900]]}
  means:         # recall, precision
    pack_16: {v19: [0.580, 0.828], v20: [0.543, 0.897], v21: [0.591, 0.841]}
    pack_25: {v19: [0.622, 0.754], v20: [0.573, 0.888], v21: [0.640, 0.899]}
  records_on_another_outcome: "pack 25: v19 15 and 15, v20 2 and 3, v21 2 and 2; pack 16: v19 1 and 4, v20 0 and 0, v21 0 and 0"
  records_on_another_intervention: "pack 16: v19 3 and 6, v20 3 and 2, v21 5 and 7; pack 25: 0 or 1 for every reader"
  same_class_primary_found: "pack 16 (of 37): v19 16 and 15, v20 16 and 14, v21 19 and 17; pack 25 (of 23): v19 15 and 15, v20 15 and 15, v21 16 and 15"
  organism_claims_pack_25: "records 56 and 58 with 38 and 39 confirmed (v19); 35 and 36 with 32 and 33 (v20); 38 and 41 with 35 and 38 (v21)"
  by_the_rule:
    v20_replaces_v19: >-
      not met: on pack 25 precision is higher by 0.13 (asked 0.05) but recall is 0.573, lower than 0.62 by 0.05 (allowed
      0.03); on pack 16 recall is lower by 0.037
    v21_replaces_v20: "not met as written: recall is not lower on either pack, but on pack 16 precision is 0.841 against v20's 0.897 (lower by 0.056)"
  what_the_rule_did_not_foresee: >-
    v21 against v19 directly, which the rule did not state: on both packs v21 is not lower on either measure (pack 16: 0.591
    and 0.841 against 0.580 and 0.828; pack 25: 0.640 and 0.899 against 0.622 and 0.754). The outcome named by its
    measure removes the records on another outcome (15 to 2 on pack 25) at the cost of some true findings; the
    combined-intervention rule brings findings back and, on pack 16, some records on another intervention with them
  decision: "2026-11-16: v21 is the working reader (configs/v3-flash-n10.yaml), by the direct comparison with v19; the rule as written was not met by either template"
