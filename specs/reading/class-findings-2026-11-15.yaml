id: class-findings-2026-11-15
written_on: 2026-11-15
status: definitions fixed before the pack was sent and before any reader run on it
why: >-
  Reader v17 loses own studies of an intervention of the same class (6 of 23 on pack 16) and has no field that says whether
  a record's result is on the claim's own outcome; code cannot check reading rule 0 and the gate rule "a null counts only on
  the claim's outcome" could not be tested (specs/scoring/gate-fixes-2026-11-15.yaml, G1). Prompt examples for the class
  boundary come from the loss analysis of pack 16, so they must be scored on abstracts the reader was never tuned on.
cost: >-
  the pack is free (Argon is the user's outside reader; PubMed E-utilities). Every reader run on it is paid: priced by a dry
  count and run only after the user's go, off-peak.
pack: Argon pack 25 (longevity-kg reviews/argon-2026-11-15/pack_25{a,b}_task.json; key pack_25_key.json); builder scripts/argon/pack25_reading.py
sample: >-
  20 outcome links, one per trial, of trials in none of packs 9, 13, 15, 16, 18 and not the walkthrough trial (10 prospective,
  10 calibration); every abstract the link's saved search returned, at most 20: 382 link-abstract pairs. 14 links enriched
  (most abstracts typed by PubMed as a trial or a meta-analysis whose title shares no word with the claim's subject: code
  signals only), 6 random. Every third link in hash order (6 links) is a reserve.
asked: >-
  the fields of pack 16 (finding, none_reason, quote, result_on_claim_measure, comparison, effect_phrase, design, n_total,
  intervention_match, context_differs, secondary_positive) plus outcome_match (same | narrower | broader | other) and
  outcome_measure (the verbatim words that name the measure).
measures:
  recall: share of the gold's for / against findings the reader records on the same link with the same stance
  precision: share of the reader's records the gold also calls a finding with the same stance
  class_recall: recall on gold findings with intervention_match class and a primary-study design (the loss this spec is about)
  outcome_field: >-
    for records both readers have: Cohen kappa of outcome_match in two classes (same or narrower | broader or other); share
    of the reader's outcome_measure phrases that are verbatim in the abstract
  intervals: bootstrap over links
rule:
  baseline: reader v17 is scored on the 14 non-reserve links first (its own paid run); the numbers are written here before any candidate is run
  candidate_replaces_v17_when: >-
    on the 14 non-reserve links, mean of two runs: class_recall higher than v17's by at least 0.15, precision not lower by
    more than 0.03, recall not lower; and on pack 16 recall and precision not lower than v17's by more than 0.03
  outcome_field_usable_when: kappa at least 0.6 and at least 0.95 of the phrases verbatim; then scripts/scoring/gate_variants.py is rerun with the field for rule G1
  second_round: a candidate written after seeing the losses on the 14 links is scored on the 6 reserve links only
  pack_usable_when: the gold has at least 30 class findings from primary studies; fewer, and class_recall is reported with its interval but decides nothing

reader_v18:
  written_on: 2026-11-15
  status: the template and the code checks are written; nothing below was run when this was written
  template: hyparena/prompts/verify_claim/v18.j2 (v17 plus rules 1c and 1d, the papers table with three answers, three record fields)
  changes:
    three_answers: >-
      for every abstract the reader answers separately: the intervention (same | same_kind | component | other), the
      outcome its result is on (same | narrower | broader | other, with the abstract's words for the measure) and whether
      the abstract has a result of its own (yes | no); the finding follows from the three
    code_checks: >-
      an abstract that fits on all three and is called "none", a finding whose three answers do not fit, a finding without
      a record, an abstract without an entry: the reply goes back to the reader (two rounds, as for a quote that is not
      verbatim); a competing explanation may still be "none" (it counts only by its own part). A record whose outcome is
      broader or another is kept apart and not counted
    component_rule: a study of one part of the claim's combined intervention is the same class (manual section 4, reading rule 1)
    effect_numbers: >-
      the numbers of the result as fields (values per group or before and after, standard deviations, the difference, its
      95% interval, p, a ratio, a standardised difference), each kept only when written in the abstract; code computes the
      standardised difference. The record weight reads it for the kinds the manual already names (standardised difference,
      ratio, difference with its interval); a d from two means or from one standard deviation is stored and not weighed
  step_1_pack_16:
    run: "bench_reading v18 and v18_2 (the same filter and batches as v17), two runs"
    cost: "dry count 0.09 USD a run off-peak; the dry count of v17 was 0.051 against 0.063 spent, so about 0.11 a run, 0.25 for both; cap MAX_USD 0.4"
    rule: >-
      mean of the two runs against v17 (recall 0.55, precision 0.79): recall and precision not lower by more than 0.03.
      Pack 16 is the pack the examples come from: passing here only admits v18 to the fresh pack, it does not make it the
      working reader
    reported_not_judged: >-
      same-class primary findings found (v17: 6 of 23); "none" answers by which of the three answers failed; replies sent
      back by the code checks and how many changed; records not counted for a broader or another outcome, against the gold;
      share of records for with numbers, and with a d, by kind (v17: the size was readable in 68 of 297)
  step_2_pack_25: the rule of this spec above (candidate_replaces_v17_when, outcome_field_usable_when), after Argon's answer
  step_3: "if both pass: the confirming run on the 30 trials of pack 18 with the cross-link reading (specs/reading/benchmark-reading-2026-11-12.yaml), priced by its own dry count"

result_step_1_2026_11_15:
  run: "bench_reading v18 and v18_2 on pack 16; 0.147 USD in all (a trial of 2 links 0.008, the runs 0.065 and 0.074)"
  measures:      # recall, precision, records, hits of 94 gold findings
    v17:   [0.564, 0.791, 67, 53]
    v17_2: [0.543, 0.797, 64, 51]
    v18:   [0.596, 0.615, 91, 56]
    v18_2: [0.606, 0.679, 84, 57]
  by_the_rule: "fails: recall 0.60 against 0.55 (higher), precision 0.65 against 0.79 (lower by 0.15, the limit is 0.03). v18 does not go to pack 25 and is not the working reader"
  by_stratum: "precision on outcome links 0.39 and 0.43 (v17 0.57), on mechanism links 0.44 and 0.56 (v17 0.89), on alternatives 0.89 and 0.92 (v17 0.91)"
  same_class_primary_found: "19 of 37 in both runs (v17 13 of 37; all strata, the alternatives without their own part included)"
  where_the_extra_records_come_from: >-
    of 26 records on outcome and mechanism links the gold calls "none" (run 1), all carry the reader's answer outcome
    "narrower": 11 same_kind and 6 component where the gold says another intervention altogether (aerobic exercise for a
    claim about glycation end-products; vibrating insoles for an electric signal; direct-current stimulation for pulsed
    current), 9 same_kind where the gold says another outcome (cognitive test scores for "brain plasticity" and for "lost
    function"). The reader stretches "same kind" and "a narrower measure" at once; nine of the 26 are one claim (R19)
  code_filters_tried_free: >-
    dropping the records with intervention same_kind or component AND outcome narrower gives recall 0.40 / 0.43 at precision
    0.88 / 0.87; dropping only component AND narrower 0.56 / 0.57 at 0.65 / 0.69; keeping only outcome "same" 0.35 / 0.36 at
    0.89 / 0.92: the true same-class findings sit in the same cell as the false ones, so no rule on the three answers
    separates them
  effect_numbers: >-
    numbers on 45 of 91 and 48 of 84 records; a standardised difference computed for 26 and 25 (stated SMD 13, ratio 4,
    interval 3-4, two means 3-5, one SD 1): about 0.30 of the records against 0.23 readable from the phrase (68 of 297 on
    the 30 trials, another sample). The measure's words are verbatim on 61 and 64 records
  reading: >-
    the three separate answers with a send-back raise the same-class findings and lose precision exactly as v14 did; the
    boundary is not in the wording of the rules but in two judgements the cheap reader makes loosely (is this the claim's
    kind of intervention; is this measure the claim's outcome). The fields (outcome match, measure, effect numbers) work
    technically and can be kept without the send-back
