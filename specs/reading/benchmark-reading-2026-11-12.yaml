cross_link_reading_2026_11_15:
  what: "over the v16 replay (run_*_n13r.json): every claim of the hypothesis (outcome and steps) also reads the papers its other searches found (mostly those of the proposed alternatives); the cheap relevance model (search_relevance/v1) rates them for the claim and the claim reads every one rated 3, filled up to 10 with those rated 2, at most 20; new records join the claim's records of the v16 replay; the alternatives keep their reading (scripts/reading/reader_replay.py cross, tag n14x)"
  why: "of the 33 gold papers the v16 reader got and did not record, 21 came only from an alternative's search and were read only against it"
  cost: "about 0.6 USD named (rating about 4 800 papers, reading the picked ones); cap 1.0"
  pass_rule: "written before the run, the same as for v16 against the saved search run n12: the share of gold must-find papers that became records at least 0.35 and the AUC of the evidence balance at least 0.515; the v16 replay alone (0.272, 0.661) reported beside"
  result_2026_11_15:
    cost: "0.40 USD by the call log (4 784 papers rated for the claims, 803 read)"
    n14x: "gold must-find papers that became records 0.381 (holdout 0.306); AUC of the evidence balance 0.710 [0.50, 0.90] on 30 trials; 784 records"
    against: "v16 alone 0.272 / 0.661 / 415 records; the saved search run (reader v9) 0.259 / 0.545 / 345"
    by_category_read: "prior trials 0.56 -> 0.72, direct 0.18 -> 0.36, reviews 0.17 -> 0.26, mechanism steps 0 -> 0.10, against 0.21 -> 0.21; the closest prior work read 0.47 -> 0.60"
    by_the_rule: "passed (0.381 >= 0.35, AUC 0.710 >= 0.515): the working config reads with verify_claim/v16 in batches of 10 and the cross-link reading (configs/v3-flash-n10.yaml: verify_version v16, read_batch 10, cross_link true; code hyparena/reading/cross_link.py, called by the pipeline after the alternatives)"
reader_v17_2026_11_15:
  what: "verify_claim/v17 = v16 with a rule first: the claim's programme under another name, the programme it is based on, or the same programme in another setting or population is the same intervention (intervention_match exact; the population or setting goes in qualifiers_match); only another programme of the same kind with its own protocol is class. The example is not from any benchmark set"
  why: "with v16 the novelty N agrees with the outside reader at weighted kappa 0.20 against 0.41 with v9: in 14 of 30 trials of pack 18 v16 marks the closest prior work as the same class (N 'analog') where Argon sees the same intervention in a new context"
  runs: "two runs on pack 16 (about 0.13 USD); then the 30 trials of pack 18 read again with v17 and the cross-link reading on the saved searches (about 1.0 USD)"
  pass_rule: "written before the runs: v17 replaces v16 when, on pack 16, the mean recall of two runs is at least 0.52 (v16's 0.574 - 0.05) and the mean precision at least 0.59, and, on the 30 trials, the weighted kappa of N with Argon is at least 0.35, the share of gold papers recorded at least 0.35 and the AUC of the evidence balance at least 0.515"
  result_2026_11_15:
    cost: "1.11 USD (pack 16 two runs 0.125, replay 0.578, cross-link 0.404)"
    pack_16: "recall 0.564 and 0.543 (mean 0.554), precision 0.791 and 0.797 (mean 0.794); holdout 20 of 21 at precision 1.0 in both; v16 0.574 / 0.794"
    pack_18_30_trials: "novelty N weighted kappa with Argon 0.445 [0.13, 0.74] (v16 with cross-link 0.197, v9 0.411), ours farther 0.24 (v16 0.52); gold papers recorded 0.388 (v16 0.381); AUC of the evidence balance 0.580 [0.37, 0.81] (v16 0.705, v9 0.545)"
    by_the_rule: "passed (0.554 >= 0.52, 0.794 >= 0.59, kappa 0.445 >= 0.35, 0.388 >= 0.35, AUC 0.580 >= 0.515): v17 replaces v16 in the working config"
    caution: "the AUC of the evidence balance fell from 0.705 to 0.580 (inside both intervals on 30 trials). A likely cause: v17 puts a differing population into qualifiers_match, so a record of the same programme in another population is 'adjacent' (weight 1/2) where v16 called it 'class' (weight 1). To be checked on the full calibration before the next pool is scored"
  auc_drop_explained_2026_11_15:
    what: "the evidence balance of the 30 trials under reader v16 (n14x) and v17 (n15x), trial by trial"
    main_cause: "two trials with a positive outcome (NCT03477097, NCT03600402) pass under v16 (balance 0.98 and 0.87) and are filtered by the gate under v17 (balance -1): v17 marks a null RCT of the same programme as the same intervention ('exact'), and the gate filters a hypothesis when its key link has a top-design between-group record against in the exact context and no such record for. In NCT03600402 the record against is a null on ankle range of motion in a trial whose claim is healthspan (an outcome the claim does not name); in NCT03477097 a supporting RCT of the same programme exists but its context is not exact, so it does not lift the gate"
    other: "records marked exact rose from 49 to 88 (for 36 -> 66, against 13 -> 22), class fell 708 -> 651, adjacent rose 25 -> 41; other trials move by 0.1-0.4 in both directions"
    correction_2026_11_15: "in NCT03600402 the claim's stated measure is active ankle range of movement, so the null RCT (PMID 22902138, n 32) is on the claim's own outcome, not another one; in NCT03477097 the null is on frailty, the claim's outcome; a third trial, negative (NCT04796701), is filtered too. The common cause is that the records for these links are RCTs and meta-analyses of the same class of intervention, which the gate did not count as a counterweight; the gate was changed (specs/scoring/gate-fixes-2026-11-15.yaml)"
    reading: "the drop is the gate meeting more exact nulls, not the weights: v17 is right that these are the same programmes, so the gate rule (a single null RCT filters unless a supporting RCT of the same level exists) and the outcome of the null record are what to look at"

