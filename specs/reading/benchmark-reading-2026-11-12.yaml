    design: >-
      20 links with every abstract their last search returned (as our reader saw them, up to 25): 400 pairs in two parts
      of 10 links. Strata: outcome 8, mechanism 5, alternative 5 (each random and enriched halves), repeat 2 (pack 9 links
      with an own finding: Argon test-retest). Enriched = most abstracts typed RCT or meta-analysis by PubMed whose title shares
      a word of the link's subject (code signal, independent of our reader). One link per unit; pack 9 units and H49 left out
      except the repeats. Holdout: 4 links (every third of a stratum in hash order), never used to tune a prompt.
    fields: >-
      finding (for / against / none) with none_reason; contiguous verbatim quote; result_on_claim_measure; comparison;
      effect_phrase; design; n_total with n_quote; intervention_match (exact / class / category / other); context_differs
      (only qualifiers the claim states); secondary_positive; distinguishing_part_shown (alternatives).
  public_later: "SciFact dev (CC BY 4.0 / ODC-By), then evidence inference 1.0 (MIT annotations; PMC texts private) - a separate spec"
systems:
  ours_v9: "verify_claim/v9 with its code checks (verbatim quote, retry, effect class, fallback family): the reader the prospective pool was scored with"
  ours_v13: "relevance filter v2, then verify_claim/v13 in batches of 10 with an answer for every paper (the reader of specs/reading/reader-v12-2026-11-08.yaml); added 2026-11-12 before any call"
  baseline_a: >-
    the same model as our reader, the same items (claim + the same abstracts in one call), the task in one sentence and the
    output schema, no reading rules, no code checks (no quote verification, no retry). User decision 2026-11-12: baseline (a) only.
metrics:   # per pair unless said; intervals: bootstrap over links (pairs of a link are not independent), 2000 resamples
  recall: "share of Argon's for/against pairs that the system records on that link with the same side"
  precision: "share of the system's for/against records that Argon calls for/against with the same side"
  side: "agreement on for vs against among pairs both call for/against"
  quote: "share of the system's records whose quote is contiguous and verbatim in the abstract (code check)"
  fields: "agreement on design, n_total, comparison; weighted kappa on intervention_match (exact > class > category > other)"
  consensus: "share of Argon's background_or_consensus pairs the system turned into a record (lower is better)"
  alternatives: "precision on alternative links with distinguishing_part_shown required"
  argon_retest: "agreement of Argon's pack 16 with its pack 9 answer on the 2 repeated links (finding per pair, kappa)"
thresholds:   # written before the run
  report: "every metric with its interval, overall and by stratum, holdout separately"
  ours_better: "for each of ours_v9 and ours_v13, the paired difference ours - baseline_a in recall or precision has a 95% interval above 0 without the other below -0.05"
  gold_usable: "argon_retest kappa >= 0.6 on finding; if lower, the gold is noisier than the system differences it measures - report so"
cost: "pack 16 build free; dry run 2026-11-12 (scripts/reading/bench_reading.py dry): v9 about 0.046, v13 about 0.051, baseline_a about 0.044 USD off-peak (x2 at peak), about 0.14 USD in all; user's go before the run"
result:   # 2026-11-12 13:3x-14:1x UTC off-peak; scripts/reading/bench_reading.py run/score; longevity-kg reviews/argon-2026-11-12/bench_reading_*.json; 0.141 USD in all (v9 0.047, v13 0.050, base_a 0.044)
  gold: "pack 16: 94 own findings in 400 pairs (alternatives 54, outcome 23, mechanism 14, repeat 3); Argon test-retest 40/40 on the repeats"
  v9:     {recall: "20/94 = 0.21 [0.10, 0.39]", precision: "20/37 = 0.54 [0.29, 0.81]", side: 0.91, quote_verbatim: 1.0, consensus_recorded: "0.06"}
  v13:    {recall: "27/94 = 0.29 [0.15, 0.48]", precision: "27/42 = 0.64 [0.43, 0.87]", side: 0.96, quote_verbatim: 1.0, consensus_recorded: "0.04"}
  base_a: {recall: "26/94 = 0.28 [0.13, 0.42]", precision: "26/63 = 0.41 [0.19, 0.71]", side: 0.96, quote_verbatim: 1.0, consensus_recorded: "0.24"}
  paired_vs_base_a: {v9: "recall -0.06 [-0.25, 0.16], precision +0.13 [-0.21, 0.41]", v13: "recall +0.01 [-0.15, 0.21], precision +0.23 [-0.04, 0.50]"}
  by_stratum: "outcome links: v9 R 0.30 P 0.44, v13 R 0.26 P 0.46, base_a R 0.04 P 0.20; alternatives: v9 R 0.13, v13 R 0.24, base_a R 0.37 (P 0.64 / 0.76 / 0.69); mechanism: base_a P 0.17"
  holdout: "21 gold findings: v9 1, v13 2, base_a 8 recalled"
  reading: >-
    By the rule written before the run neither reader beats the baseline: no paired interval is above 0 (v13's precision
    +0.23 comes closest). Every reader misses most of Argon's findings (recall 0.21-0.29): the reader is the bottleneck, as
    packs 8 and 9 said. Our readers keep consensus phrases out (4-6% vs 24%) and are much better on the outcome link; the
    baseline is better on alternatives (it is not held to the alternative's distinguishing part, which the gold does not
    ask either for every pair) and records many mechanism pairs Argon does not (P 0.17). v13 is ahead of v9 on both
    measures. Intervals are wide: 20 links.
loss_breakdown_2026_11_14:
  run: "v13 again on the 20 links of pack 16 with every step kept (scripts/reading/bench_reading.py run --system v13_trace, then losses); 0.051 USD"
  stages: "of 94 gold findings: found 32; the filter said no 3; the reader answered none 57; the other side 2; code checks dropped 0"
  by_kind: {same_intervention_primary: "18 of 22 (0.82)", same_class_or_category_primary: "4 of 23 (0.17)", review_or_meta_analysis: "7 of 26 (0.27)", alternative_without_distinguishing_part: "3 of 23"}
  rule_consistent_recall: >-
    a finding for a competing explanation counts only when it shows the part that differs from the hypothesis (method rule);
    the gold marks 23 findings for alternatives with distinguishing_part_shown false: without them the recall of v13 is
    29 of 71 = 0.41. Reported next to the recall of the original definition from now on; the pass rules stay as written.
  files: "longevity-kg reviews/argon-2026-11-12/bench_reading_v13_trace.json, bench_reading_losses.json"
reader_v14_2026_11_14:
  what: "verify_claim/v14 = v13 with two rules put first, with examples: a result for an intervention of the same kind is 'for' or 'against' with intervention_match class; a meta-analysis or systematic review that states its own pooled result is a finding. Each paper's answer also names its intervention match and, for 'none', a reason. The same filter, batches and model (DeepSeek V4.1 Flash) as v13"
  run: "bench_reading run --system v14 on the 20 links of pack 16, every step kept; about 0.05 USD"
  noise: "two runs of v13 gave recall 0.287 and 0.340, precision 0.643 and 0.640: run-to-run difference about 0.05"
  pass_rule: "v14 replaces v13 as the reader to be proposed for the working config when its recall is at least 0.39 (the higher v13 run + 0.05) and its precision at least 0.59 (the lower v13 run - 0.05); the holdout links (4) and the recall by kind (same class, review or meta-analysis, same intervention) and by the method's alternative rule are reported, not tested"
  result_2026_11_14:
    cost: "0.066 USD by the run's tokens (about 0.05 named)"
    recall: "0.628 (59 of 94); v13 0.287 and 0.340"
    precision: "0.573 (59 of 103 records); v13 0.643 and 0.640"
    holdout: "recall 0.90 (19 of 21), precision 0.53; v13 0.10 and 0.19"
    by_kind: {same_intervention_primary: "20 of 22 (v13 18)", same_class_primary: "9 of 23 (v13 4)", review_or_meta_analysis: "19 of 26 (v13 7)", alternative_without_distinguishing_part: "11 of 23 (v13 3)"}
    by_the_alternative_rule: "48 of 71 = 0.68 (v13 0.41)"
    side: "0.91 (v13 0.94)"
    wrong_records: "44 of 103: on another outcome (gold none, other_outcome) 21, another intervention (other_intervention) 15, the other side 6, background 2; v13: 18 of 50"
    by_the_rule: "not passed: recall 0.628 >= 0.39, but precision 0.573 < 0.59. v14 is not proposed for the working config; the loss is mostly records on another outcome than the claim's"
reader_v15_2026_11_15:
  what: "verify_claim/v15 = v14 with three rules first: the outcome must be the claim's own (a related outcome is none); the same kind of intervention counts and another kind does not, with examples of the boundary; a meta-analysis's pooled result on the claim's outcome is a finding"
  why: "v14: 21 of its 44 wrong records were on another outcome than the claim's, 15 on an intervention the gold calls another"
  run: "bench_reading run --system v15 on the 20 links of pack 16, every step kept; about 0.07 USD"
  pass_rule: "as for v14, written before this run: recall at least 0.39 and precision at least 0.59; holdout, recall by kind and by the alternative rule reported, not tested"
  result_2026_11_15:
    cost: "0.060 USD by the run's tokens"
    recall: "0.383 (36 of 94); v14 0.628, v13 0.287 / 0.340"
    precision: "0.783 (36 of 46 records); v14 0.573, v13 0.64"
    holdout: "recall 0.48, precision 1.0"
    by_kind: {same_intervention_primary: "15 of 22 (v14 20)", same_class_primary: "5 of 23 (v14 9)", review_or_meta_analysis: "13 of 26 (v14 19)", alternative_without_distinguishing_part: "2 of 23"}
    by_the_alternative_rule: "33 of 71 = 0.46 (v14 0.68, v13 0.41)"
    lost_against_v14: "25 findings v14 had: 16 the reader called none on an intervention the gold calls the same class, 3 on the same intervention (the strict outcome), 4 the class wrongly given"
    by_the_rule: "not passed: precision 0.783 >= 0.59, recall 0.383 < 0.39 (by 0.007, inside the run-to-run noise of about 0.05). The 'another kind is none' examples cut the class findings the gold keeps"
reader_v16_2026_11_15:
  what: "verify_claim/v16 = v14 (the same-kind rule without v15's 'another kind' examples, the meta-analysis rule) plus a first rule on the outcome: the claim's own or a narrower measure of it; a broader or another outcome is none (the matching rule of the paper skeleton)"
  why: "v14 lost precision mostly on records about another outcome (21 of 44); v15's class examples cut 16 findings the gold keeps"
  run: "two runs on the 20 links of pack 16 (bench_reading run --system v16 and v16_2), every step kept; about 0.14 USD"
  pass_rule: "written before the runs: the mean of the two runs has recall at least 0.39 and precision at least 0.59; each run and their difference reported; holdout, recall by kind and by the alternative rule reported, not tested"

