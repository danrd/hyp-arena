    matched: [r5]
    first_run: {gold: against, reader: for, skeleton: against}
    population: postmenopausal women with low bone mass
    contrast: "Squat maximal strength training and exercise-guideline control. The abstract reports a post-training trend without identifying the statistical contrast for the ratio. Clear the asserted between_groups comparison."
    observations:
      r5: {outcome: serum P1NP/CTX ratio, time: 12 weeks, result: upward trend, p: '0.09', magnitude: null}
    link_scope: "Both methods cite the same sentence. No age, obesity or metabolic-risk interaction estimate is provided. Retain the descriptive trend; withhold a direct modifier edge regardless of the benchmark stance."
