id: skeleton-row-audit-2026-11-21
scope: "Development review by Codex using frozen paper snapshots. Unit of sampling is a positive claim–PMID pair, not a prediction or an individual row. Not blinded or independently adjudicated."
selection: "Packs 16 and 25, one pair per pack and quote-match count (0, 1, 2+), using the frozen replay's attach rule with the gold quote. First archived run. Prefer reader-only, skeleton-only, reader-only winners for pack 16 and the inverse for pack 25. Within each stratum select lowest SHA256 of UTF-8 pack/rid/pmid."
interpretation: "Rows below are source-backed observations after the specified field corrections or additions. Link scope is reviewed separately. Where a paper reports only a p value, effect magnitude stays unknown. Multiple outcomes of one paper share provenance."
cases:
  - pack: 16
    rid: R17
    pmid: '12588571'
    extraction_id: c955b89d8527dc991c5c69bfa3e98b8b2085e0e55a62759a53186449feccbc98
    matched: []
    first_run: {gold: against, reader: against, skeleton: none}
    population: frail older adults after hospital discharge
    contrast: "Factorial trial. Vitamin D vs placebo and quadriceps exercise vs matched visits. Resolve each factor separately. Four arm IDs do not describe a single combined treatment contrast."
    observations:
      r1: {outcome: physical health score, time: 3 months, result: no detected benefit, magnitude: null}
      r2: {outcome: falls, time: 6 months, result: no detected benefit, magnitude: null}
    link_scope: "Supports a scoped negative result for these interventions and endpoints. Gold quotes the conclusion while the rows quote Results. RR 3.6 in r3 belongs to injury and must not populate either primary outcome."
