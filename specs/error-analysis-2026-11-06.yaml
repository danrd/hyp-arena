id: error-analysis-2026-11-06
written_on: '2026-11-06'
status: exploration (no decision rule)
why: >-
  user question 2026-11-06 "what would AUC 0.65 give us, where can we improve": compare P with simple baselines, the
  outcome link alone (does the mechanism add anything) and read the errors, on the calibration samples (steps 1-5)
caution: >-
  these samples were used to build v3 / v3.1 / v3.2; nothing here is a test. A change suggested here is written as a rule
  and tested on the frozen benchmark (237 hypotheses, thresholds set before)
script: scripts/error_analysis.py (no model calls; PubMed counts cached)
result:
  units: 74 (63 scored; 11 not: unparsed / needs_refinement, all from the older normaliser of steps 1-3)
  labels_scored: {positive: 30, null: 33}
  auc:
    P_v32_fold: 0.624
    outcome_link_alone: 0.579
    support_F_of_the_outcome_link: 0.454
    usable_records_on_the_outcome: 0.391
    usable_records_whole_chain: 0.328
    literature_volume_on_the_intervention_log: '0.437 (46 units; median 98 papers before T for positives, 585 for nulls)'
    trend_of_attention: '0.563 (45 units)'
    I: 0.510
    less_evidence_against_on_the_outcome: 0.634
    any_record_against_on_the_outcome: '0.627 (21 units, 15 of them null)'
  by_mechanism:
    outcome_only: {n: 45, positive: 24, P_auc: 0.654}
    mechanism_written: {n: 18, positive: 6, P_auc: 0.306}
  reading:
  - the signal of P comes from evidence against the outcome, not from support; support does not separate (trials are run
    where support exists, so positives and nulls both have it), and better-studied interventions are more often null
  - links without any record sit at S 0.5 and multiply P down, so a hypothesis that writes out its mechanism is penalised
    for it; among the 18 with a mechanism P orders the trials backwards (small n)
  - positives have no outcome record more often (14 vs 9): the verifier's recall and the novelty of the intervention
  candidate_rule_posthoc: >-
    links without any usable record do not count in P (S 1 instead of 0.5 in the product): 0.662 vs 0.624 on the same 63
    units. Found here, so not evidence; to be registered as a secondary score for the benchmark before its run

# Addition (same day): rerun of all 74 calibration units under normalize v10, scored by v3.3 (fold + neutral unverified),
# `python -m scripts.error_analysis --v33` -> calibration/error_analysis_v33.json. Exploration only: these samples were used
# to build v3.3, so nothing here is a test; the benchmark is the test.
v33_result:
  scored: 73          # of 74; positives 37, nulls 36
  auc:
    P_v33: 0.600
    P_v32_fold_earlier_63_units: 0.624   # different run (v3 cards, 63 scored), not a paired comparison
    support_share: 0.539
    S_outcome_alone: 0.614
    literature_volume_log: 0.409         # still inverse
    mechanism_written: 0.373             # still inverse: written mechanisms go with nulls (13 of 17 with mechanism are null)
    trend_pubmed: 0.540
    I: 0.435
  by_mechanism: {with_mechanism: {n: 17, pos: 4, P_auc: 0.462}, outcome_only: {n: 56, pos: 33, P_auc: 0.656}}
  reading: >-
    v3.3 does not raise the separation on the calibration units (0.60, inside the noise of n=73). The chain still hurts:
    with a mechanism written P orders the trials at chance; P works only through the outcome link. support_share alone
    is weak (0.54). The benchmark pre-registration should therefore keep, as secondary, the outcome link alone and P v3.2.

# Addition 2026-11-07: ceiling analysis (scripts/ceiling.py -> calibration/ceiling.json), free, exploration only. Design of each
# trial from ClinicalTrials.gov (64 of 72 units with an NCT id).
ceiling_2026_11_07:
  single_auc: {P_v34: 0.584, outcome_link: 0.603, support_share: 0.535, masking: 0.377, placebo_or_sham: 0.371,
               randomised: 0.488, log_enrollment_after: 0.403, endpoint_category: 0.478, n_primary_outcomes: 0.562}
  P_v34_bootstrap_95: [0.472, 0.699]
  cv_models_5fold_x40: {P: 0.58, outcome_link: 0.603, design_known_before: 0.506, design_plus_P: 0.49}
  by_blinding:
    blinded_masking_ge_2: {n: 29, positives: 11, P: 0.593, outcome_link: 0.631}
    open_or_single_blind: {n: 35, positives: 22, P: 0.563, outcome_link: 0.587}
    placebo_or_sham: {n: 20, positives: 6, P: 0.607, outcome_link: 0.75}
    no_placebo_or_sham: {n: 42, positives: 25, P: 0.534, outcome_link: 0.529}
  reading: >-
    No feature, design included, orders the trials much better than 0.6: the label is hard. Open and sham-free trials are
    positive far more often (63% vs 38% for blinded), so in them "positive" partly measures the room for bias, not the truth of
    the mechanism; within placebo or sham trials the outcome link reaches 0.75 (n 20, very uncertain). The benchmark
    pre-registration should stratify by blinding and placebo (or make the blinded subset primary).
