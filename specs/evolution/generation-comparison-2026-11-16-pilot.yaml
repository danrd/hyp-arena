id: generation-comparison-2026-11-16-pilot
written_on: 2026-11-16
status: tasks built and sent to the outside model; nothing judged, nothing run by our pipeline
parent: specs/evolution/generation-comparison-2026-11-14.yaml (definitions kept unless changed here)
why: >-
  A rough first look at the whole approach before the full comparison: does structured generation by the manual (B) give
  hypotheses that the method and a judge rate above those of a plain request (A)? Not a test with a pass rule: a pilot of 5
  hypotheses per arm says only whether the approach is worth the full run.
topic: "as in the parent: bioelectric signalling in ageing"
as_of: 2026-11-16
arms:   # B = A + our card specification: the prompts differ only by the structure, nothing about scoring or what the method values
  A: "plain request in a new chat (task_a.json): claim, rationale, experiment, the papers it relies on"
  B: "A's exact request plus a structured card (intervention, population, mechanism as links, outcome, decisive experiment); no manual, no scoring; task_b.json. Both A and B ask for references the same way, so fabricated-reference rate is comparable"
  BS: "A's exact request plus both blocks joined (scripts/argon/generation_tasks.py, participant bs): one introduction, the card, a check written against the card's links (evidence before T for and against each link, evidence against the whole, other explanations and how the decisive experiment tells them apart, already tested before T, the nearest decisive experiment), one closing line; no manual, no scoring; task_bs.json. Differs from B by the check only"
writer: "Argon (Google family)"
revision_2026_11_16: >-
  the first B task (task_b with the full manual and a hint of what the method values) was replaced before scoring: the user
  asked that B differ from A only by our specification. The first B answer is kept as answer_b_manual_v1.json (a separate
  data point, B with the full manual); the scored B is the new task. A is unchanged, its answer kept
revision_2026_11_16_bs: >-
  participant BS added before any scoring (user's decision): the generation tasks became the base request plus blocks
  (card; steps), and the user chose to start the comparison of blocks with BS. S (base + steps alone) is defined in the code
  and not sent in this pilot. Like the rest of the pilot, no pass rule: a first look
revision_2026_11_16_regenerate: >-
  before any scoring, A and BS are generated again (user's decision: regenerate when in doubt, a chat is cheaper than a
  wasted paid check). Two differences besides the blocks were found in the first pair: the line "the hypotheses must be
  different ideas" was in the blocks, so BS had it and A did not; and the cover text sent with the task differed. Now the
  line is in the base request (every participant has it) and the cover text is one constant (generation_tasks.COVER), sent
  in a new chat with the same model and settings for each. B is dropped from the pilot (user's decision): the pilot compares
  A and BS. The first pair is kept as task/answer/check_a_v1 and _bs_v1 (a separate point: its reference counts are not
  compared with the new pair)
revision_2026_11_16_humans: >-
  before the third generation (user's decision): the base request now says that each hypothesis is about people (older
  adults, or people at risk of an age-related loss of function), while the experiment that tests it may be in any system.
  Reason: the species of the population moves the scores by itself (the novelty level, translation to another species; the
  weight of animal records for a human outcome; feasibility), so a comparison of generation would partly measure the choice
  of species; in the second pair, by the cards of our pipeline, A had 3 human and 2 mouse populations. Fair for scoring a
  given hypothesis, unfair for comparing writers. Code reports the number of hypotheses whose population (our pipeline's
  card) is not human; scoring separately by species groups is left for the full comparison and the hypothesis database.
  The second pair is kept as *_a_v2 / *_bs_v2 with its scores (a point without the constraint)
steps:
  1: "Argon writes A and BS (5 each, new chats, the same cover text); code checks the answers (PMIDs exist, before T, titles match; card fields filled; for BS also the check filled and every check step naming a link of the card)"
  2: "our pipeline scores the 10 texts (card, search before T, reading, alternatives, the v3.11 rules, ASPID): paid, priced by a dry run, user's go"
  3: "Argon scores the same 10 by the manual (a reports task) and evolves them toward novelty (directed evolution, frontier target)"
  4: "later: pairwise judges with one question, which hypothesis to investigate first, in the sense of the Bio Arena judge (mechanistic plausibility, evidence for and against, potential benefit to human healthy lifespan, the nearest convincing experiment); novelty is not asked of judges, it is measured by code (already tested before T by PubMed)"
judging_change_from_parent: >-
  the five-criterion rubric of the parent is replaced by the single Bio Arena question (one overall choice, both orders,
  judge families other than the writer's); its wording is paraphrased here, the judge text used for calls is kept in the
  private repository
reported:
  - "per arm: the scores of our pipeline (balance, coverage, N, I, W, feasibility, the three profiles), the share of hypotheses already tested before T, references that exist and match, duplicates"
  - "per hypothesis: our scores against Argon's scores by the manual (the chat model running the manual against our code)"
  - "per evolved version: the change of N and of the other axes, with the rules of section 11 checked"
judges_2026_11_17:   # written before the judges' run
  pair: "BS against A: the 25 cross pairs of the third pair (hypotheses about people), each in both orders"
  question: >-
    hyparena/prompts/judge_pair/v2: which hypothesis to investigate first, weighing the plausibility of the mechanism, the
    evidence for and against it, the benefit a confirmation could bring to healthy lifespan in people, and how near and
    convincing the testing experiment is; novelty is not asked (code measures it); no rubric. Our own wording of the
    Bio Arena judge question
  judges: "six families other than the writer's (google) and the rewriter's (xiaomi): gpt-5-nano, claude-haiku-4-5, grok-4.3, deepseek-v4.1-flash, qwen3.8-flash, glm-5.3-flash; the texts rewritten into one form by mimo-v2.5 (claim, rationale, experiment; references removed)"
  measures: "share of pairs BS wins (both orders agree; else half), with a bootstrap interval over pairs and judges; the share per judge family; the judges' order of the 10 hypotheses against our pipeline's ASPID scores and against Argon's"
  rule: "no pass rule (a pilot): the result says only whether the full comparison is worth running"
  price: "dry run 0.26 USD (300 judgements, 10 rewrites)"
judges_revision_2026_11_17:   # before any judgement was made
  rewriting: >-
    dropped (user's decision): the texts are judged as written (claim, rationale, experiment), references cut by code
    (scripts/evolution/generation_compare.py unreferenced: 49 cut; two narrative author mentions in BS4 kept, a drug code is
    not a reference). Why: both arms are written by one model and judged by other families, so self-preference does not
    separate them; lengths are close (A 3426-3915 characters, BS 3460-4451); a rewriter adds its own noise and would
    smooth away what the method changes. Tried before the decision: the cheap rewriters did not keep the length limit or did
    not answer (mimo, qwen) and the fallback cut texts mid-sentence; those rewrites are kept apart, never judged
  length_check: "Spearman of the pair outcome and the length difference of the two texts, reported with the win share"
  judges: "gpt-5-nano, claude-haiku-4-5, grok-4.3, deepseek-v4.1-flash, qwen3.8-flash, mimo-v2.6 (xiaomi judges, as nothing is rewritten); glm-5.3-flash off: no answer on the judge prompt"
  price: "dry run 0.43 USD (300 judgements)"
  for_later: "equal length is set at generation: a maximum length in the base request, the same for every participant (next generation round)"
judges_result_2026_11_17:
  run: "300 judgements, 9 failed (all qwen); 143 pair outcomes of 6 judges on 25 pairs; cost about 0.43 USD by the dry run"
  BS_over_A: "win share 0.71 [0.457, 0.907] (both orders agree, else half; 39 of 143 outcomes undecided between the orders)"
  per_judge: {gpt-5-nano: 0.70, claude-haiku-4-5: 0.58, grok-4.3: 0.68, deepseek-v4.1-flash: 0.70, qwen3.8-flash: 0.81, mimo: 0.82}
  per_hypothesis_win_share: {BS4: 0.85, BS3: 0.84, BS2: 0.78, BS1: 0.78, A4: 0.50, A3: 0.45, A1: 0.28, BS5: 0.26, A5: 0.16, A2: 0.07}
  length: "BS texts 3925 characters on average, A 3609; Spearman of the pair outcome and the length difference -0.08: the longer text is not preferred"
  reading: >-
    every judge family prefers BS, 4 of the 5 BS hypotheses rank above every A; the interval is wide (25 pairs) and
    crosses 0.5 at its lower end. A pilot without a pass rule: the direction is consistent, a conclusion needs the full
    comparison (several topics, about 20 hypotheses per participant). Novelty is not in this result (judges were not asked;
    the pipeline scoring was not run, user's decision)
round_4_2026_11_17:   # written before the tasks were sent
  why: >-
    the generation is moving to free chats (user's decision: no API cost), where a safety filter interrupted generation on
    this topic (bioelectricity draws on ion-channel toxins). The base request gets three lines, the same for every
    participant: a frame (a research benchmark on ageing and healthy lifespan), one excluded kind of intervention (natural
    toxins or venoms, pathogens, agents that harm people by design: user's choice A, the least narrowing; nothing about
    experiments) and a length (claim, rationale and experiment together at most 4000 characters, the length of the third
    pair). Constants GUARD and MAX_CHARS in scripts/argon/generation_tasks.py
  tasks: "longevity-kg reviews/generation-2026-11-17/: task_a (with the lines), task_a_noguard (the earlier base, control), task_bs (with the lines); T 2026-11-17; same topic"
  check_narrowing: >-
    A with the lines against A without, each in a new chat: the number of refusals, distinct interventions and outcomes
    (code, from the texts), intervention kinds, references real and before T; the lines stay if the ideas are not fewer
    and not narrower (judged by these counts, no pass threshold: a first look)
  check_filter: "refusals or interrupted answers per task are recorded (a refusal is data); a refused task is repeated once in a new chat"
round_4_topic_change_2026_11_17:   # before the new tasks were sent
  why: "both A tasks on bioelectricity stopped in the chat (with and without the guard lines): the topic triggers the filter (refusals.md)"
  topic: "repurposing approved drugs to delay age-related multimorbidity, frailty and loss of function in older adults (user's choice among four)"
  tasks: "task_a, task_a_noguard, task_bs rebuilt on this topic, T 2026-11-17; the bioelectricity tasks kept as *_bioelectric.json"
  measures: "as round_4_2026_11_17 (refusals, diversity with and without the guard lines, references); then the judges"
round_5_api_2026_11_17:   # written before the calls
  writer: "GPT-6.1 Sol (OpenAI family) through the provider's Responses endpoint with its web search tool (scripts/evolution/generate_api.py); the probe gave the right PMID of a known trial for 0.027 USD (longevity-kg reviews/generation-2026-11-17/websearch_probe.json)"
  tasks: "task_a and task_bs of round 4 unchanged (topic: repurposing approved drugs against multimorbidity, frailty and loss of function; T 2026-11-17; the guard lines; at most 4000 characters), copied to longevity-kg reviews/generation-2026-11-17-sol/; one line added to both for the API: web search may be used to find and check papers, and only papers published on or before T are cited"
  calls: "one call per participant (5 hypotheses each), reasoning effort medium, at most 25 tool calls and 32000 output tokens per call; a cost cap of 2 USD for the two calls together (the second call is not made if the first passes 1 USD)"
  privacy: "the answers are written to files by code and are not read into the assistant's context; only counts and code checks are reported"
  checks: "generation_tasks check --kind a and --kind bs (references exist, published before T, titles match; card and check filled for BS); length per hypothesis"
  judges: "next: pairwise judges with the reason field, families other than OpenAI (gpt-5-nano out, Gemini in); Argon judges in a separate chat; Argon scores by the manual with records extracted and numbers computed by our code (variant c)"
round_5_first_attempt_2026_11_17:
  what: "the first call (task_a) ended with the server closing the connection without a response (httpx RemoteProtocolError, after several minutes); no answer was written and the second call was not made"
  cost: "unknown: the reply carried no usage block; the provider's running total (dashboard/billing/usage) read after it, 24755.5086 at 11:58 UTC, is the reference for the next calls; whether the cut call was billed cannot be told from it"
  fix: "the call is streamed (the events keep the connection open; the final event carries the whole response) and the provider's running total is read before and after every run (scripts/evolution/generate_api.py)"
round_5_second_attempt_2026_11_17:
  a: "streamed; failed after 86 s and 5 searches: rate_limit_exceeded (the upstream's token rate limit for the model in its region); no answer"
  bs: "streamed; failed after 451 s: upstream_stream_total_timeout (the provider stops a stream at 450 s); no answer"
  cost: "no usage block in either reply; the provider's running total did not change (24755.5086 before, after and at 12:09 UTC): either failed calls are not billed or the total lags; the code's estimate is 0.05 USD (the 5 searches)"
  next: "user's choice: background mode with polling (no stream limit), lower reasoning effort and fewer searches, or another writer"
background_probe_2026_11_17:
  result: "the provider accepts background: true but runs the request synchronously (status completed on the first reply after 20 s, no queued state): no way around its time limits; the answer was right (PMID of the known trial), 0.036 USD by the reply's tokens"
  billing: "the provider's running total moved 24755.5086 -> 24758.1254 (+2.6168) for this call: the total counts in cents and failed calls (both of the second attempt) were not billed"
claude_web_search_probe_2026_11_17:
  result: "Claude Opus 5.5 through the provider's Messages endpoint: the reply is a client tool_use (id toolu_bdrk_...: served through AWS Bedrock), not a server search; the web search tool is passed on as an ordinary tool for the caller to run. Two short calls, 0.013 USD each by their tokens; the provider's running total had not moved when read right after"
  option: "run the search ourselves: a PubMed search tool (E-utilities, papers up to T only, titles, years and PMIDs) executed by our code in a tool loop, the same for A and BS"
qwen4_max_probe_2026_11_17:
  result: "Qwen4 Max (1.5 / 4.5 USD per million tokens, no web search price listed): through the Responses endpoint with the web search tool it searched and gave the right PMID of the known trial (26 s, about 0.005 USD by the tokens); through the chat endpoint with enable_search it spent the whole 1500-token budget on reasoning (no answer, inconclusive); with an ordinary function tool it made no tool call"
round_5_writer_qwen_2026_11_17:   # written before the calls
  writer: "Qwen4 Max (qwen family) through the Responses endpoint with web search, streamed (scripts/evolution/generate_api.py --model qwen4-max); the same tasks task_a and task_bs with the same API line, copied to longevity-kg reviews/generation-2026-11-17-qwen/"
  calls: "one call per participant, at most 25 tool calls and 32000 output tokens, 60 s pause between the calls; cap 2 USD"
  judges: "the qwen judge is dropped (writer's family); gpt-5-nano is back; Google in (configs/judges-generation-r5.yaml)"
novelty_by_absence_2026_11_17:   # written before the calls
  what: "the third pair (Argon wrote A and BS, hypotheses about people): novelty by absence in PubMed, counted by code, for every hypothesis the same way"
  cards: "one card per hypothesis from claim, rationale and experiment only (the participant's own card is not used), by the pipeline's normaliser (normalize_card/v17, one parse, configs/v3-flash-n10.yaml); the normaliser is of the Google family, as the writer (an extraction, not a judgement); about 0.3 USD; cards kept private, nothing of them read into the assistant's context"
  counts: "rule 6 of the manual (hyparena/evolution/evolution_rules.pubmed_pair_count): PubMed records published on or before T with both labels, no third term, labels of more than 4 content words not counted. Outcome pair: the card's main intervention with its outcome metric; mechanism pairs: subject and object of every chain link before the outcome"
  measures: "per arm: median count on the outcome pair; share of hypotheses whose outcome pair has fewer than 5 records (untested by this measure); share with at least one mechanism link under 5; labels not counted, reported"
  reading: "a coarse measure that depends on the wording of the labels; the novelty level N of the manual needs reading (the pipeline). No pass rule: a pilot"
novelty_by_absence_result_2026_11_17:
  cost: "0.56 USD by the call log (26 normaliser calls for 10 cards: the code checks sent parses back for repair), above the 0.3 named"
  cards: "10 of 10"
  result: "outcome pair counted for 1 of 5 A and 2 of 5 BS (the others: a label of more than 4 content words, not counted by rule 6); every counted pair 0 records before T; a mechanism link under 5 records in 2 of 5 for both arms"
  reading: "uninformative: the card's outcome metrics are phrases (5-9 words), so rule 6 counts almost nothing, and the few zeros reflect wording as much as absence. Novelty here needs the pipeline's N (reading the closest prior work), or short canonical search terms per entity (MeSH or a two-word label) before counting"
judge_reasons_2026_11_17:   # written before the calls
  what: "the free 'reason' of each judgement of the third pair (judge_pair/v2) put by a cheap model into one of the four considerations of the judge question, so that the judgements already made say what decided them (no new judging)"
  labels: "mechanism (plausibility of the mechanism), evidence (evidence for and against), benefit (benefit to healthy lifespan in people), experiment (how near and convincing the testing experiment is), other (none of these, or several equally)"
  classifier: "deepseek-v4.1-flash, prompt classify_reason/v1, 20 reasons per call, off-peak; under 0.02 USD; the reasons are not read into the assistant's context, only counts are reported"
  measures: "per side the judgement went to (BS, A, tie): counts of each consideration; per judge family"
judge_reasons_result_2026_11_17:
  cost: "0.006 USD (15 calls)"
  counts: "291 reasons; won by BS 206: other 110, experiment 40, mechanism 31, evidence 23, benefit 2; won by A 85: other 52, benefit 17, mechanism 10, evidence 4, experiment 2"
  reading: "where a single consideration decided, BS wins on the experiment (40 to 2), the mechanism (31 to 10) and the evidence (23 to 4), A on the benefit to people (17 to 2); more than half of the reasons weigh several considerations at once (other). The judge question v3 (one deciding consideration asked of the judge itself) is the cleaner measure for the next round"
