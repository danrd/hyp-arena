id: generation-comparison-2026-11-16-pilot
written_on: 2026-11-16
status: tasks built and sent to the outside model; nothing judged, nothing run by our pipeline
parent: specs/evolution/generation-comparison-2026-11-14.yaml (definitions kept unless changed here)
why: >-
  A rough first look at the whole approach before the full comparison: does structured generation by the manual (B) give
  hypotheses that the method and a judge rate above those of a plain request (A)? Not a test with a pass rule: a pilot of 5
  hypotheses per arm says only whether the approach is worth the full run.
topic: "as in the parent: bioelectric signalling in ageing"
as_of: 2026-11-16
arms:   # B = A + our card specification: the prompts differ only by the structure, nothing about scoring or what the method values
  A: "plain request in a new chat (task_a.json): claim, rationale, experiment, the papers it relies on"
  B: "A's exact request plus a structured card (intervention, population, mechanism as links, outcome, decisive experiment); no manual, no scoring; task_b.json. Both A and B ask for references the same way, so fabricated-reference rate is comparable"
  BS: "A's exact request plus both blocks joined (scripts/argon/generation_tasks.py, participant bs): one introduction, the card, a check written against the card's links (evidence before T for and against each link, evidence against the whole, other explanations and how the decisive experiment tells them apart, already tested before T, the nearest decisive experiment), one closing line; no manual, no scoring; task_bs.json. Differs from B by the check only"
writer: "Argon (Google family)"
revision_2026_11_16: >-
  the first B task (task_b with the full manual and a hint of what the method values) was replaced before scoring: the user
  asked that B differ from A only by our specification. The first B answer is kept as answer_b_manual_v1.json (a separate
  data point, B with the full manual); the scored B is the new task. A is unchanged, its answer kept
revision_2026_11_16_bs: >-
  participant BS added before any scoring (user's decision): the generation tasks became the base request plus blocks
  (card; steps), and the user chose to start the comparison of blocks with BS. S (base + steps alone) is defined in the code
  and not sent in this pilot. Like the rest of the pilot, no pass rule: a first look
revision_2026_11_16_regenerate: >-
  before any scoring, A and BS are generated again (user's decision: regenerate when in doubt, a chat is cheaper than a
  wasted paid check). Two differences besides the blocks were found in the first pair: the line "the hypotheses must be
  different ideas" was in the blocks, so BS had it and A did not; and the cover text sent with the task differed. Now the
  line is in the base request (every participant has it) and the cover text is one constant (generation_tasks.COVER), sent
  in a new chat with the same model and settings for each. B is dropped from the pilot (user's decision): the pilot compares
  A and BS. The first pair is kept as task/answer/check_a_v1 and _bs_v1 (a separate point: its reference counts are not
  compared with the new pair)
revision_2026_11_16_humans: >-
  before the third generation (user's decision): the base request now says that each hypothesis is about people (older
  adults, or people at risk of an age-related loss of function), while the experiment that tests it may be in any system.
  Reason: the species of the population moves the scores by itself (the novelty level, translation to another species; the
  weight of animal records for a human outcome; feasibility), so a comparison of generation would partly measure the choice
  of species; in the second pair, by the cards of our pipeline, A had 3 human and 2 mouse populations. Fair for scoring a
  given hypothesis, unfair for comparing writers. Code reports the number of hypotheses whose population (our pipeline's
  card) is not human; scoring separately by species groups is left for the full comparison and the hypothesis database.
  The second pair is kept as *_a_v2 / *_bs_v2 with its scores (a point without the constraint)
steps:
  1: "Argon writes A and BS (5 each, new chats, the same cover text); code checks the answers (PMIDs exist, before T, titles match; card fields filled; for BS also the check filled and every check step naming a link of the card)"
  2: "our pipeline scores the 10 texts (card, search before T, reading, alternatives, the v3.11 rules, ASPID): paid, priced by a dry run, user's go"
  3: "Argon scores the same 10 by the manual (a reports task) and evolves them toward novelty (directed evolution, frontier target)"
  4: "later: pairwise judges with one question, which hypothesis to investigate first, in the sense of the Bio Arena judge (mechanistic plausibility, evidence for and against, potential benefit to human healthy lifespan, the nearest convincing experiment); novelty is not asked of judges, it is measured by code (already tested before T by PubMed)"
judging_change_from_parent: >-
  the five-criterion rubric of the parent is replaced by the single Bio Arena question (one overall choice, both orders,
  judge families other than the writer's); its wording is paraphrased here, the judge text used for calls is kept in the
  private repository
reported:
  - "per arm: the scores of our pipeline (balance, coverage, N, I, W, feasibility, the three profiles), the share of hypotheses already tested before T, references that exist and match, duplicates"
  - "per hypothesis: our scores against Argon's scores by the manual (the chat model running the manual against our code)"
  - "per evolved version: the change of N and of the other axes, with the rules of section 11 checked"
judges_2026_11_17:   # written before the judges' run
  pair: "BS against A: the 25 cross pairs of the third pair (hypotheses about people), each in both orders"
  question: >-
    hyparena/prompts/judge_pair/v2: which hypothesis to investigate first, weighing the plausibility of the mechanism, the
    evidence for and against it, the benefit a confirmation could bring to healthy lifespan in people, and how near and
    convincing the testing experiment is; novelty is not asked (code measures it); no rubric. Our own wording of the
    Bio Arena judge question
  judges: "six families other than the writer's (google) and the rewriter's (xiaomi): gpt-5-nano, claude-haiku-4-5, grok-4.3, deepseek-v4.1-flash, qwen3.8-flash, glm-5.3-flash; the texts rewritten into one form by mimo-v2.5 (claim, rationale, experiment; references removed)"
  measures: "share of pairs BS wins (both orders agree; else half), with a bootstrap interval over pairs and judges; the share per judge family; the judges' order of the 10 hypotheses against our pipeline's ASPID scores and against Argon's"
  rule: "no pass rule (a pilot): the result says only whether the full comparison is worth running"
  price: "dry run 0.26 USD (300 judgements, 10 rewrites)"
