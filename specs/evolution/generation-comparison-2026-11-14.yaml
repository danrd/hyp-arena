id: generation-comparison-2026-11-14
written_on: 2026-11-14
status: "definitions and pass rules fixed before any hypothesis is generated or judged; the tasks, the answer checks and the comparison are built (2026-11-14), no judge called; on hold: no generation until the whole system is debugged"
level: "4 of the system checks (docs/system/testing.md): generation of hypotheses; manual docs/system/generation-arena.md"
why: >-
  Does the system write better research hypotheses on a topic than an LLM asked in a chat, and does the system's evolution
  make them better still, its own and another writer's? The comparison runs every stage at once on texts the system has not
  seen, so it is also the main check of the whole system while it is being debugged, and later the basis of showing it.

topic:
  first_run: >-
    bioelectric signalling in ageing: membrane potential, ion channels, gap junctions and endogenous electric fields as a
    lever on ageing and on age-related loss of function
  as_of: "the date of the run (T); no outcome exists, so the measures are judges and code checks, not outcomes"
n_per_arm: 5

execution: >-
  every arm is the same outside model (Argon, a Gemini model, or ChatGPT) working in a chat; the steps of the method
  (generation, card, search, reading, alternatives, scoring, evolution, report) are done by that model following
  docs/method-v3-manual.md, not by our code with its own reader model. The arms then differ only by the method (without the
  manual: A; with it: B, C, D), so the method cannot lose by a weaker reader or another model, and the chats cost nothing.
  Our code does only what does not depend on the model: checks the answers (references, verbatim quotes, format), puts the
  texts into one form, calls the judges and computes the result. Each arm is a new chat, without earlier answers in context.
writer_family: "google if Argon, openai if ChatGPT; the same for all arms"

arms:
  A: {does: "writes the hypotheses", gets: "the topic and a plain request: n hypotheses, each with a claim, a rationale, an experiment and the papers it relies on"}
  B: {does: "writes the hypotheses in the structured generation mode (by the card's fields), then goes through every step of the method by the manual", gets: "the topic, T, the manual, the card template"}
  C: {does: "free evolution of the hypotheses of B by the manual (anything may change for a better hypothesis), then every step of the method again", gets: "the hypotheses of B and their reports"}
  D: {does: "the same free evolution of the hypotheses of A", gets: "the hypotheses of A and their reports"}
  E: "a Co-Scientist-style generator (tournament from the v2 code): deferred"
  reports_for_A: "the hypotheses of A go through every step of the method by the manual in a separate chat, after they are written"

formatting:   # one form for every text the judges see
  template: "claim; rationale; decisive experiment; at most 1 200 characters; no references, no names of models or of the method"
  rewriter: "a model of a family that neither wrote nor judges (xiaomi MiMo), prompt format_hypothesis/v1"
  meaning_check: "by code: the intervention, the outcome and the experiment's system and endpoint of the card of the original are found in the rewritten text; a failure is rewritten once, then the original text is shortened by hand rule (first sentences of each part) and marked"
  references: "removed from what judges see; checked by code (below)"

judges:
  pool: [openai, anthropic, google, xai, deepseek, qwen, zhipu, muse]   # zhipu: GLM
  excluded: "the writer's family (google if Argon writes, openai if ChatGPT) and the family that rewrote the texts"
  used: "the rest of the pool: with Argon openai, anthropic, xai, deepseek, qwen, zhipu (GLM), muse if available"
  models: "named with prices before the run"
  blind: "a judge does not know who wrote a text"
  order: "every pair judged twice, both orders; two different answers count as a tie"
  pairwise:
    prompt: judge_pair/v1
    asks: "which of the two is the stronger research hypothesis on ageing, per criterion and overall, with a one-sentence reason"
    pairs: {B_vs_A: 25, C_vs_A: 25, C_vs_B: "5 (parent and its version)", D_vs_A: "5 (parent and its version)"}
  rubric:
    prompt: judge_rubric/v1
    asks: "each text alone, 1-10 per criterion"
  criteria:
    novelty: "not already in the literature; how far from what is known"
    grounding: "consistent with known biology; the mechanism is plausible"
    testability: "the experiment separates the hypothesis from its alternatives and can be done"
    specificity: "intervention, population, outcome and mechanism links are named"
    significance: "what a confirmation would mean for ageing and healthy lifespan"

code_checks:   # independent of any judge
  references: "per arm: the share of cited papers that exist in PubMed, were published before T and match by title"
  quotes: "per report: the share of records whose quote is verbatim in the abstract of the named paper (as the check of earlier reports by the manual)"
  novelty: "per hypothesis: the nearest prior work and the novelty level from the report by the manual, its PMIDs checked by code"
  support: "per hypothesis: links of the mechanism with checked records, and their side"
  diversity: "per arm: duplicate and variant pairs (typed proximity), distinct interventions and outcomes"

reports:
  per_hypothesis: "the full report of the method for all 20 hypotheses, those of A included, made by the manual and checked by code"
  tabs: "judges (scores and reasons), comparison (arms side by side, results by pair), evolution (what changed from parent to version, by improvement item), references (the check by arm)"
  showcase_page: "not now (debugging first)"

measures:
  win_share: "(wins + ties / 2) / judgements of X against Y, pooled over judges and both orders"
  interval: "95% bootstrap over hypotheses (resampling the hypotheses of each arm)"
  per_family: "the same win share for each judge family alone"
  rubric: "mean score per criterion and arm, with the same bootstrap"

pass_rule:   # written before the run
  win: "X beats Y when its win share is above 0.5 and above 0.5 for a majority of judge families taken alone"
  tested: {generation: "B over A", evolution_own: "C over B (pairs of parent and version)", evolution_other: "D over A (pairs of parent and version)"}
  reported_not_tested: "C over A; the rubric means; the code checks"
  pilot: >-
    with 5 hypotheses per arm the interval is about +-0.2, so the first run is a pilot: a win is a reason to widen the
    comparison, not a conclusion; the claim "the system writes better hypotheses" needs the lower bound of the interval
    above 0.5 over several topics (about 20 hypotheses per arm), under a new spec

cost_estimate_usd:
  chats: "0 (generation, steps of the method, evolution and reports are chats of the outside model)"
  formatting: "below 0.05"
  judges_cheap: "about 1.1 for four cheap models (about 140 judgements each, about 2 000 tokens in and 300 out)"
  judges_strong: "about 5-10 for four stronger models; priced from the provider's list before the run"
  total: "1-10; named exactly by a dry run before the user's go"

limits:
  - "a judge's preference is not truth: the judges measure how strong a hypothesis looks to models; truth is level 3"
  - "the plain request to A and the template of B differ by design: A is the way most people would ask; our structure is part of the system being tested"
  - "arm A runs in a new chat without the manual; B, C, D get it: that difference is what is tested"
  - "the method run by a chat model is the method as written in the manual, not our code: the comparison checks the manual; differences from the code are a separate finding"
  - "one topic: the result says nothing about other topics"

implementation:   # after the user's go
  - "the tasks for the outside model, built by code, each with its task text and cover note and a JSON answer format: A; B (structured generation and the steps of the method); reports for A; free evolution for C and D; the manual gets a section on structured generation in a chat"
  - "checks of the answers by code: references, verbatim quotes, format"
  - "the comparison: formatting with the meaning check, pairwise and rubric judges, win shares and intervals; prompts format_hypothesis/v1, judge_pair/v1, judge_rubric/v1; tests on the fake LLM"
  - "the report tabs"
  - "a dry run with the price; the judges after the user's go"
built_2026_11_14:
  tasks: "scripts/argon/generation_tasks.py (build-a, build-b, build-reports, build-evolve, check, collect); tasks A and B in longevity-kg reviews/generation-2026-11-14/"
  comparison: "scripts/evolution/generation_compare.py (dry, format, judge, score); configs/judges-generation.yaml; prompts format_hypothesis/v1, judge_pair/v1, judge_rubric/v1; tests/test_generation_compare.py"
  dry_run: "six cheap judges (gpt-5-nano, claude-haiku-4.5, grok-4.3, deepseek-v4.1-flash, qwen3.8-flash, glm-5.3-flash) and the rewriter mimo-v2.5: about 0.70 USD, 140 judgements per judge; muse not in the provider's catalog"
  free_evolution_goal: "a better hypothesis overall when no profile is named (manual section 11a)"

