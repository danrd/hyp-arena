id: paper-skeleton-2026-11-09
written_on: 2026-11-09
status: specification; the extraction is not run; Codex task for the code (longevity-kg reviews/codex-2026-11-09-skeleton/TASK.md)
user_decisions: >-
  2026-11-09: reading moves to the level of the paper now (the core of the knowledge graph): each paper is parsed once into a
  fixed format, as fully as possible, so that it rarely has to be read again; a link of a hypothesis takes only the part it
  needs. Storage: tables (JSONL / SQLite) in the private longevity-kg (quotes); full-text results and tables for every open
  paper; quality checked through Argon or Codex, not a second model; Codex starts at once and first lists what can be re-used.
why: >-
  outside checks put the loss in reading, not search: of Argon's key papers per link (pack 8) 19% are records on the link,
  31% were read for it with no record, 46% were read only for another link of the same trial, 5% never retrieved; reading
  every chain paper for every link (cross-link) and reader v13 raise the share only to 0.24 and 0.29; the reader skips papers
  silently (64% of the losses on pack 9) and confuses context (14 of 35 'for' records in pack 13 were about another
  intervention or population). The cause: one question mixes "what did the paper find" with "does it match this claim",
  asked per link on batches of 10-50 papers.

design:
  step_1_parse: "one call per paper, independent of any hypothesis: the paper skeleton below, every value with a verbatim quote checked by code"
  step_2_match: "a link of a hypothesis is matched to findings by code (entity ids, relation family, context rules); a model only for ambiguous pairs; the records of v3.6 are built from the matched findings, so the rules and weights do not change"
  reuse: "a parsed paper is never read again for a new link or hypothesis; a new paper adds rows; re-scoring reads only new papers"

skeleton:   # v1; extends the observation schema of KB Projects/Open Longevity/Knowledge_Graph.md 3.1 and the fields of EvidenceRecord
  paper: "pmid, doi, pub_date, publication types, title, text_used (abstract | abstract+results_excerpt), retracted, preprint"
  study:
    design: "rct | non_randomised | observational | animal | cells | review | meta_analysis | other"
    randomised: "yes | no | n/a, with quote"
    blinding: "double | single | assessor | open | not_reported"
    control: "placebo | sham | active | usual_care | no_treatment | historical | none"
    n_total: "with quote"
    duration: "as reported"
    registration: "trial ids named in the paper"
  context: "species, strain, sex, age at start, population or condition, disease model flag (with the sentence), setting"
  arms: "per arm: name, intervention entity (label + id when resolved), dose, route, regimen, co-interventions"
  outcomes: "per outcome: name, primary | secondary | exploratory, time points, measure, subjective or not"
  results:   # one row per outcome x comparison x time point x stratum: the core
    comparison: "which arms, between_groups | within_group | interaction"
    direction: "increase | decrease | no_effect | unclear (in the outcome's own terms)"
    significance: "significant | not_significant | not_tested"
    effect_reported: "verbatim (MD, RR, %, CI)"
    effect_class: "none | small | medium | large | unclear"
    stratum: "all | sex | age group | dose | post hoc subgroup (flag)"
    location: "abstract | results | table | figure"
    quote: "verbatim; code checks it in the text used"
  mechanistic_findings: "subject - relation - object in the closed vocabulary (Hypothesis_Card_Spec 5), with context and quote, role finding | background | speculation"
  meta_analysis_extra: "pooled outcome, k trials, participants, I2, GRADE certainty per outcome, risk of bias, with quotes"
  abstract_vs_results: "for each claim of the abstract's conclusion: the results row it rests on, or 'not in results' (pack 13)"
  provenance: "extractor (prompt version, model family), extracted_at, text hash"

text: "abstract + pmc.results_excerpt (Results and tables, 20 000 characters) for every open paper (about a third), else the abstract"
model: "DeepSeek (cost); quality is checked by Argon packs and by Codex reviews of samples, not by a second model (user)"

checks:   # free, by code
  quotes: "every quote verbatim in the text used; a value whose quote fails is dropped"
  consistency: "n_total within the arms' n; a 'significant' result has a p, CI or wording that says so in its quote"
  coverage: "share of papers with at least one results row; share of results rows with an effect"

evaluation:
  stage_0: >-
    the papers of the 10 links of Argon pack 9 (a per-paper gold): does the matched finding set reproduce Argon's per-paper
    findings (recall, precision, direction) against reader v13 (0.57 / 0.75) on the same papers; about 300-500 papers,
    about 0.3-0.5 USD with full texts; the exact count and price from a dry run before the call
  stage_1: >-
    the 30 trials of the cross-link pilot (3 290 distinct papers): key-paper recall of pack 8 against 0.16 / 0.24 / 0.29,
    link and trial Spearman with pack 8, context errors on the pack 13 records; about 3-5 USD; then the whole prospective
    pool (6 135 papers) and the calibration pool, R2 / R3 under the 0.03 rule
  reference_extraction: "the known-facts test (Open Genes / GenAge experiments with PMIDs, docs/backlog.md) and DrugAge rows as field-level gold (species, strain, sex, dose, direction, significance)"
  outside: "an Argon pack of 30 parsed papers (the skeleton against the paper) and a Codex review of the code and of a sample"
adopt_if: "stage 1: key-paper recall at least 0.35 and the link Spearman with pack 8 above the cross-link reading (0.29) by more than the reader noise; then R2 / R3 not worse by more than 0.03"

codex_delivery_2026_11_10: >-
  Codex delivered the inventory and the code in longevity-kg (tools/skeleton: schema, store, checks, match, backfill, eval,
  text; 47 tests) and a free evaluation of the old records converted to skeleton rows: pack 9 0 of 21 own findings, pack 8 0
  of 474 key papers. The findings graph task of 2026-11-08 was not implemented (no findings.db).

backfill_diagnosis_2026_11_10:   # free; the 21 own findings of pack 9 traced through the db
  cause: >-
    the converted rows carry no intervention per arm, no direction and almost never an outcome name (the old records were
    claim-conditioned; Codex did not infer them from the old stance, by design), and 5 of the 21 pairs have no result row at
    all. The zero is a property of the backfill, not a measure of the matcher or of a new extraction.
  matcher_risk: >-
    the code matcher accepts a result only when the arm's intervention matches the link's subject exactly (reviewed aliases)
    and the outcome name equals the link's object; 10 of the 21 own findings match the intervention only by class (a
    programme vs 'multimodal supervised exercise'), and objects such as 'cancer-related sarcopenia', 'metabolic biomarkers',
    'muscle growth' are reported as lean mass, HbA1c, muscle strength. Most true pairs of a new extraction will be ambiguous,
    so stage 0 without the ambiguous-pair model would measure the matcher's strictness, not reading.

stage_0_amended_2026_11_10:   # user decision 2026-11-10: include the ambiguous-pair model in stage 0
  parse: "one call per paper (parse_paper with the session's model callable: DeepSeek V4.1 Flash, thinking off, temperature 0, through the hyp-arena client and CometAPI), text = abstract + PMC Results and tables when open (E-utilities only, cached)"
  match: "code first (tools/skeleton/match.py, unchanged rules)"
  ambiguous_pairs: >-
    one call per link with all its ambiguous (finding, link) pairs, after the code; the model sees the link (subject,
    relation, object, stated qualifiers) and each finding row (arm intervention, outcome name and measure, direction,
    significance, context, quote) and answers per pair: intervention exact | class | other; outcome same | narrower measure
    of the object | broader | other; stance for | against | none; a one-line reason. It writes no quote and changes no
    field: a 'for' or 'against' pair becomes a record built by code from the stored row (rules unchanged; class is not
    charged as in v3.6; 'narrower measure' counts as the object, 'broader' and 'other' do not)
  measures: >-
    on the 200 pairs of pack 9: recall, precision and direction against Argon, beside reader v13 on the same pairs
    (0.524 / 0.733 / 1.0 in Codex's evaluation); each loss attributed to its step: not in the skeleton (parse), quote
    dropped by the check, excluded by code, ambiguous and rejected by the model, wrong stance
  no_tuning: "the parse and ambiguous-pair prompts are written before the run and not revised on pack 9's positives; a fix of a schema or code bug is allowed and recorded"
  go_to_stage_1_if: "recall at least reader v13's (0.52) and precision not lower than 0.65; with 21 positives the interval is wide, so the loss attribution decides what to change"
  cost: "estimated 0.6-1.0 USD (189 papers; 0.15 / 0.60 USD per million tokens off-peak; the output with a quote per field dominates); the exact count from a dry run of the real prompts before any call; run only with the user's consent, off-peak"
