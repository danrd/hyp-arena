id: readiness-recognition-2026-11-18
status: "offline diagnostic completed; production recognition and unknown-readiness aggregation fixes applied 2026-11-19"
question: Does selecting the existing readiness rule by intervention type prevent unresolved compounds from being treated as ready?
candidate: >-
  Use the existing phase ladder for a fully recognised compound intervention. If a compound intervention cannot be
  resolved completely, readiness is unknown. Missing or unspecified interventions are unknown. Keep the existing
  non-compound convention for explicit types and keep the maximum phase rule where all drug components are recognised.
  A resolver returning no record and a resolver error both leave readiness unknown. The existing resolver interface
  does not always distinguish a failed lookup from an absent match.
scope: >-
  Compare readiness separately and show the legacy feasibility for diagnosis. Do not change the score denominator,
  treatment of gene and cell interventions, phase ordering, weights, or production rules in this comparison.
pass_rule:
  - "Unresolved compound, partial combination, unspecified intervention and lookup failure never return 1 solely from absent data."
  - "Confirmed phase 4, phase 1–3, phase 0, and an explicitly specified exercise intervention preserve their scores."
  - "Offline replay uses a frozen cache, distinguishes cached misses from absent cache keys, and does not treat uncached labels as verified negatives."
command: "python -m scripts.scoring.readiness_recognition_check [--cases /path/to/private/cases.json]"
result:
  synthetic: "9/9 expected outcomes. Unresolved, partial and unspecified move from 1 to unknown. Confirmed phases, the named exercise, empty input and service failure behave as specified."
  saved_cards: "10 pilot cards. The six compound-labelled cards have absent keys in the local cache. Under that frozen condition all six move from 1 to unknown. Four explicit non-compound cards are unchanged. The replay does not establish true drug stages or whether live lookup would find a match."
  boundary: "The old feasibility formula still averages over known values. Test the fixed denominator separately before changing the ranking. Gene and cell readiness needs its own rule."
production_2026_11_19: >-
  The implemented rule additionally returns unknown for an unclassified intervention or a recognised compound without
  phase metadata. It distinguishes lookup failure from no match. Confirmed phases and the aggregation of known components
  retain their prior scale. The diagnostic script retains the original baseline and candidate for replay.
production_aggregation_2026_11_19:
  rule: "Always include readiness in the feasibility denominator; use a contribution of 0 for unknown readiness and preserve the resolver's reason."
  concealment_check: >-
    Hold system, duration and sample size fixed. Mask a stated intervention after scoring it with each confirmed phase
    and the explicit non-compound status. The masked score must not rise. Check the same zero contribution for absent
    matching, missing phase, lookup error and an incompletely resolved combination. For source review, compare all stated
    components with the card before interpreting a confirmed score.
  pilot: >-
    On the frozen ten-card pilot, applying the new rule lowers feasibility for six cards with unknown readiness.
    Maximum rank changes from the preceding readiness-and-n version are two places in Funding and two in Frontier;
    the Evidence ranking is identical.
