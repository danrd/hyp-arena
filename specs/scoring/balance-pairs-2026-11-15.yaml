id: balance-pairs-2026-11-15
written_on: 2026-11-15
status: "definitions fixed before the pack was sent"
why: >-
  Stage 5 (link strength and the evidence balance) rests on the record weights. The only outside check of their order is
  Argon pack 5 (80 pairs, v3.5 weights, 2026-11-08): tau-b 0.10, a weak order; there a meta-analysis was put after a trial
  by our weights in 7 of 7 pairs and first by Argon. v3.6 changed the weights (GRADE-shaped, a meta-analysis by its
  certainty) without a new outside check. Pack 23 checks the current weights on more pairs.
pool: "the records of the 60 prospective hypotheses (run_60.json), current weights (hyparena/scoring/rules_v32.record_weight_v36); pairs of records of one link with distinct PMIDs; the pairs of pack 5 left out"
strata: "the factor with the largest |log ratio| between the two records (design, precision, effect, comparison, context); a meta-analysis against an RCT as its own stratum; near-ties (|log wA/wB| < 0.15); 25 each, at most 4 pairs per link; order by SHA-1; a stratum short of pairs filled from the others and reported"
built: "175 pairs and 20 swapped repeats in 3 parts of 65 (218 records, 56 claims): precision 48, meta-analysis against trial 46, effect 26, near-tie 29, comparison 15, design 11, context 0 (the pool has almost no adjacent-context pairs); scripts/argon/pack23_balance.py; files in longevity-kg reviews/argon-2026-11-15/"
shown: "the claim; for each record PMID, title, abstract, the quote our reader took and whether it read it as for or against; not shown: weights, factors, levels"
asked: "per pair: stronger as evidence about the claim whatever its direction (A / B / equal), confidence 1-3, reason codes; per record: design, n, context, certainty of a meta-analysis, effect phrase"
measures:
  order: "Kendall tau-b between Argon's order (A 1, equal 0, B -1) and sign(log wA/wB) with |log wA/wB| < 0.1 as a tie; concordance among pairs neither calls equal; per stratum"
  repeatability: "agreement of the 20 swapped repeats (the ceiling of the order measures)"
  labels: "agreement of design, n, context and meta-analysis certainty with our reader's"
reading: >-
  written before the answer: the current weights order records acceptably when the concordance is at least 0.65 overall;
  a stratum with concordance under 0.5 (at least 10 non-tied pairs) means the weights order that factor against the outside
  reader and goes to the method's review; Argon is a second reader, not a gold standard
baseline: "later and paid: a plain LLM orders the same pairs (the price named before)"
result_2026_11_15:
  answers: "all 195 items and 218 records answered (longevity-kg reviews/argon-2026-11-15/pack_23_{1,2,3}_answer.json); score pack_23_score.json"
  order: "tau-b 0.258 (pack 5 with the v3.5 weights: 0.10); concordance among the 144 pairs neither calls equal 0.646; Argon calls 1 pair equal"
  repeatability: "20 of 20 swapped repeats agree"
  per_stratum: {comparison: "14 of 15", design: "8 of 11", effect: "18 of 26", precision: "32 of 48", near_tie: "5 of 8", meta_vs_trial: "16 of 36"}
  meta_vs_trial: "Argon puts the meta-analysis first in 38 of 46 pairs; our weights put the trial first in 16 of those and call 8 even: a meta-analysis whose certainty is not stated weighs 0.75 of a trial (review_kind.NOT_REPORTED), and our reader recorded no certainty for any of them; Argon reads 'not stated' in 38 of 46 and still puts the meta-analysis first"
  labels: "design agrees in 213 of 218 records"
  by_the_reading: "concordance 0.646, just under 0.65: not acceptable as written; the meta-analysis-against-trial stratum (0.44, 36 non-tied pairs) orders against the outside reader and goes to the method's review; the other strata are 0.67-0.93"
method_change_2026_11_15:
  change: "a meta-analysis whose certainty is not stated weighs as a trial (hyparena/reading/review_kind.NOT_REPORTED 0.75 -> 1.0)"
  pack_23_again: "concordance 0.646 -> 0.688 (154 non-tied pairs), meta-analysis against trial 16 of 36 -> 28 of 45; in sample: the rule was changed on this pack, so this shows the direction only"
  outcomes: "AUC of the evidence balance on the 30 trials of pack 18 with the working reader 0.710 -> 0.705"

