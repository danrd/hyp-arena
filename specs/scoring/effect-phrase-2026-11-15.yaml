id: effect-phrase-2026-11-15
written_on: 2026-11-15
status: variants and the rule fixed before any variant was scored
why: >-
  The effect factor of a record for is 1 for a stated effect of at least medium size and 1/2 otherwise; the size is read by
  code from the verbatim effect phrase. A count on the saved runs (scripts/reading/effect_phrases.py; 297 records for on the
  outcome links of the 30 trials of pack 18, working reader) shows where the phrase gives no size: no phrase 91, a number
  without an interval 111 (two values 30, a bare percent or share 23, a p value only 18, means with their spread 15, one
  difference in units 7, other 17), words only 23, an interval the parser does not read 5; a ratio or a standardised
  difference 28, a percent or the authors' word 23, a raw difference with its interval already converted 17. The case the
  backlog named (an unstandardised effect with a stated interval left unclear) is 5 records; a table of clinically
  important differences per measure would cover little (SPPB 4 records, gait speed 6; 112 of the 229 records without a
  class name none of 15 common measures). So the candidates are parser extensions, not a reader change.
cost: free (saved runs and packs, no model call)
variants:
  E1_interval: >-
    the interval parser also reads unit words between the difference and the interval ("0.86 points on the SPPB scale (95%
    CI 0.32, 1.41)"), "CI = 62-123", "95% C.I. = 1.2-3.6", an interval in braces ("46 m {20;72}"), and "SMD final value:
    0.18". The rule itself (d from the difference, the interval and n) is unchanged
  E2_means: >-
    two means with their standard deviations (two groups, or before and after): d = |m1 - m2| / sqrt((s1^2 + s2^2) / 2). One
    mean with a spread alone is not read (a change divided by the spread of the change overstates)
  E3_two_values: >-
    "from X to Y": the relative change |Y - X| / |X| by the percent thresholds (5 and 20); "X vs Y", "X versus Y", "X
    compared with Y" with both of one sign: the ratio of the larger to the smaller by the ratio thresholds (1.25 and 2);
    values of opposite sign or zero are not read
  E4_p_value: >-
    a p value with a known n: z from the two-sided p, d = 2 z / sqrt(n) between groups, z / sqrt(n) within a group (the
    conversion of the Cochrane Handbook, section 6.5.2.3); "p < x" gives the lower bound
  E_all: E1 to E4 together
references:
  R2: a later RCT or meta-analysis of the same link scored from the earlier records (AUC)
  R3: outcomes of the 74 calibration trials, saved v10 runs (AUC of the evidence balance)
  pack23: concordance of the record order with the outside reader (175 pairs)
  auc30: AUC of the evidence balance on the 30 trials of pack 18, working reader (and reader v16)
  moved: how many records for change their effect factor from 1/2 to 1 under the variant (30 trials, working reader)
rule:
  E1: a parser fix of an accepted rule; it enters unless a reference gets worse by more than 0.03
  E2_E3_E4: >-
    a variant enters only when no reference gets worse by more than 0.03 against the current code and at least one of R2 or
    pack23 does not fall; a variant that moves fewer than 5 records decides nothing and stays out (simpler wins)
  known_risk: counting any stated effect as full lowered the AUC on the 30 trials (specs/scoring/weight-sources-2026-11-15.yaml, F5); E3 is the nearest to it
script: scripts/scoring/effect_variants.py -> longevity-kg reviews/argon-2026-11-15/effect_variants.json

result_2026_11_15:
  table:    # R2, R3, pack23, auc30 working reader, auc30 reader v16, records moved to the full effect factor
    current:       [0.695, 0.602, 0.669, 0.674, 0.692, 0]
    E1_interval:   [0.695, 0.602, 0.669, 0.679, 0.696, 3]
    E2_means:      [0.697, 0.598, 0.658, 0.679, 0.692, 13]
    E3_two_values: [0.688, 0.587, 0.669, 0.661, 0.679, 19]
    E4_p_value:    [0.693, 0.595, 0.662, 0.674, 0.696, 6]
    E_all:         [0.688, 0.577, 0.652, 0.670, 0.683, 38]
  by_the_rule:
    E1: passes (no reference worse; a fix of the accepted interval rule; 3 records)
    E2: passes (no reference worse by more than 0.03; R2 does not fall); pack23 falls by 0.011
    E3: >-
      passes the letter of the rule (no reference worse by more than 0.03; pack23 does not fall), but R2, R3 and both AUCs
      fall: the known risk
    E4: fails (R2 and pack23 both fall)
    E_all: fails (R2 and pack23 both fall)
  reading: >-
    every difference is inside the noise of the references (R2 about +-0.09, the AUC on 30 trials about +-0.2): the
    extensions do not improve the order. The effect factor as it stands loses little by leaving these phrases unclear.
  decision: "E1 adopted 2026-11-15 (hyparena/reading/effect_class.py, EXTRA = interval; manual section 4); E2, E3, E4 not adopted, kept in the code switched off"

argon_pack27:
  written_on: 2026-11-15
  status: definitions fixed before the pack was sent
  why: >-
    the thresholds of the effect class are conventions (0.5 and 0.8 for a standardised difference, 1.25 and 2 for a ratio)
    or working values without a published ground (5% and 20% for a percent change); the weight uses one line only (at
    least medium). Pack 24 asked whether the effect factor is justified, not where its line lies.
  pack: longevity-kg reviews/argon-2026-11-15/pack_27_task.json; builder and check scripts/argon/pack27_effect_thresholds.py
  asked: >-
    six items (standardised difference; ratios and their conversion; percent change; the conversion from an interval;
    minimal clinically important differences of ten common measures in older adults; one line or three classes and the
    unknown size): up to 6 sources each with PMID, numbers and a verbatim quote, a verdict on our value and a suggested value
  check: every PMID exists, the title matches, the quote is verbatim in the abstract (code)
  rule: >-
    a suggested threshold or rule is not adopted from the answer: it is scored as a variant on the references of this spec
    (R2, R3, pack 23, the AUC on 30 trials) under the same rule (no reference worse by more than 0.03; simpler wins among
    equals). A threshold the sources call groundless (verdict drop) may be removed when its removal passes the same rule.

argon_pack27_result_2026_11_16:
  check: "36 sources, all exist, titles match, quotes verbatim; the 12 PMIDs of the MCID table exist"
  verdicts:
    T1_standardised_difference: "too_high: the median effect is 0.3-0.4 in gerontology and rehabilitation, 0.2 across Cochrane trials; suggested line 0.35 (or 0.40)"
    T2_ratios: "too_low for odds ratios (OR 1.25 is d 0.12; d 0.35 is OR 1.89, d 0.5 is OR 2.47); risk and hazard ratios apart: 1.33 appreciable, 2 large (GRADE)"
    T3_percent: "drop: a percent change without its variability has no ground (the same percent is a large or a negligible effect by the measure's variation)"
    T4_interval: "supported (Cochrane Handbook 6.5.2.3); corrections for unequal groups, small samples and adjusted estimates"
    T5_mcid: "too_high: a table of ten measures (SPPB 0.5 points, gait speed 0.05 m/s, 6-minute walk 20 m, grip 5 kg, MMSE 1-3, MoCA 1-2)"
    T6_one_line: "supported: one line; large effects of small trials shrink on replication"
  found_in_the_code: >-
    for a ratio the weight already converts by ln(ratio) * sqrt(3) / pi and asks d 0.5 (an odds ratio of 2.47), not 1.25
    as the manual's weight table says; 1.25 is only the class label. The manual and the code disagree on ratios
  variants:      # scripts/scoring/effect_variants.py thresholds: R2, R3, pack23, auc30 working reader, auc30 reader v16, records to the full factor, to the half
    current:                       [0.695, 0.602, 0.669, 0.679, 0.696, 0, 0]
    T1_line_0.40:                  [0.691, 0.602, 0.667, 0.679, 0.688, 6, 0]
    T1_line_0.35:                  [0.688, 0.606, 0.669, 0.683, 0.696, 9, 0]
    T2_risk_ratios_from_1.33:      [0.699, 0.602, 0.665, 0.656, 0.688, 5, 0]
    T3_percent_unknown:            [0.685, 0.604, 0.684, 0.696, 0.723, 0, 13]
    T5_mcid:                       [0.693, 0.602, 0.669, 0.679, 0.701, 2, 0]
    T1_0.35_T2_T3_T5:              [0.678, 0.607, 0.682, 0.670, 0.696, 16, 13]
  by_the_rule: >-
    no variant is worse than the current code by more than 0.03 on any reference, and none is better by more than the
    noise. T3 removes a threshold the sources call groundless and passes: it may be removed. T1, T2 and T5 change values
    without a gain; T5 moves 2 records
  decision: "2026-11-16: T3 adopted (a percent change without its variability is unclear; effect_class.PERCENT = False); T1, T2, T5 not adopted; the manual's weight table corrected for ratios to what the code does"

corrections_2026_11_16:
  what: >-
    the remaining suggestions of pack 27 as variants on the working code (scripts/scoring/effect_variants.py corrections):
    T4, the interval conversion with Student's t and Hedges' J under 60 participants, and a before-after interval scaled
    by sqrt(2 (1 - r)) with r 0.7; T6, the effect factor full only from 60 or 100 participants, and d shrunk towards the
    field's median 0.3 with k 50 or 100
  table:      # R2, R3, pack23, auc30 working reader on the saved runs, auc30 reader v16, records moved to the half factor
    working:               [0.685, 0.604, 0.684, 0.696, 0.723, 0]
    T4_small_samples:      [0.685, 0.604, 0.684, 0.696, 0.723, 0]
    T4_paired_r_0.7:       [0.685, 0.604, 0.684, 0.696, 0.723, 1]
    T6_bonus_from_n_60:    [0.684, 0.604, 0.684, 0.692, 0.719, "not counted: applied in the record weight"]
    T6_bonus_from_n_100:   [0.684, 0.604, 0.684, 0.692, 0.710, "not counted: applied in the record weight"]
    T6_shrink_k_50:        [0.687, 0.605, 0.671, 0.692, 0.719, 2]
    T6_shrink_k_100:       [0.684, 0.605, 0.671, 0.692, 0.719, 3]
  note: pack 23 is recomputed through the effect factor alone, so the sample-size condition of T6 does not show there
  reading: >-
    the corrections move 0 to 3 records of 297: an interval with a known n is rare (17 to 20 records), and the records
    with a readable large effect mostly come from samples above 60. None changes a reference beyond 0.013
  decision: "none adopted: no gain and more rule; the switches stay in the code, off (effect_class.SMALL_SAMPLE, PAIRED_R; rules_v32.EFFECT_MIN_N, EFFECT_SHRINK_K)"

adopted_2026_11_16:
  rule_applied: >-
    the rule of the record weight (specs/scoring/record-weight-2026-11-08.yaml): among variants not worse by more than
    0.03, the simpler or the one nearer the published standard wins. "No gain" was the wrong reason to keep our own values
  adopted:
    T1: "the line of medium for a standardised difference 0.35 (large from 0.7): rules_v32.EFFECT_MEDIUM_D, effect_class.SMD_MEDIUM"
    T4_small_samples: "Student's t and Hedges' correction under 60 participants: effect_class.SMALL_SAMPLE"
    T5: "a raw difference without its variability that reaches the measure's MCID counts as medium: nine measures (effect_class._MCIDS); from the working reader's fields (measure, numbers, unit), from the phrase for earlier records"
  not_adopted: "T6 (shrinkage, a sample-size condition) and the before-after scale of T4: their parameters (k, the target, r) are not given by the sources"
  references_after:      # R2, R3, pack23, auc30 working reader on the saved runs, auc30 reader v16
    before_pack_27: [0.695, 0.602, 0.669, 0.679, 0.696]
    working_2026_11_16: [0.675, 0.608, 0.684, 0.688, 0.723]
  ratios:
    status: "adopted 2026-11-16: a risk, hazard or rate ratio is medium from 1.33 (0.75) and large from 2; an odds ratio and an n-fold change stay on the conversion (medium from 1.89, large from 3); rules_v32.RISK_RATIO_LINE, effect_class.RISK_RATIO, ODDS_RATIO"
    data: >-
      45 records for with a ratio in the three pools (30 trials 24, 74 trials 8, 60 trials 13): 20 odds ratios, 25 risk,
      hazard or rate ratios; of the 25, 12 are under 1.33, 9 between 1.33 and 1.89, 4 above
    variants: {from_1.25: [0.679, 0.607, 0.682, 0.652, 0.692], from_1.33: [0.678, 0.607, 0.682, 0.670, 0.696], from_1.5: [0.675, 0.608, 0.684, 0.683, 0.714]}
    what_moves: >-
      at 1.33 four of the 30 trials change their balance, two of them visibly, both with a null outcome: NCT04796701
      (0.56 to 0.73: an RCT of 840 with IRR 0.67 for readmissions and an RCT of 222 with HR 0.28) and NTR3980 (0.84 to
      0.90: an RCT of 201 with HR 1.84 for ADL improvement). The fall of the AUC is these two trials
