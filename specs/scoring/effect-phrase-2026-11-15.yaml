  table:    # R2, R3, pack23, auc30 working reader, auc30 reader v16, records moved to the full effect factor
    current:       [0.695, 0.602, 0.669, 0.674, 0.692, 0]
    E1_interval:   [0.695, 0.602, 0.669, 0.679, 0.696, 3]
    E2_means:      [0.697, 0.598, 0.658, 0.679, 0.692, 13]
    E3_two_values: [0.688, 0.587, 0.669, 0.661, 0.679, 19]
    E4_p_value:    [0.693, 0.595, 0.662, 0.674, 0.696, 6]
    E_all:         [0.688, 0.577, 0.652, 0.670, 0.683, 38]
  by_the_rule:
    E1: passes (no reference worse; a fix of the accepted interval rule; 3 records)
    E2: passes (no reference worse by more than 0.03; R2 does not fall); pack23 falls by 0.011
    E3: >-
      passes the letter of the rule (no reference worse by more than 0.03; pack23 does not fall), but R2, R3 and both AUCs
      fall: the known risk
    E4: fails (R2 and pack23 both fall)
    E_all: fails (R2 and pack23 both fall)
  reading: >-
    every difference is inside the noise of the references (R2 about +-0.09, the AUC on 30 trials about +-0.2): the
    extensions do not improve the order. The effect factor as it stands loses little by leaving these phrases unclear.
  decision: "E1 adopted 2026-11-15 (hyparena/reading/effect_class.py, EXTRA = interval; manual section 4); E2, E3, E4 not adopted, kept in the code switched off"

argon_pack27:
  written_on: 2026-11-15
  status: definitions fixed before the pack was sent
  why: >-
    the thresholds of the effect class are conventions (0.5 and 0.8 for a standardised difference, 1.25 and 2 for a ratio)
    or working values without a published ground (5% and 20% for a percent change); the weight uses one line only (at
    least medium). Pack 24 asked whether the effect factor is justified, not where its line lies.
  pack: longevity-kg reviews/argon-2026-11-15/pack_27_task.json; builder and check scripts/argon/pack27_effect_thresholds.py
  asked: >-
    six items (standardised difference; ratios and their conversion; percent change; the conversion from an interval;
    minimal clinically important differences of ten common measures in older adults; one line or three classes and the
    unknown size): up to 6 sources each with PMID, numbers and a verbatim quote, a verdict on our value and a suggested value
  check: every PMID exists, the title matches, the quote is verbatim in the abstract (code)
  rule: >-
    a suggested threshold or rule is not adopted from the answer: it is scored as a variant on the references of this spec
    (R2, R3, pack 23, the AUC on 30 trials) under the same rule (no reference worse by more than 0.03; simpler wins among
    equals). A threshold the sources call groundless (verdict drop) may be removed when its removal passes the same rule.

argon_pack27_result_2026_11_16:
  check: "36 sources, all exist, titles match, quotes verbatim; the 12 PMIDs of the MCID table exist"
  verdicts:
    T1_standardised_difference: "too_high: the median effect is 0.3-0.4 in gerontology and rehabilitation, 0.2 across Cochrane trials; suggested line 0.35 (or 0.40)"
    T2_ratios: "too_low for odds ratios (OR 1.25 is d 0.12; d 0.35 is OR 1.89, d 0.5 is OR 2.47); risk and hazard ratios apart: 1.33 appreciable, 2 large (GRADE)"
    T3_percent: "drop: a percent change without its variability has no ground (the same percent is a large or a negligible effect by the measure's variation)"
    T4_interval: "supported (Cochrane Handbook 6.5.2.3); corrections for unequal groups, small samples and adjusted estimates"
    T5_mcid: "too_high: a table of ten measures (SPPB 0.5 points, gait speed 0.05 m/s, 6-minute walk 20 m, grip 5 kg, MMSE 1-3, MoCA 1-2)"
