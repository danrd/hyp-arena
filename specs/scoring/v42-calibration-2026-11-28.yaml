    version: trial-8
    tiers:
      - [chain_state]
      - [feasibility]
      - [I, W]
      - [trend_pubmed, ai_role, N]
      - [endpoint_clinical, best_design_outcome, independent_outcome]
  attention_momentum:
    min_pubmed_base: 15
    min_preprint_base: 10
    min_trials_base: 6
    review_hype_discount_above_share: 0.50
  ai_leverage:
