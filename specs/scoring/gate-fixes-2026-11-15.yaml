id: gate-fixes-2026-11-15
written_on: 2026-11-15
status: "rule written before the evaluation; evaluated 2026-11-15; G2 adopted 2026-11-15 as G2a (exact or class), G1 not"
why: >-
  The gate filters a hypothesis when a key link has a top-design (RCT or meta-analysis) between-group record against it in
  the claim's exact context and no such record for it (hyparena/scoring/rules_v3.strong_refutation). With reader v17 and the
  cross-link reading the AUC of the evidence balance on the 30 trials of pack 18 fell from 0.705 (v16) to 0.580; the gate
  filtered two positive trials (NCT03477097, NCT03600402) and one negative (NCT04796701). In all three the records for the
  link are RCTs or meta-analyses of the same kind of intervention (context "class"), which the gate does not count as a
  counterweight; in NCT03600402 the null RCT has 32 participants.
variants:
  G1_named_outcome: >-
    a record against counts for the gate only when its quote names the claim's outcome (the object of the link or its
    stated measure): a content word of the outcome (4 letters or more, compared on its first 5 letters) appears in the quote.
    A lexical check, since the record has no outcome-match field.
  G2_counterweight_any_context: >-
    a top-design between-group record for the link counts as a counterweight in any counting context (exact, class or
    adjacent), not only in the exact one.
  G1_and_G2: both.
references:
  - "R3: AUC of the evidence balance on the calibration trials (74 trials, saved v10 runs), the filtered taken as -1"
  - "AUC of the evidence balance on the 30 trials of pack 18 with reader v17 + cross-link (run_*_n15x) and reader v16 (run_*_n14x)"
  - "the count of filtered trials among the negative and the positive ones, per reference"
pass_rule: >-
  A variant enters through the manual only when none of the three AUCs gets worse by more than 0.03 against the current
  rule, and it does not lift the gate on more negative trials than positive ones over the references together. The trials
  whose gate changes are listed with the records that decide them.
code: "switches GATE_OUTCOME_NAMED and GATE_SUPPORT_CONTEXTS in hyparena/scoring/rules_v3.py (defaults: the current rule); scripts/scoring/gate_variants.py"
result_2026_11_15:
  file: "longevity-kg reviews/argon-2026-11-15/gate_variants.json"
  current: "R3 0.602, AUC 30 trials 0.598 (v17) / 0.714 (v16); filtered: R3 negative NCT04354896; v17 positive NCT03477097, NCT03600402, negative NCT04796701; v16 negative NCT04796701"
  G1_named_outcome: "R3 0.602, AUC 0.645 / 0.714; lifts NCT03600402 (positive) and NCT04354896 (negative): passes by the count, but both by an artefact of the lexical check - in NCT03600402 the null RCT is on ankle range of motion, the claim's own measure, written 'ROM'; in NCT04354896 (levothyroxine, TRUST, n 737) the quote says 'secondary-outcome measures' without naming them. The check does what the rule asks, not what it means"
  G2_counterweight_any_context: "R3 0.602, AUC 0.674 / 0.692; lifts NCT03477097 and NCT03600402 (positive; RCTs of the same kind of intervention on frailty and ankle range of motion) and NCT04796701 in both runs (negative; transitional care, 10 RCTs and 2 meta-analyses of the same kind for fewer readmissions against one null RCT of 544): passes"
  G1_and_G2: "R3 0.602, AUC 0.674 / 0.692; lifts 2 positive and 3 negative: fails"
  reading: "G2 passes the rule and removes the drop of the AUC under reader v17; G1 should not enter as a lexical check - an outcome-match field of the reader would be needed to test it"
adoption_2026_11_15:
  adopted: "G2a: the counterweight in the exact context or of the same class of intervention, not an adjacent population (rules_v3.GATE_SUPPORT_CONTEXTS)"
  why_not_any_context: "with any context, tests/test_rules_v3.py::test_levothyroxine_restated_trial_triggers_the_gate fails: an RCT of 71 in another population with a small effect would cancel the TRUST null (n 737) in the claim's own population, a refutation the method should keep"
  references: "G2a gives the same as G2 on every reference (R3 0.602, AUC 0.674 / 0.692; the same trials lifted): in all three the counterweight is of context class"
  manual: "docs/method/manual.md section 6"
