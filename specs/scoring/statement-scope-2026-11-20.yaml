id: statement-scope-2026-11-20
status: draft for offline replay
baseline: manual v3.11 and blind judge v2
pool: Keep the original candidates and all their pairs. The evaluation stage attaches reasons and changes scoring inputs. There is no additional reviewer or admission step.
assessment_in_regular_evaluation:
  contribution: State what the available evidence already establishes and what the proposed test adds. Cite applicable records across the chain and the dossier, including intermediate links. A single closest publication is optional.
  contrast: For a new causal link, identify the comparison and result that distinguish the link from a competing explanation. For a modified intervention, compare against the unmodified intervention or an equivalent active comparator that isolates the change.
  scope: Record the claim level and the level directly tested. A patient claim can have a genuine new contribution tested only in an animal or tissue prerequisite.
  implementation: Record the specific means required for the experiment and the evidence it is ready for that use. Record the least ready indispensable component.
  critical_link:
    contribution: Isolate the proposition on which the claimed scientific contribution depends. Record it as an author-grounded link or an explicit comparison, with the proposed system, measure and outcome that would disconfirm it. For a modified intervention, distinguish the added effect against the original intervention or equivalent active control from the underlying effect.
    required_roles: Identify the stated outcome and the claim that supplies the new contribution, when novelty is claimed. One link may fulfill both roles when the new contribution is the effect on that outcome or an incremental effect supported by its own comparison. Count such a link once. A different label or proxy for the same established outcome follows the existing novelty rules.
    prerequisite: Record a required measurement, delivery or selective target engagement when failure would prevent or invalidate the contrast. It affects readiness. It earns scientific novelty as a separate link when the proposed experiment explicitly tests the prerequisite as a new claim.
    mechanism: For an asserted causal pathway, identify the target or mediating process and the link that connects it to the outcome. Record delivery and engagement separately when they can fail independently and matter for interpretation. An outcome-only claim can be evaluated on its stated outcome. A step that repeats the intervention and outcome leaves the mechanism unspecified.
    stage: Evaluate evidence in the system of the stated experiment and identify the extra claims required for the proposed use in another species or in humans. A mouse proof-of-concept has its own testable contribution and readiness. Keep the patient delivery gap visible when scoring a patient-level application.
manual_candidate:
  novelty:
    known_context: Cap at new_context when the same scientific question was already tested in the same species and the stated design does not isolate an additional contribution.
    known_transfer: Cap at translation for the corresponding transfer across species. A tested modifier or isolated intervention refinement can retain its supported novelty.
    unresolved: A missing outcome record alone cannot earn a high level. Display the assessment as unknown and test use of the bottom of the existing novelty scale in Frontier until the contribution is supported.
  feasibility:
    assessment_unit: Assess each indispensable means of the stated experiment against the operation it must perform. Match the implementation or a demonstrated equivalent, the study system, the target if relevant, and the operation-critical conditions. Split a device into components only when a component has an independent failure mode that could invalidate the proposed contrast.
    sources: Use observed performance in primary methods and results, validation or calibration studies, or accessible regulatory performance documents. Product and trial registry entries and technical protocols can establish identity or specified operating conditions. An entry or specification alone does not demonstrate observed performance.
    demonstrated: Readiness 1 when observed performance supports the required operation in the stated experimental system and relevant operating conditions. This can come from a validation experiment and does not require that the hypothesis outcome has already been shown.
    preliminary: Readiness 0.5 for an identified implementation with observed performance of the required operation in a relevant but different setting, or with demonstrated critical functions whose integration remains to be validated. Record the exact gap. Evidence for the class or for a different operation alone is insufficient.
    missing: Readiness contributes 0 for an unnamed means or an indispensable operation with no applicable performance evidence. Document an observed failure separately from missing evidence. Keep the readiness slot in the existing feasibility average and include the system, duration and planned sample contributions.
    aggregation: Use the lowest readiness among indispensable means. Record the source and gap for the limiting means. Evaluate distinct proposed stages at their own level when evidence supports only the preliminary stage. Apply within the regular evaluation, without an additional gate.
    direct_claim: Compute feasibility and informativeness for the stated experimental stage. For a patient claim supported by a proposed animal prerequisite alone, test Funding multipliers of 0.90 and 0.75 on that stage's feasibility. Preserve the stage's original value in Frontier and show the gap to testing the patient claim. These multipliers are sensitivity settings.
  unchanged_baseline_axes: Keep the saved evidence weights and their balance fixed in the replay. Keep informativeness of the stated stage as a diagnostic. The existing gate remains a separate baseline calculation.
critical_link_replay:
  status: draft sensitivity check separate from the readiness, scope and novelty replay
  reporting: Show one evidence balance and identify the outcome, the claimed contribution and any missing required link in its breakdown. Use the existing build_mechanism flag when an asserted mechanism lacks a distinct target or process, or its purported step only repeats the intervention and outcome.
  scoring_candidate: When the hypothesis asserts a mechanism or claims an additional causal contribution, test retaining its unverified critical link as a neutral contribution to the signed balance. Reserve one contribution per distinct required slot, even if the assertion has not been written as a usable link yet. Count a link shared by the outcome and the contribution once. Keep evidence against a required link negative. Check whether improving the outcome alone can conceal loss of support for the mechanism.
  monotonicity_check: Holding all other slots fixed, dropping an unsupported or weakly supported critical step from the written chain must not increase the balance. Adding redundant restatements must not increase credit or create additional required slots.
  calibration_cases:
    adaptive_wound_stimulation: H13 and H19 require an independently checked relation between the instrument reading and the target field. The claimed added benefit is the effect of adaptation against the active comparison holding other stimulation features constant. Evidence for generic stimulation can support the background outcome.
    cell_specific_delivery: H01 and H07/H10/H20 require evidence for the proposed engagement or selectivity in the system being scored. Credit an independently testable new method of obtaining selectivity when the author actually proposes and tests one.
    positive_controls: Include outcome-only hypotheses with direct trials, a genuinely new effect on a distinct outcome, a genuine intervention refinement, and a defined preliminary experiment on a nonhuman system. Verify that a shared outcome and contribution link counts once and that each control retains credit at the stated level.
  observed_failure: In an offline diagnostic, excluding the two indirect records from the mechanism slot raised the current signed balance from 0.5393 to 0.8322 for H13 and from 0.5298 to 0.8132 for H19. Including a neutral mechanism slot would give 0.4161 and 0.4066 while preserving the same outcome data. These are diagnostic values, not adopted scores.
judge_candidate: docs/method/judge-instructions-v3-draft.md
implementation_examples:
  - evidence: A published validation reports that the stated instrument measures the required signal in the proposed system and operating conditions.
    readiness: 1
  - evidence: An identified instrument measures the required signal in a closely related system; calibration in the proposed system remains to be demonstrated.
    readiness: 0.5
  - evidence: A registry lists an instrument; the required operation has no reported performance data.
    readiness: 0
  - evidence: A fixed-output device has demonstrated performance, but the proposed comparison needs feedback from a sensor for which no relevant signal measurement has been shown.
    readiness: 0
replay:
  plan: Use the same cards, source records, three profiles and fixed draw seed. Record baseline, novelty-only, feasibility-only and combined results, including abstentions and rank movement. Retain all 190 pairs for the paired v2/v3 judge comparison.
  protections: Preserve H05's phase-specific comparison, H02's contribution at the animal-test level and H19's explicit test of individual adaptation. A clinical ranking cannot credit H10's unnamed compound or claim that the animal H02 experiment directly tests the patient effect.
  limits: The known pool is for development. A new holdout must support any decision to adopt weights, novelty caps or a scope penalty.
diagnostic_replay_2026_11_20:
  method: Frozen 20-card pool, 10000 draws, seed 0. Reproduced all baseline scores and ranks. Compared readiness only, a scope multiplier alone and combined values. Changed feasibility for the listed cases using retrospective case classifications.
  missing_implementation: [H02, H10, H20]
  patient_claim_with_animal_prerequisite: [H01, H02, H07, H20]
  evidence: All scores and ranks unchanged.
  H02_readiness_only: Feasibility 0.625 to 0.375. Funding rank 4 to 8 and score 0.4979 to 0.4496. Frontier rank remains 1 with score 0.6307 to 0.6082.
  H02_scope_only_25_percent: Funding rank 4 to 6 and score 0.4979 to 0.4677.
  H02_combined: Funding remains rank 8 at both scope penalties. Feasibility is 0.3375 at 10 percent and 0.28125 at 25 percent. Scores are 0.4423 and 0.4315, respectively.
  already_penalized: Recomputing missing readiness leaves H10 at feasibility 0.167 and H20 at feasibility 0.292. Both had already received zero for the compound component. H20 alone receives the additional scope adjustment.
  profile_sensitivity: H07 stays at Funding rank 13 with the 10 percent scope penalty and drops to rank 17 with 25 percent.
